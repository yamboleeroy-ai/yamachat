plugins {
    id 'com.android.application'
}

dependencies {
    // Runs YamaBlock's YouTube response filter at document start, before the
    // page can consume the first embedded player response.
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
}

android {
    namespace 'eu.yamachat.yamasearch'
    compileSdk 35

    defaultConfig {
        // The original public 0.1.0 signing password was irrecoverably lost.
        // Use a new, permanent application identity so Android can install this
        // build alongside that legacy package instead of rejecting the signature.
        applicationId 'eu.yamachat.yamasearch.mobile'
        // WebView.setDataDirectorySuffix(), used by the isolated private process,
        // is available from API 28. Keep Android 9 as the real minimum instead
        // of rejecting it one version higher than necessary.
        minSdk 28
        targetSdk 35
        versionCode = Integer.parseInt((findProperty('yamasearchVersionCode') ?: '10003').toString())
        versionName = (findProperty('yamasearchVersionName') ?: '0.1.3-preview').toString()
    }

    signingConfigs {
        release {
            // Signing secrets are injected ONLY by the controlled release workflow.
            // Never commit a keystore or use the Android debug signature for public updates.
            def signingPath = System.getenv('YAMASEARCH_KEYSTORE_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('YAMASEARCH_STORE_PASSWORD')
                keyAlias System.getenv('YAMASEARCH_KEY_ALIAS')
                keyPassword System.getenv('YAMASEARCH_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Preview builds must coexist with the permanently signed public app.
            // Sharing the release applicationId made Android reject a later public
            // install because the debug and release certificates are different.
            applicationIdSuffix '.preview'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDirs += ["$buildDir/generated/yamasearch-res"]
            assets.srcDirs += ["../../Assets"]
        }
    }
}

// Reuse the REAL desktop YamaSearch emblem without copying or replacing binary assets.
tasks.register('prepareYamaSearchIcon', Copy) {
    from(file('../../Assets/YamaSearch-symbol-256.png'))
    into(layout.buildDirectory.dir('generated/yamasearch-res/drawable-nodpi'))
    rename { 'yamasearch_logo.png' }
}
tasks.named('preBuild').configure {
    dependsOn('prepareYamaSearchIcon')
}
