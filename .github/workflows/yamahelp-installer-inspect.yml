name: Inspect YamaHelp installer metadata

on:
  push:
    branches:
      - preview/yamahelp-full-header-logo
    paths:
      - '.github/workflows/yamahelp-installer-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download current installer
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-latest.exe -o setup.exe
          ls -lh setup.exe
      - name: Inspect Inno Setup metadata
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq innoextract
          echo '--- innoextract info ---'
          innoextract --info setup.exe || true
          echo '--- strings likely metadata ---'
          strings -el setup.exe | grep -Ei 'YamaHelp|AppId|LocalAppData|Programs|Lukas|Hubacek|Publisher|unins|desktop|start menu' | head -200 || true
          echo '--- ASCII strings likely GUIDs ---'
          strings setup.exe | grep -E '\{[0-9A-Fa-f-]{20,}\}|YamaHelp|LocalAppData|Programs' | head -200 || true
