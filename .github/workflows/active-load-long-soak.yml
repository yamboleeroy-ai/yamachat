name: Isolated active 150-user long soak
on:
  push:
    branches:
      - audit/load-stress-20260929
    paths:
      - .github/workflows/active-load-long-soak.yml
permissions:
  contents: read
jobs:
  soak150:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate shared client
        run: node scripts/build-web.mjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run 150-user ten-minute active soak
        env:
          YC_ACTIVE_USERS: '150'
          YC_SOAK_SECONDS: '600'
          YC_VOICE_FRACTION: '0.40'
          YC_VOICE_ROOM_SIZE: '4'
        run: |
          set -o pipefail
          node tests/stability-active-boundary.cjs 2>&1 | tee active-150-long-soak.log
      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-150-long-soak
          path: active-150-long-soak.log
          retention-days: 3
