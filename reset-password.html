<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://bxjvmjdppmqgbxfcowpf.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Obnova hesla | Yamachat</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#172338;background:#eef1f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px}main{width:100%;max-width:460px;background:#fff;border:1px solid #dce2ed;border-radius:20px;padding:36px;box-shadow:0 18px 60px #1723380c}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:750;margin-bottom:32px}.brand img{width:40px;height:40px;border-radius:10px}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:bold;color:#6550be;text-transform:uppercase}h1{font-size:28px;line-height:1.2;margin:12px 0}p{color:#526076;line-height:1.6;font-size:14px}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:bold}input{font:inherit;width:100%;min-height:48px;border:1px solid #bdc8d8;border-radius:9px;padding:12px;color:#172338;background:#fff}button{font:inherit;border:0;border-radius:9px;min-height:48px;width:100%;padding:12px;background:#6550be;color:#fff;font-weight:bold;margin-top:22px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid #bbaaf6;outline-offset:3px}a{color:#5943ab;text-underline-offset:3px}.footer{margin-top:24px;text-align:center;font-size:13px}.notice{padding:12px 14px;border:1px solid #dce2ed;border-radius:9px;background:#f5f7fb;overflow-wrap:anywhere}.error{color:#9e2939;border-color:#e7b8be;background:#fff5f6}.hidden{display:none!important}.hint{font-size:12px;margin:7px 0 0}noscript{display:block;color:#9e2939}@media(max-width:380px){main{padding:24px}h1{font-size:25px}}
  </style>
  <script defer src="./vendor/supabase.js"></script>
  <script defer src="./build/password-recovery.js"></script>
</head>
<body><main>
  <div class="brand"><img src="./icons/icon-192.png" alt="">Yamachat</div>
  <div class="eyebrow">Zabezpečení účtu</div>
  <section id="requestSection">
    <h1>Zapomenuté heslo?</h1>
    <p>Zadej e-mail svého účtu. Pošleme ti odkaz pro nastavení nového hesla.</p>
    <form id="requestForm"><label for="recoveryEmail">E-mail</label><input id="recoveryEmail" type="email" required autocomplete="email" maxlength="254" placeholder="tvuj@email.cz"><button id="requestSubmit" type="submit">Odeslat odkaz pro obnovu</button></form>
  </section>
  <section id="passwordSection" class="hidden">
    <h1>Nastav si nové heslo</h1>
    <p>Vyber si silné heslo, které nepoužíváš u jiných služeb.</p>
    <form id="passwordForm"><label for="newPassword">Nové heslo</label><input id="newPassword" type="password" required minlength="8" autocomplete="new-password" aria-describedby="passwordHint"><p id="passwordHint" class="hint">Použij alespoň 8 znaků. Delší heslo je bezpečnější.</p><label for="confirmNewPassword">Nové heslo znovu</label><input id="confirmNewPassword" type="password" required minlength="8" autocomplete="new-password"><button id="passwordSubmit" type="submit">Uložit nové heslo</button></form>
  </section>
  <p id="recoveryStatus" class="notice hidden" role="status" aria-live="polite" tabindex="-1"></p>
  <p id="retryLink" class="hidden"><a href="./reset-password.html">Poslat nový odkaz</a></p>
  <p class="footer"><a href="https://yamachat.eu/">Zpět na přihlášení do Yamachatu</a></p>
  <noscript>Pro obnovu hesla je potřeba zapnout JavaScript.</noscript>
</main></body></html>
