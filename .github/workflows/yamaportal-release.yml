name: Publish Yamaportal Windows
on:
  workflow_dispatch:
  pull_request:
    paths: ['products/yamaportal/**', '.github/workflows/yamaportal-release.yml']
  push:
    branches: [main]
    paths: ['products/yamaportal/package.json', 'products/yamaportal/package-lock.json', 'products/yamaportal/release-notes/**', 'products/yamaportal/tests/offline-browser.cjs', '.github/workflows/yamaportal-release.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: yamaportal-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
        working-directory: products/yamaportal
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify real offline navigation without account or network
        run: node products/yamaportal/tests/offline-browser.cjs
  build:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.portal-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Yamaportal release metadata
        id: portal-version
        shell: pwsh
        run: |
          $package = Get-Content products/yamaportal/package.json -Raw | ConvertFrom-Json
          if ($package.version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw 'Invalid Yamaportal package version.' }
          $notesPath = "products/yamaportal/release-notes/v$($package.version).json"
          if (-not (Test-Path $notesPath)) { throw "Missing release notes for Yamaportal $($package.version)." }
          $notes = Get-Content $notesPath -Raw | ConvertFrom-Json
          foreach ($field in @('kind','title','summary','details','platforms')) { if ($null -eq $notes.$field -or "$($notes.$field)".Trim().Length -eq 0) { throw "Release notes require $field." } }
          if ($notes.kind -notin @('new-app','update') -or $notes.platforms.Count -lt 1) { throw 'Invalid Yamaportal release kind or platforms.' }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/yamaportal/package-lock.json
      - run: npm ci
        working-directory: products/yamaportal
      - run: npx electron-builder --config electron-builder.json --win --publish never
        working-directory: products/yamaportal
      - uses: actions/upload-artifact@v4
        with:
          name: yamaportal-windows
          path: products/yamaportal/artifacts/*.exe
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: yamaportal-windows
          path: release-assets
      - name: Publish separate Yamaportal prefix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          W='npx --yes wrangler@latest'
          $W r2 bucket list | grep -q yamachat-releases
          cd release-assets
          sha256sum *.exe > SHA256SUMS.txt
          for kind in Setup Portable; do
            file="Yamaportal-$kind-$VERSION-x64.exe"
            test -s "$file"
            $W r2 object put "yamachat-releases/yamaportal/$file" --file "$file" --content-type application/vnd.microsoft.portable-executable --cache-control 'public,max-age=31536000,immutable' --remote
            $W r2 object put "yamachat-releases/yamaportal/Yamaportal-$kind-latest.exe" --file "$file" --content-type application/vnd.microsoft.portable-executable --cache-control no-cache --remote
          done
          $W r2 object put yamachat-releases/yamaportal/SHA256SUMS.txt --file SHA256SUMS.txt --content-type text/plain --cache-control no-cache --remote
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const version=process.env.VERSION;
          const root=process.env.GITHUB_WORKSPACE;
          const notes=JSON.parse(fs.readFileSync(path.join(root,`products/yamaportal/release-notes/v${version}.json`),'utf8'));
          const releasedAt=new Date().toISOString();
          const release={...notes,id:`yamaportal:v${version}`,app:'yamaportal',version,releasedAt};
          const latest={product:'Yamaportal',version,publishedAt:releasedAt,installerUrl:'https://updates.yamachat.eu/yamaportal/Yamaportal-Setup-latest.exe',portableUrl:'https://updates.yamachat.eu/yamaportal/Yamaportal-Portable-latest.exe',notes:release.summary,release};
          fs.writeFileSync('latest.json',JSON.stringify(latest,null,2)+'\n');
          fs.writeFileSync('/tmp/portal-release-entry.json',JSON.stringify(release));
          NODE
          curl -fsSI --retry 5 --retry-delay 10 https://updates.yamachat.eu/yamaportal/Yamaportal-Setup-latest.exe
          curl -fsSI --retry 5 --retry-delay 10 https://updates.yamachat.eu/yamaportal/Yamaportal-Portable-latest.exe
          $W r2 object put yamachat-releases/yamaportal/latest.json --file latest.json --content-type application/json --cache-control 'no-cache,no-store' --remote
          curl -fsS --retry 5 --retry-delay 10 https://updates.yamachat.eu/yamaportal/latest.json | jq -e --arg v "$VERSION" '.product == "Yamaportal" and .version == $v and .release.id == ("yamaportal:v" + $v)' >/dev/null
      - name: Record this published Yamaportal release on the Portal
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s /tmp/portal-release-entry.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B publish-main origin/main
          node scripts/record-portal-release.cjs /tmp/portal-release-entry.json
          git add release-feed.json
          git diff --cached --quiet || git commit -m "Record Yamaportal $VERSION release"
          git push origin HEAD:main
          curl -fsS -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/yamaportal-pages-production.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @- <<JSON
          {"ref":"main","inputs":{"release_id":"yamaportal:v${VERSION}"}}
          JSON
