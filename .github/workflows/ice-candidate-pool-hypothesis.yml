name: ICE candidate pool pressure hypothesis
on:
  push:
    branches:
      - audit/load-stress-20260929
    paths:
      - .github/workflows/ice-candidate-pool-hypothesis.yml
permissions:
  contents: read
jobs:
  candidatepool:
    name: pool0-${{ matrix.users }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        users: [225, 250, 275]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate shared client
        run: node scripts/build-web.mjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run candidate-pool pressure hypothesis
        env:
          YC_ACTIVE_USERS: ${{ matrix.users }}
          YC_SOAK_SECONDS: '60'
          YC_VOICE_FRACTION: '0.40'
          YC_VOICE_ROOM_SIZE: '4'
        run: |
          set -o pipefail
          node tests/stability-active-candidate-pool.cjs 2>&1 | tee pool0-${{ matrix.users }}.log
      - name: Upload hypothesis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool0-${{ matrix.users }}
          path: pool0-${{ matrix.users }}.log
          retention-days: 3
