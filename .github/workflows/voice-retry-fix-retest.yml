name: Voice retry fix retest
on:
  push:
    branches:
      - audit/load-stress-20260929
    paths:
      - .github/workflows/voice-retry-fix-retest.yml
permissions:
  contents: read
jobs:
  retest:
    name: fixed-${{ matrix.users }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        users: [200, 225]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate shared client
        run: node scripts/build-web.mjs
      - name: Verify generated voice retry
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['desktop/desktop-client.html','index.html']){
            const s=fs.readFileSync(f,'utf8');
            if(!s.includes('},12000)'))throw Error(f+' missing 12s voice offer retry');
          }
          NODE
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Retest fixed active load
        env:
          YC_ACTIVE_USERS: ${{ matrix.users }}
          YC_SOAK_SECONDS: '60'
          YC_VOICE_FRACTION: '0.40'
          YC_VOICE_ROOM_SIZE: '4'
        run: |
          set -o pipefail
          node tests/stability-active-boundary.cjs 2>&1 | tee fixed-${{ matrix.users }}.log
      - name: Upload retest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-active-${{ matrix.users }}
          path: fixed-${{ matrix.users }}.log
          retention-days: 3
