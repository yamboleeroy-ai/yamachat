name: Publish YamaConvert Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, for example 1.0.0'
        required: true
        type: string
      versionCode:
        description: 'Increasing Android version code, for example 10000'
        required: true
        type: string
      notes:
        description: 'Short release notes shown in Yamaportal'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yamaconvert-android-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: products/yamaconvert/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ffmpegkit-maintained/yt-dlp-android
          ref: 33a5b092896047f90f34c819926b0ac79683381f
          path: products/yamaconvert/android/.ci/yt-dlp-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build yt-dlp Android runtime with current extractor
        working-directory: products/yamaconvert/android/.ci/yt-dlp-android
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          build_file = Path("library/build.gradle")
          source = build_file.read_text()
          old = 'install "yt-dlp"'
          new = 'install "yt-dlp==2026.08.19"'
          if source.count(old) != 1:
              raise SystemExit("Could not pin the yt-dlp package in the Android runtime source.")
          build_file.write_text(source.replace(old, new))
          PY
          ./gradlew --no-daemon :library:publishToMavenLocal -PVERSION=2.0.3 -x test
      - name: Build the Android JavaScript runtime
        run: bash scripts/build-quickjs.sh
      - name: Test YamaConvert web and downloader
        working-directory: .
        run: |
          node --check products/yamaconvert/pwa/downloads.js
          node --test products/yamaconvert/tests/*.test.cjs products/yamaconvert/downloader/tests/*.test.cjs
      - name: Validate release identity and signing key
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CODE: ${{ inputs.versionCode }}
          KEYSTORE_BASE64: ${{ secrets.YAMACONVERT_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: yamaconvert
          KEY_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$INPUT_CODE" =~ ^[1-9][0-9]*$ ]]
          test "${#KEYSTORE_BASE64}" -gt 100
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yamaconvert-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/yamaconvert-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "YAMACONVERT_KEYSTORE_FILE=$RUNNER_TEMP/yamaconvert-release.jks" >> "$GITHUB_ENV"
          echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$INPUT_CODE" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        env:
          YAMACONVERT_STORE_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_STORE_PASSWORD }}
          YAMACONVERT_KEY_ALIAS: yamaconvert
          YAMACONVERT_KEY_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: E6:ED:B6:3B:36:F4:BF:CB:D4:00:60:2A:2E:0B:03:66:BE:FA:77:9B:3E:8B:FD:15:06:7F:46:73:35:74:23:58
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease -PyamaconvertVersionName="$VERSION" -PyamaconvertVersionCode="$VERSION_CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='eu.yamachat.yamaconvert'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'35'"
          SIGNER=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          ACTUAL=$(printf '%s\n' "$SIGNER" | sed -n -E 's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([0-9a-fA-F:]+)$/\3/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED" || { echo 'APK signing certificate does not match the pinned YamaConvert certificate.'; exit 1; }
          mkdir -p release
          cp "$APK" release/YamaConvert-Android.apk
          (cd release && sha256sum YamaConvert-Android.apk > SHA256SUMS.txt)
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.versionCode }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          TAG="yamaconvert-v${VERSION}-${VERSION_CODE}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then echo "Release tag already exists: $TAG"; exit 1; fi
          gh release create "$TAG" release/YamaConvert-Android.apk release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "YamaConvert Android $VERSION" \
            --notes "$NOTES" \
            --latest

