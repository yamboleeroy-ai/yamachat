name: Restore exact desktop 1.0.78 reference

on:
  push:
    branches:
      - desktop-1.0.78-web-android
    paths:
      - .github/workflows/repair-desktop-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CLIENT_SHA256: d7ba7d308a8bcf24403b3e68e411f5e55592459d9b2965a2cc284c4b95550846
      EXPECTED_SHELL_SHA256: f7d00c0f4e4eaade86ce6515251fba1b7078f61df1b0f063c215eb50ee839be3
      EXPECTED_PACKAGE_SHA256: 366defc973c768c50f068f0dc3717acefe1f9867eb446981f947c1652085104e
      SOURCE_PACKAGE_B64: 

    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-1.0.78-web-android
          fetch-depth: 0

      - name: Install extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Download released desktop 1.0.78
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-release
          gh release download v1.0.78 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Yamachat-Setup-1.0.78.exe" \
            --dir /tmp/yamachat-release

      - name: Extract exact desktop files
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-nsis /tmp/yamachat-app
          7z x /tmp/yamachat-release/Yamachat-Setup-1.0.78.exe -o/tmp/yamachat-nsis -y >/dev/null

          archive="$(find /tmp/yamachat-nsis -type f \( -name 'app-64.7z' -o -name 'app-*.7z' \) | head -n 1 || true)"
          if [ -n "$archive" ]; then
            7z x "$archive" -o/tmp/yamachat-app -y >/dev/null
          else
            cp -a /tmp/yamachat-nsis/. /tmp/yamachat-app/
          fi

          client="$(find /tmp/yamachat-app /tmp/yamachat-nsis -type f -path '*/resources/app/desktop-client.html' | head -n 1 || true)"
          shell="$(find /tmp/yamachat-app /tmp/yamachat-nsis -type f -path '*/resources/app/desktop.html' | head -n 1 || true)"

          if [ -z "$client" ] || [ -z "$shell" ]; then
            echo "Desktop files were not found in the released installer."
            find /tmp/yamachat-nsis -maxdepth 4 -type f | head -n 120
            exit 1
          fi

          test "$(sha256sum "$client" | awk '{print $1}')" = "$EXPECTED_CLIENT_SHA256"
          test "$(sha256sum "$shell" | awk '{print $1}')" = "$EXPECTED_SHELL_SHA256"

          cp "$client" reference/desktop-1.0.78/desktop-client.html
          cp "$shell" reference/desktop-1.0.78/desktop.html
          printf '%s' "$SOURCE_PACKAGE_B64" | base64 -d > reference/desktop-1.0.78/package.json
          test "$(sha256sum reference/desktop-1.0.78/package.json | awk '{print $1}')" = "$EXPECTED_PACKAGE_SHA256"

          rm -f reference/desktop-1.0.78/boot-guard.js
          cat > reference/desktop-1.0.78/SHA256.json <<JSON
          {
            "desktop-client.html": "$EXPECTED_CLIENT_SHA256",
            "desktop.html": "$EXPECTED_SHELL_SHA256",
            "package.json": "$EXPECTED_PACKAGE_SHA256"
          }
          JSON

      - name: Rebuild web from clean desktop reference
        run: |
          set -euo pipefail
          node scripts/check.mjs
          grep -q '<script src="./boot-guard.js"></script>' index.html
          grep -q 'YamachatBootGuard?.begin()' index.html
          test "$(sha256sum reference/desktop-1.0.78/desktop-client.html | awk '{print $1}')" = "$EXPECTED_CLIENT_SHA256"
          test "$(sha256sum reference/desktop-1.0.78/desktop.html | awk '{print $1}')" = "$EXPECTED_SHELL_SHA256"

      - name: Commit repaired reference
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/desktop-1.0.78 index.html
          if git diff --cached --quiet; then
            echo "Reference already matches released desktop 1.0.78."
            exit 0
          fi
          git commit -m "Restore exact desktop 1.0.78 reference"
          git push origin HEAD:desktop-1.0.78-web-android
