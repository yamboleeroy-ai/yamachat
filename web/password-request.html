<div id="ycPasswordRequestBack" aria-hidden="true">
  <div id="ycPasswordRequestCard" role="dialog" aria-modal="true" aria-labelledby="ycPasswordRequestTitle">
    <div id="ycPasswordRequestHead">
      <div><h3 id="ycPasswordRequestTitle">Obnova hesla</h3><p>Zadej e-mail účtu Yamachat. Odkaz pro nastavení nového hesla odešleme přímo odsud.</p></div>
      <button id="ycPasswordRequestClose" type="button" aria-label="Zavřít">×</button>
    </div>
    <form id="ycPasswordRequestForm">
      <label for="ycPasswordRequestEmail">E-mail</label>
      <input id="ycPasswordRequestEmail" type="email" required autocomplete="email" maxlength="254" placeholder="tvuj@email.cz">
      <button id="ycPasswordRequestSubmit" type="submit">Odeslat odkaz</button>
    </form>
    <div id="ycPasswordRequestStatus" role="status" aria-live="polite"></div>
    <p id="ycPasswordRequestHint">Po kliknutí na odkaz v e-mailu se otevře zabezpečená stránka Yamachatu, kde nastavíš nové heslo.</p>
  </div>
</div>
