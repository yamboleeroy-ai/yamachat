name: Build YamaSearch Android preview (no release)

on:
  pull_request:
    paths:
      - 'products/yamasearch/android/**'
      - 'products/yamasearch/Assets/YamaSearch-symbol-256.png'
      - 'tests/yamasearch-android-mobile-browser.cjs'
      - 'tests/yamasearch-android-yamablock.cjs'
      - '.github/workflows/yamasearch-android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: products/yamasearch/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test mobile browser and YamaBlock logic
        run: |
          set -euo pipefail
          node ../../../tests/yamasearch-android-mobile-browser.cjs
          node ../../../tests/yamasearch-android-yamablock.cjs
          node --check app/src/main/assets/yamablock-youtube.js
          mkdir -p build/navigation-test
          javac -encoding UTF-8 -d build/navigation-test \
            app/src/main/java/eu/yamachat/yamasearch/MobileNavigation.java \
            tests/MobileNavigationTest.java
          java -cp build/navigation-test eu.yamachat.yamasearch.MobileNavigationTest
      - name: Prepare Android SDK on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify debug APK is Android YamaSearch
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='eu.yamachat.yamasearch.mobile.preview'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: YamaSearch-Android-DEBUG-preview
          path: products/yamasearch/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
