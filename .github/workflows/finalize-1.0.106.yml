name: Finalize Yamachat 1.0.106

on:
  push:
    branches: [release/finalize-1.0.106]

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify published 1.0.106 main
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const pkg=require('./desktop/package.json');
          if(pkg.version!=='1.0.106') throw new Error('main is not Windows 1.0.106');
          const h=fs.readFileSync('index.html','utf8');
          for(const marker of ['data-yc-platform="pwa"','PRIVACY_POLICY.md','TERMS_OF_USE.md','code-signing podpis']){
            if(!h.includes(marker)) throw new Error('main missing marker: '+marker);
          }
          const m=require('./update-manifest.json');
          if(m.windows?.latestVersion!=='1.0.106') throw new Error('manifest is not 1.0.106');
          if(Number(m.android?.latestVersionCode)!==200606) throw new Error('Android manifest is not versionCode 200606');
          console.log('PASS published main 1.0.106 markers and manifest');
          NODE

      - name: Download already-green release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 36380173489 --repo "$GITHUB_REPOSITORY" --name Yamachat-Windows-1.0.106 --dir release-assets
          gh run download 36380173489 --repo "$GITHUB_REPOSITORY" --name Yamachat-Android --dir release-assets

      - name: Re-verify exact artifacts
        run: |
          set -euo pipefail
          node scripts/verify-release-assets.cjs release-assets
          cd release-assets
          sha256sum Yamachat-Setup-1.0.106.exe Yamachat-Setup-1.0.106.exe.blockmap latest.yml Yamachat-Android.apk > SHA256SUMS.txt

      - name: Create v1.0.106 from verified artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.106 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.0.106 already exists; refusing to replace it.'
            exit 1
          fi
          TARGET="$(git rev-parse HEAD)"
          gh release create v1.0.106 release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Yamachat 1.0.106" \
            --notes-file docs/release-1.0.106.md \
            --latest

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.106 --repo "$GITHUB_REPOSITORY" --json tagName,isLatest,publishedAt,assets
