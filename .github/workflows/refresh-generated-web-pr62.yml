name: Refresh generated web for behavior sync
on:
  push:
    branches: [fix/web-mobile-desktop-behavior-sync-20260927]
permissions:
  contents: write
concurrency:
  group: refresh-generated-web-behavior-sync
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-mobile-desktop-behavior-sync-20260927
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate current deployable web client
        run: node scripts/build-web.mjs
      - name: Commit deterministic generated index
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Generated index.html is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh generated Web/PWA client for behavior sync"
          git push origin HEAD:fix/web-mobile-desktop-behavior-sync-20260927
