name: Extract desktop Yamachat brand asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-mobile-brand.yml"

permissions:
  contents: write

jobs:
  extract-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Download released desktop 1.0.78
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-release
          gh release download v1.0.78 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Yamachat-Setup-1.0.78.exe" \
            --dir /tmp/yamachat-release

      - name: Extract exact desktop titlebar logo
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-nsis /tmp/yamachat-app
          7z x /tmp/yamachat-release/Yamachat-Setup-1.0.78.exe -o/tmp/yamachat-nsis -y >/dev/null
          archive="$(find /tmp/yamachat-nsis -type f \( -name 'app-64.7z' -o -name 'app-*.7z' \) | head -n 1 || true)"
          if [ -n "$archive" ]; then
            7z x "$archive" -o/tmp/yamachat-app -y >/dev/null
          else
            cp -a /tmp/yamachat-nsis/. /tmp/yamachat-app/
          fi
          logo="$(find /tmp/yamachat-app /tmp/yamachat-nsis -type f -path '*/resources/app/build/yamachat-logo-full.png' | head -n 1)"
          test -n "$logo"
          mkdir -p build
          cp "$logo" build/yamachat-logo-full.png
          file build/yamachat-logo-full.png
          test -s build/yamachat-logo-full.png

      - name: Commit brand asset for web/mobile only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/yamachat-logo-full.png
          git diff --cached --quiet && exit 0
          git commit -m "Add exact desktop Yamachat wordmark for mobile [skip ci]"
          git push
