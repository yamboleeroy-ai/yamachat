name: Verify public YamaSearch iOS PWA

on:
  push:
    branches: [main]
    paths:
      - 'products/yamasearch/ios-pwa/**'
      - 'scripts/prepare-cloudflare-pages.mjs'
      - 'scripts/build-web.mjs'
      - '.github/workflows/yamasearch-ios-pwa-public-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare Pages deployment to expose real PWA
        run: |
          set -euo pipefail
          BASE='https://yamachat.eu/yamasearch'
          mkdir -p /tmp/yamasearch-ios-public
          OK=0
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$BASE/?r=$GITHUB_SHA" -o /tmp/yamasearch-ios-public/index.html \
              && grep -q '<title>YamaSearch – iPhone a iPad</title>' /tmp/yamasearch-ios-public/index.html \
              && curl -fsSL --max-time 15 "$BASE/manifest.webmanifest" -o /tmp/yamasearch-ios-public/manifest.json \
              && node -e "const m=require('/tmp/yamasearch-ios-public/manifest.json');if(m.name!=='YamaSearch'||m.display!=='standalone')process.exit(1)" \
              && curl -fsSL --max-time 15 "$BASE/sw.js" -o /tmp/yamasearch-ios-public/sw.js \
              && grep -q "yamasearch-ios-pwa-shell" /tmp/yamasearch-ios-public/sw.js \
              && curl -fsSL --max-time 15 "$BASE/assets/YamaSearch-symbol-256.png" -o /tmp/yamasearch-ios-public/icon.png \
              && test $(wc -c < /tmp/yamasearch-ios-public/icon.png) -gt 1000; then
              OK=1
              break
            fi
            sleep 15
          done
          test "$OK" = 1 || { echo 'iOS PWA is NOT verified on Cloudflare Pages; do not claim release'; exit 1; }
          echo "PASS: $BASE/ serves YamaSearch iOS PWA with install manifest, service worker and icon."
