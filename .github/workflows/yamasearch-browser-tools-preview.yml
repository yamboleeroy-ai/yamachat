name: Build YamaSearch Browser Tools Preview

on:
  push:
    branches:
      - feature/yamasearch-browser-tools-20261006

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore products/yamasearch/YamaSearch.csproj
      - name: Publish preview
        shell: pwsh
        run: |
          $out='products/yamasearch/artifacts/browser-tools-preview'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet publish products/yamasearch/YamaSearch.csproj -c Release -r win-x64 --self-contained false -p:Version=0.3.1-preview -o $out
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          if (-not (Test-Path "$out/YamaSearch.exe")) { throw 'YamaSearch.exe missing' }
          Compress-Archive -Path "$out/*" -DestinationPath 'YamaSearch-Browser-Tools-Preview.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: YamaSearch-Browser-Tools-Preview
          path: YamaSearch-Browser-Tools-Preview.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
