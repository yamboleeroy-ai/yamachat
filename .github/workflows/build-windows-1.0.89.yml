name: Build and publish Yamachat Windows 1.0.89

on:
  push:
    branches:
      - release/windows-1.0.89-context-return
    paths:
      - ".github/workflows/build-windows-1.0.89.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/windows-1.0.89-context-return
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Prepare verified desktop 1.0.81 with visual context only
        run: node scripts/prepare-desktop-1.0.89.mjs

      - name: Verify clean 1.0.81-derived source
        shell: pwsh
        run: |
          $p = Get-Content desktop/package.json | ConvertFrom-Json
          if ($p.version -ne "1.0.89") { throw "Expected rollback desktop 1.0.89" }

          $client = Get-Content desktop/desktop-client.html -Raw
          foreach ($marker in @(
            'id="ycPasswordRequestBack"',
            "Platform Admin · uživatelské účty",
            "Zabanovat účet",
            "Zprávy od Yamachatu",
            "ycServerContextFrame"
          )) {
            if (-not $client.Contains($marker)) { throw "Missing desktop client marker: $marker" }
          }

          foreach ($forbidden in @(
            "ycActiveServerConnectedFrame",
            "__ycActiveServerContextV2",
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext"
          )) {
            if ($client.Contains($forbidden)) { throw "Forbidden old active-server runtime found: $forbidden" }
          }

          $runtime = Get-Content desktop/main.js -Raw
          foreach ($marker in @(
            "function createTray()",
            "new Tray(trayIconForCurrentState())",
            "createTray();",
            "if (behavior === 'tray')",
            "'build',",
            "'icon.ico'"
          )) {
            if (-not $runtime.Contains($marker)) { throw "Missing tray/runtime marker: $marker" }
          }

          if (-not (Test-Path build/installer.nsh)) { throw "Missing NSIS rollback hook" }
          ./scripts/restore-desktop-brand-assets.ps1 -Destination build
          Write-Host "PASS: clean 1.0.81-derived runtime with visual-only active-server glow."

      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Setup
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify packaged client
        shell: pwsh
        run: |
          $appRoot = "desktop/dist/win-unpacked/resources/app"
          $client = Get-Content "$appRoot/desktop-client.html" -Raw

          if (-not $client.Contains("ycServerContextFrame")) { throw "Packaged rollback client missing stable 1.0.85 server context" }
          if ($client.Contains("ACTIVE SERVER DUAL FADE 1.0.86")) { throw "Rollback client still contains 1.0.86 dual-fade visual" }
          if ($client.Contains("ycServerContextTrailLeft")) { throw "Rollback client still contains left dual-fade trail" }
          if ($client.Contains("ycServerContextTrailRight")) { throw "Rollback client still contains right dual-fade trail" }
          foreach ($forbidden in @(
            "ycActiveServerConnectedFrame",
            "__ycActiveServerContextV2",
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext"
          )) {
            if ($client.Contains($forbidden)) { throw "Packaged client contains old active-server runtime: $forbidden" }
          }

          $exe = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.89.exe
          $block = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.89.exe.blockmap
          $latest = Get-Content desktop/dist/latest.yml -Raw
          if ($latest -notmatch "version:\s*1\.0\.89") { throw "latest.yml is not 1.0.89" }

          Write-Host "SETUP_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "SETUP_SIZE=$($exe.Length)"
          Write-Host "BLOCKMAP_SIZE=$($block.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-1.0.89
          path: |
            desktop/dist/Yamachat-Setup-1.0.89.exe
            desktop/dist/Yamachat-Setup-1.0.89.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30


  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: yamachat-windows-1.0.89
          path: release-assets

      - name: Create Windows 1.0.89 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Yamachat 1.0.89

          - Tenký 1px obrys aktivního serveru sleduje osobní barvu uživatele.
          - Obrys navazuje pouze na aktivní serverovou kartu a přesouvá se při změně serveru.
          - Zvýraznění se automaticky vrací po zavření Profilu, Nastavení a dalších oken; v soukromých zprávách zůstává skryté.
          - Ověřený funkční základ 1.0.81; voice, chat, tray, obnova hesla a Platform Admin beze změn.
          EOF

          gh release create v1.0.89 release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target release/windows-1.0.89-context-return \
            --title "Yamachat 1.0.89" \
            --notes-file release-notes.md \
            --latest

      - name: Point Windows updater to 1.0.89
        run: |
          set -euo pipefail
          cp release-assets/latest.yml /tmp/yamachat-latest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-main origin/main

            python - <<'PY'
          import json, pathlib, re
          from datetime import datetime, timezone

          latest=pathlib.Path('/tmp/yamachat-latest.yml').read_text(encoding='utf-8')
          match=re.search(r"^version:\s*['\"]?([^'\"\s]+)",latest,re.M)
          if not match or match.group(1) != '1.0.89':
              raise SystemExit('latest.yml version mismatch')

          path=pathlib.Path('update-manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['publishedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          windows=manifest.setdefault('windows',{})
          windows['latestVersion']='1.0.89'
          windows['required']=True
          windows['releaseUrl']='https://github.com/yamboleeroy-ai/yamachat/releases/tag/v1.0.89'
          windows['notes']='Yamachat 1.0.89: obrys v osobní barvě uživatele a jeho automatický návrat po zavření Nastavení, Profilu a dalších oken. Stabilní základ 1.0.81, beze změn voice, chatu a obnovy hesla.'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            git add update-manifest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish Windows server context updater 1.0.89 [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

