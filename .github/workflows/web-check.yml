name: Desktop-derived web checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
      - run: node scripts/build-desktop-client.mjs
      - name: Profile action and layout tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/profile-actions.cjs
          node tests/profile-layout.cjs
          node tests/password-recovery.cjs
      - name: Prepare web deployment
        run: |
          mkdir -p web-dist
          cp index.html reset-password.html sw.js boot-guard.js favicon.ico manifest.webmanifest offline.html CNAME .nojekyll web-dist/
          cp -r icons audio vendor build download web-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Web
          path: web-dist
