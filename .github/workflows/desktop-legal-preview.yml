name: Yamachat Windows Legal UI Preview

on:
  pull_request:
    paths:
      - "desktop/desktop-client.html"
      - "desktop/package.json"
      - "TERMS_OF_USE.md"
      - "PRIVACY_POLICY.md"
      - "scripts/build-web.mjs"
      - "scripts/legal-ui.mjs"
      - "scripts/platform-install-ui.mjs"
      - "tests/platform-install-ui.cjs"
      - "tests/legal-ui.mjs"
      - "tests/legal-ui-visual.cjs"
      - "mobile/scripts/sync-web.mjs"
      - "scripts/check-legal-baseline.mjs"
      - ".github/workflows/desktop-legal-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preserve repository line endings for pinned reference hashes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Generate shared Web/PWA and mobile client
        run: node scripts/build-web.mjs

      - name: Verify legal UI
        run: node tests/legal-ui.mjs
      - name: Verify platform install UI structure
        shell: pwsh
        run: |
          $html=Get-Content index.html -Raw
          if ($html -notmatch 'ycPlatformInstallRuntime') { throw 'Platform install runtime missing from generated client' }
          if ($html -notmatch 'data-yc-platform="windows"') { throw 'Windows platform action missing' }
          if ($html -notmatch 'data-yc-platform="android"') { throw 'Android platform action missing' }
          if ($html -notmatch 'data-yc-platform="pwa"') { throw 'Desktop PWA platform action missing' }
          if ($html -notmatch 'code-signing podpis') { throw 'Windows signing notice missing' }
          if ($html -match 'play.google.com|apps.apple.com') { throw 'Unverified app-store link introduced' }

      - name: Guard unrelated runtime and voice/stream infrastructure
        shell: pwsh
        run: |
          git diff --exit-code 366eb4366a7596c5dd6deeb65acb6a94a693fe21 -- desktop/main.js desktop/preload.js desktop/notification-preload.js desktop/updater.js windows/process-audio web/stream-viewer.js web/stream-viewer.css scripts/voice-experience.mjs scripts/voice-theme-polish.mjs scripts/interaction-notifications.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Protected non-legal runtime changed' }

      - name: Run existing regression guards
        shell: pwsh
        run: |
          node tests/voice-experience.cjs
          node tests/stream-viewer.cjs
          node tests/windows-stream-lifecycle.cjs
          node tests/windows-process-audio.cjs
          node tests/windows-interaction-notifications.cjs
          node tests/windows-taskbar-restore.cjs

      - name: Build native process audio helper
        shell: pwsh
        run: ./scripts/build-windows-process-audio.ps1

      - name: Prepare desktop runtime
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop/build
          Copy-Item -Recurse -Force audio desktop/audio
          Copy-Item boot-guard.js desktop/boot-guard.js

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build unpacked Windows preview
        run: npx electron-builder --win dir --x64 --publish never
        working-directory: desktop

      - name: Isolate preview and verify legal UI package
        shell: pwsh
        run: |
          $appRoot='desktop/dist/win-unpacked/resources/app'
          $legalRoot='desktop/dist/win-unpacked/resources/legal'
          Set-Content -Path "$appRoot/preview.json" -Value '{"kind":"legal-ui-1.0.105","isolated":true,"release":false}' -Encoding UTF8
          foreach ($file in @('main.js','preload.js','desktop.html','desktop-client.html','preview.json')) {
            if (-not (Test-Path "$appRoot/$file")) { throw "Missing preview runtime: $file" }
          }
          if ((Get-Content "$appRoot/desktop-client.html" -Raw) -notmatch 'ycLegalUiV1') { throw 'Packaged legal UI marker missing' }
          if ((Get-Content "$appRoot/desktop-client.html" -Raw) -notmatch 'id="ycLegalAboutBtn"') { throw 'Packaged About button missing' }
          if ((Get-Content "$appRoot/desktop-client.html" -Raw) -match '<small>Věk</small><strong>33 let</strong>') { throw 'Developer age still packaged' }
          $client=Get-Content "$appRoot/desktop-client.html" -Raw
          if ($client -notmatch 'data-yc-platform="pwa"') { throw 'Packaged desktop PWA launcher missing' }
          if ($client -notmatch 'code-signing podpis') { throw 'Packaged Windows signing notice missing' }
          if ($client -notmatch 'yc-developer-modal .yc-dev-grid\{grid-template-columns:repeat\(3,minmax\(0,1fr\)\)') { throw 'Packaged balanced developer contact grid missing' }
          foreach ($file in @('LICENSE','TERMS_OF_USE.md','PRIVACY_POLICY.md','BRAND-NOTICE.md','PROVENANCE.md','THIRD_PARTY_NOTICES.md','LEGAL-BASELINE.md','ASSET-MANIFEST.md')) {
            if (-not (Test-Path "$legalRoot/$file")) { throw "Missing packaged legal source: $file" }
          }
          Compress-Archive -Path 'desktop/dist/win-unpacked/*' -DestinationPath 'yamachat-windows-legal-ui-preview.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-legal-ui-preview
          path: yamachat-windows-legal-ui-preview.zip
          if-no-files-found: error
          retention-days: 7
