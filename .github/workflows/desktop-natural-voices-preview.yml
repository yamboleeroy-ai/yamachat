name: Yamachat Windows Natural Voice Preview
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'supabase/functions/yamachat-source/**'
      - 'tests/windows-natural-voices.cjs'
      - '.github/workflows/desktop-natural-voices-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify Microsoft Natural voice integration
        run: node tests/windows-natural-voices.cjs
      - name: Build native process audio helper
        shell: pwsh
        run: ./scripts/build-windows-process-audio.ps1
      - name: Prepare reviewed desktop runtime
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop/build
          Copy-Item -Recurse -Force audio desktop/audio
          Copy-Item boot-guard.js desktop/boot-guard.js
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build unpacked Windows preview
        run: npx electron-builder --win dir --x64 --publish never
        working-directory: desktop
      - name: Isolate preview profile and verify runtime
        shell: pwsh
        run: |
          $appRoot='desktop/dist/win-unpacked/resources/app'
          Set-Content -Path "$appRoot/preview.json" -Value '{"kind":"microsoft-natural-voices","isolated":true}' -Encoding UTF8
          foreach ($file in @('main.js','preload.js','desktop.html','desktop-client.html','preview.json')) {
            if (-not (Test-Path "$appRoot/$file")) { throw "Missing preview runtime: $file" }
          }
          if ((Get-FileHash "$appRoot/desktop-client.html").Hash -ne (Get-FileHash 'desktop/desktop-client.html').Hash) { throw 'Preview desktop client mismatch' }
          if ((Get-Content "$appRoot/desktop-client.html" -Raw) -notmatch 'cs-CZ-VlastaNeural') { throw 'Czech female Natural voice preference missing' }
          Compress-Archive -Path 'desktop/dist/win-unpacked/*' -DestinationPath 'yamachat-windows-natural-voices-preview.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-natural-voices-preview
          path: yamachat-windows-natural-voices-preview.zip
          if-no-files-found: error
          retention-days: 7
