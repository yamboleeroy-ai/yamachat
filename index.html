<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yamachat</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #171d25;
    }
  </style>
</head>
<body>
  <iframe id="yamachat"></iframe>

  <script>
    fetch(
      "https://bxjvmjdppmqgbxfcowpf.supabase.co/functions/v1/yamachat-source",
      { cache: "no-store" }
    )
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(html => {
      document.getElementById("yamachat").srcdoc = html;
    })
    .catch(err => {
      document.body.innerHTML =
        '<div style="color:white;font-family:Arial;padding:30px">' +
        '<h2>Yamachat se nepodařilo načíst</h2>' +
        '<p>' + err.message + '</p></div>';
    });
  </script>
</body>
</html>
