name: Yamachat Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "mobile/**"
      - "index.html"
      - "icons/**"
      - "audio/**"
      - "web/**"
      - "scripts/**"
      - "reference/**"
      - "vendor/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare bundled Yamachat web
        working-directory: mobile
        run: npm run prepare:web

      - name: Verify unchanged desktop reference and bundled scripts
        run: node scripts/check.mjs

      - name: Create Android project when missing
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync and patch Android
        working-directory: mobile
        run: |
          npx cap sync android
          node scripts/patch-native.mjs android

      - name: Restore Firebase client config when configured
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo "Firebase client config restored."
          else
            echo "Firebase client config is not configured; APK will build, but killed-app FCM delivery stays disabled."
          fi
          test -f android/app/src/main/res/raw/yamachat_message.mp3
          test -f android/app/src/main/res/drawable/ic_yamachat_notification.xml
          test -f android/app/src/main/res/drawable-nodpi/yamachat_notification_logo.png
          grep -q 'com.google.firebase.messaging.default_notification_icon' android/app/src/main/AndroidManifest.xml
          grep -q 'yamachat-messages-v2' android/app/src/main/AndroidManifest.xml

      - name: Build with permanent Android identity
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Configure the permanent Android keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the permanent Android keystore password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/yamachat-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = ''.join(os.environ['ANDROID_KEYSTORE_B64'].split())
          try:
              key = base64.b64decode(encoded, validate=True)
          except ValueError:
              raise SystemExit('ANDROID_KEYSTORE_B64 must contain only the base64 file contents, not a path or label')
          Path(os.environ['ANDROID_KEYSTORE_PATH']).write_bytes(key)
          PY
          export ANDROID_VERSION_CODE="$((200000 + GITHUB_RUN_NUMBER))"
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../Yamachat-Android.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../../Yamachat-Android.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 ../../Yamachat-Android.apk
          python ../../scripts/verify-android-apk.py \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner" \
            --apk ../../Yamachat-Android.apk --previous ../../download/Yamachat-Android.apk \
            --expected-code "$ANDROID_VERSION_CODE" --report ../../android-artifact.json

      - name: Publish APK for yamachat.eu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp Yamachat-Android.apk /tmp/Yamachat-Android.apk
          cp android-artifact.json /tmp/android-artifact.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Capacitor/Gradle intentionally modify generated tracked files. Preserve
          # only the verified APK/report, then return to a clean main checkout.
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-apk origin/main
            git reset --hard origin/main
            git clean -fd

            mkdir -p download
            cp /tmp/Yamachat-Android.apk download/Yamachat-Android.apk

            python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('/tmp/android-artifact.json').read_text())
          artifact=report['artifact']
          manifest_path=Path('update-manifest.json')
          manifest=json.loads(manifest_path.read_text())
          android=manifest.setdefault('android',{})
          android['latestVersion']=artifact['versionName']
          android['latestVersionCode']=int(artifact['versionCode'])
          android['required']=True
          android['apkUrl']=f"https://yamachat.eu/download/Yamachat-Android.apk?v={artifact['versionCode']}"
          android['sha256']=artifact['sha256']
          android['notes']=[
            'Yamachat oznámení mají vlastní logo, ikonu a vlastní zvuk zprávy na Androidu.',
            'Kliknutí na oznámení otevře přímo správnou DM, kanál a konkrétní zprávu.',
            'Push registrace je připravená pro FCM; doručení při úplně ukončené APK vyžaduje Firebase konfiguraci projektu.',
            'Současné mobilní rozložení, voice, Real Voices a ostatní funkce zůstávají beze změny.'
          ]
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY

            git add -f download/Yamachat-Android.apk update-manifest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish Yamachat Android mobile drawer fix [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "APK publish raced with another main update; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1

      - name: Restore APK artifact files after publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp /tmp/Yamachat-Android.apk Yamachat-Android.apk
          cp /tmp/android-artifact.json android-artifact.json

      - name: Upload Yamachat APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Android
          path: |
            Yamachat-Android.apk
            android-artifact.json
          if-no-files-found: error
          retention-days: 30


