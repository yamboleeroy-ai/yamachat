name: Yamachat Desktop Safety Check

on:
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "reference/**"
      - ".github/workflows/desktop-check.yml"
      - ".github/workflows/publish-yamachat-release.yml"
  push:
    paths:
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "reference/**"
      - ".github/workflows/desktop-check.yml"
      - ".github/workflows/publish-yamachat-release.yml"

permissions:
  contents: read

jobs:
  desktop-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse desktop JavaScript
        run: |
          node --check desktop/main.js
          node --check desktop/updater.js
          node --check desktop/preload.js
          node --check desktop/notification-preload.js

      - name: Verify non-WNS runtime matches released 1.0.94 source
        run: |
          set -euo pipefail
          base=origin/release/windows-1.0.94-icon-tray-hotfix
          git rev-parse --verify "$base" >/dev/null

          # WNS intentionally changes main.js, preload.js and desktop.html.
          # Everything unrelated to WNS must stay identical to the source that built 1.0.94.
          for file in desktop/updater.js desktop/updater-helper.ps1 desktop/notification-preload.js; do
            git diff --exit-code "$base" -- "$file"
            echo "PASS 1.0.94 unchanged source: $file"
          done

          for file in desktop/main.js desktop/preload.js desktop/desktop.html; do
            test -f "$file"
            if git diff --quiet "$base" -- "$file"; then
              echo "Expected WNS delta missing: $file"
              exit 1
            fi
            echo "PASS intentional WNS runtime delta: $file"
          done

      - name: Verify generated desktop client
        run: |
          node scripts/prepare-desktop-1.0.92.mjs
          grep -q 'id="ycPasswordRequestBack"' desktop/desktop-client.html
          grep -q 'Platform Admin · uživatelské účty' desktop/desktop-client.html
          grep -q 'ycServerContextFrame' desktop/desktop-client.html
          grep -q 'ycServerCardContextStyle' desktop/desktop-client.html
          grep -q 'ycFriendsPanelRefreshStyle' desktop/desktop-client.html
          grep -q 'ycFriendsStableSet' desktop/desktop-client.html
          ! grep -q 'ycActiveServerConnectedFrame' desktop/desktop-client.html
          grep -q 'function drawFrame()' desktop/desktop-client.html
          grep -q 'pointer-events:none!important' desktop/desktop-client.html
          echo "PASS desktop client matches tested generator and contains connected visual-only server context"

      - name: Verify tray and app icon restoration recipe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/restore-desktop-brand-assets.ps1 -Destination build
          foreach ($name in @("icon.ico","tray-controller-idle.png","tray-controller-speaking.png","tray-status-online.png","tray-status-online-notify.png","app-icon-source.png","yamachat-logo-ui.webp")) {
            if (-not (Test-Path (Join-Path build $name))) { throw "Missing restored Windows asset $name" }
          }
          Write-Host "PASS tray and Windows app icon assets restored from 1.0.94"

      - name: Verify desktop release version
        run: |
          node - <<'NODE'
          const p=require('./desktop/package.json');
          if(p.version!=='1.0.94') throw new Error('Expected desktop source version 1.0.94');
          if(!p.dependencies?.['electron-updater']) throw new Error('electron-updater missing');
          console.log('PASS desktop',p.version);
          NODE



