name: Publish signed YamaSearch Android (separate app)

on:
  push:
    branches: [main]
    paths:
      - 'products/yamasearch/release/android-release-request.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Android app version (e.g. 0.1.0)'
        required: true
        type: string
      versionCode:
        description: 'Monotonically increasing Android versionCode (e.g. 10000)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yamasearch-android-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: products/yamasearch/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test mobile browser and YamaBlock logic
        run: |
          set -euo pipefail
          node ../../../tests/yamasearch-android-mobile-browser.cjs
          node ../../../tests/yamasearch-android-yamablock.cjs
          node --check app/src/main/assets/yamablock-youtube.js
          mkdir -p build/navigation-test
          javac -encoding UTF-8 -d build/navigation-test \
            app/src/main/java/eu/yamachat/yamasearch/MobileNavigation.java \
            tests/MobileNavigationTest.java
          java -cp build/navigation-test eu.yamachat.yamasearch.MobileNavigationTest
          mkdir -p build/update-test
          javac -encoding UTF-8 -d build/update-test \
            app/src/main/java/eu/yamachat/yamasearch/AndroidUpdateManifest.java \
            app/src/main/java/eu/yamachat/yamasearch/AndroidUpdateDownloadRecord.java \
            app/src/main/java/eu/yamachat/yamasearch/AndroidUpdateChecker.java \
            app/src/main/java/eu/yamachat/yamasearch/AndroidUpdateDownloadVerifier.java \
            tests/AndroidUpdateManifestTest.java \
            tests/AndroidUpdateManifestFileTest.java \
            tests/AndroidUpdateDownloadRecordTest.java \
            tests/AndroidUpdateCheckerTest.java \
            tests/AndroidUpdateDownloadVerifierTest.java
          java -cp build/update-test eu.yamachat.yamasearch.AndroidUpdateManifestTest
          java -cp build/update-test eu.yamachat.yamasearch.AndroidUpdateDownloadRecordTest
          java -cp build/update-test eu.yamachat.yamasearch.AndroidUpdateCheckerTest
          java -cp build/update-test eu.yamachat.yamasearch.AndroidUpdateDownloadVerifierTest
      - name: Provision Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Resolve intended release version
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CODE: ${{ inputs.versionCode }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$(node -p "require('../release/android-release-request.json').version")}"
          VERSION_CODE="${INPUT_CODE:-$(node -p "require('../release/android-release-request.json').versionCode")}"
          PACKAGE_ID=$(node -p "require('../release/android-release-request.json').packageId")
          test "$PACKAGE_ID" = 'eu.yamachat.yamasearch.mobile' || { echo "Unexpected release package ID"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Validate version and release signing availability
        env:
          KEYSTORE: ${{ secrets.YAMASEARCH_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.YAMASEARCH_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YAMASEARCH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YAMASEARCH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid versionCode"; exit 1; }
          test "${#KEYSTORE}" -gt 100 || { echo "Missing YamaSearch-specific signing keystore secret"; exit 1; }
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing YamaSearch signing secret"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/yamasearch-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/yamasearch-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "YAMASEARCH_KEYSTORE_FILE=$RUNNER_TEMP/yamasearch-release.jks" >> "$GITHUB_ENV"
      - name: Build SIGNED release APK
        env:
          YAMASEARCH_STORE_PASSWORD: ${{ secrets.YAMASEARCH_ANDROID_STORE_PASSWORD }}
          YAMASEARCH_KEY_ALIAS: ${{ secrets.YAMASEARCH_ANDROID_KEY_ALIAS }}
          YAMASEARCH_KEY_PASSWORD: ${{ secrets.YAMASEARCH_ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNING_CERT_SHA256: a6ae7f09a6c808cb8394fba6271e59baf47d58d8ed37b43282193dd2799df75d
          LEGACY_PACKAGE_ID: eu.yamachat.yamasearch
          LEGACY_SIGNING_CERT_SHA256: 1ba716dadb2d572f84c4aca501a659f813f57c2e98652921e4438ba84590585d
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease -PyamasearchVersionName="$VERSION" -PyamasearchVersionCode="$VERSION_CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SIGNER_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNER_OUTPUT"
          ACTUAL_CERT=$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n -E 's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([0-9a-fA-F:]+)$/\3/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          test "$ACTUAL_CERT" = "$EXPECTED_SIGNING_CERT_SHA256" || { echo "Unexpected YamaSearch signing certificate: $ACTUAL_CERT"; exit 1; }
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='$PACKAGE_ID'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'28'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'35'"

          PREVIOUS="$RUNNER_TEMP/YamaSearch-Android-previous.apk"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            'https://updates.yamachat.eu/yamasearch/YamaSearch-Android-latest.apk' -o "$PREVIOUS"
          PREVIOUS_BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$PREVIOUS")
          PREVIOUS_PACKAGE=$(printf '%s\n' "$PREVIOUS_BADGING" | sed -n -E "s/^package: name='([^']+)'.*/\1/p" | head -n 1)
          PREVIOUS_SIGNER_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$PREVIOUS")
          PREVIOUS_CERT=$(printf '%s\n' "$PREVIOUS_SIGNER_OUTPUT" | sed -n -E 's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([0-9a-fA-F:]+)$/\3/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          if test "$PREVIOUS_PACKAGE" = "$PACKAGE_ID"; then
            test "$PREVIOUS_CERT" = "$EXPECTED_SIGNING_CERT_SHA256" \
              || { echo "Published APK uses an unexpected current certificate: $PREVIOUS_CERT"; exit 1; }
          elif test "$PREVIOUS_PACKAGE" = "$LEGACY_PACKAGE_ID"; then
            test "$VERSION" = '0.1.1' && test "$VERSION_CODE" = '10001' \
              || { echo "Legacy package migration is allowed only for 0.1.1 (10001)"; exit 1; }
            test "$PREVIOUS_CERT" = "$LEGACY_SIGNING_CERT_SHA256" \
              || { echo "Published legacy APK uses an unexpected certificate: $PREVIOUS_CERT"; exit 1; }
            echo "Verified one-time migration from the legacy Android package identity."
          else
            echo "Published APK uses an unexpected package: $PREVIOUS_PACKAGE"
            exit 1
          fi
          PREVIOUS_CODE=$(printf '%s\n' "$PREVIOUS_BADGING" | sed -n -E "s/^package: .*versionCode='([0-9]+)'.*/\1/p" | head -n 1)
          PREVIOUS_VERSION=$(printf '%s\n' "$PREVIOUS_BADGING" | sed -n -E "s/^package: .*versionName='([^']+)'.*/\1/p" | head -n 1)
          test "$VERSION_CODE" -ge "$PREVIOUS_CODE" || { echo "versionCode must not go below published $PREVIOUS_CODE"; exit 1; }
          if test "$VERSION_CODE" -eq "$PREVIOUS_CODE"; then
            test "$VERSION" = "$PREVIOUS_VERSION" || { echo "Published versionCode $PREVIOUS_CODE belongs to version $PREVIOUS_VERSION"; exit 1; }
            echo "This exact versionCode is already public; reusing verified public APK bytes for idempotent recovery."
            APK="$PREVIOUS"
          else
            test "$VERSION" != "$PREVIOUS_VERSION" || { echo "Version $VERSION already has immutable public APK bytes"; exit 1; }
          fi
          mkdir -p release
          cp "$APK" "release/YamaSearch-Android-$VERSION.apk"
          (cd release && sha256sum "YamaSearch-Android-$VERSION.apk" | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: YamaSearch-Android-SIGNED-${{ steps.metadata.outputs.version }}
          path: products/yamasearch/android/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: YamaSearch-Android-SIGNED-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Publish immutable signed APK in isolated R2 namespace
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          FILE="release-assets/YamaSearch-Android-$VERSION.apk"
          test -s "$FILE"
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          EXPECTED=$(awk 'NR==1 {print $1}' release-assets/SHA256SUMS.txt)
          EXISTING="$RUNNER_TEMP/YamaSearch-Android-$VERSION-existing.apk"
          STATUS=$(curl --silent --show-error --max-time 30 \
            --output "$EXISTING" --write-out '%{http_code}' \
            "https://updates.yamachat.eu/yamasearch/YamaSearch-Android-$VERSION.apk?preflight=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true)
          if test "$STATUS" = 200; then
            test "$(sha256sum "$EXISTING" | awk '{print $1}')" = "$EXPECTED" \
              || { echo "Refusing to overwrite immutable YamaSearch Android $VERSION APK"; exit 1; }
            echo "Verified immutable APK already exists; leaving it unchanged."
          elif test "$STATUS" = 404; then
            npx --yes wrangler@latest r2 object put "yamachat-releases/yamasearch/YamaSearch-Android-$VERSION.apk" --file "$FILE" --content-type application/vnd.android.package-archive --content-disposition "attachment; filename=YamaSearch-Android-$VERSION.apk" --cache-control 'public, max-age=31536000, immutable' --remote
          else
            echo "Could not safely determine whether immutable APK exists (HTTP $STATUS)"
            exit 1
          fi

      - name: Verify immutable public APK bytes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED=$(awk 'NR==1 {print $1}' release-assets/SHA256SUMS.txt)
          test "${#EXPECTED}" = 64
          PUBLIC="$RUNNER_TEMP/YamaSearch-Android-$VERSION.apk"
          for n in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 30 \
              "https://updates.yamachat.eu/yamasearch/YamaSearch-Android-$VERSION.apk?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$n" -o "$PUBLIC" \
              && test "$(sha256sum "$PUBLIC" | awk '{print $1}')" = "$EXPECTED"; then
              break
            fi
            test "$n" != 20 || { echo "Public versioned YamaSearch APK checksum mismatch"; exit 1; }
            sleep 10
          done

      - name: Promote verified APK to latest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          FILE="release-assets/YamaSearch-Android-$VERSION.apk"
          npx --yes wrangler@latest r2 object put 'yamachat-releases/yamasearch/YamaSearch-Android-latest.apk' --file "$FILE" --content-type application/vnd.android.package-archive --content-disposition 'attachment; filename=YamaSearch-Android-latest.apk' --cache-control 'no-cache, no-store' --remote

      - name: Verify latest public APK bytes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED=$(awk 'NR==1 {print $1}' release-assets/SHA256SUMS.txt)
          LATEST="$RUNNER_TEMP/YamaSearch-Android-latest.apk"
          for n in $(seq 1 20); do
            if curl --fail --location --silent --show-error --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://updates.yamachat.eu/yamasearch/YamaSearch-Android-latest.apk?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$n" -o "$LATEST" \
              && test "$(sha256sum "$LATEST" | awk '{print $1}')" = "$EXPECTED"; then
              break
            fi
            test "$n" != 20 || { echo "Public latest YamaSearch APK checksum mismatch"; exit 1; }
            sleep 10
          done

      - name: Publish verified Android update manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          export APK_SHA256=$(awk 'NR==1 {print $1}' release-assets/SHA256SUMS.txt)
          export APK_SIZE=$(wc -c < "release-assets/YamaSearch-Android-$VERSION.apk" | tr -d ' ')
          export UPDATE_MANIFEST="$RUNNER_TEMP/YamaSearch-Android-update.json"
          node - <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('products/yamasearch/release/android-release-request.json', 'utf8'));
          const version = process.env.VERSION;
          const versionCode = Number(process.env.VERSION_CODE);
          const size = Number(process.env.APK_SIZE);
          const sha256 = process.env.APK_SHA256;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid Android update version');
          if (!Number.isSafeInteger(versionCode) || versionCode < 1) throw Error('Invalid Android update versionCode');
          if (versionCode > 2100000000) throw Error('Android update versionCode is out of range');
          if (!Number.isSafeInteger(size) || size < 1) throw Error('Invalid Android update APK size');
          if (size > 512 * 1024 * 1024) throw Error('Android update APK is too large');
          if (!/^[0-9a-f]{64}$/.test(sha256)) throw Error('Invalid Android update APK checksum');
          const requestedNotes = request.version === version && Number(request.versionCode) === versionCode
            ? String(request.notes || '').trim()
            : '';
          const notes = requestedNotes || `Aktualizace YamaSearch Android ${version}.`;
          if (notes.length > 2000) throw Error('Android update notes are too long');
          const channel = request.version === version && Number(request.versionCode) === versionCode
            ? String(request.channel || 'beta').trim()
            : 'beta';
          if (channel !== 'beta' && channel !== 'stable') throw Error('Invalid Android update channel');
          const manifest = {
            schemaVersion: 1,
            product: 'YamaSearch Android',
            packageId: 'eu.yamachat.yamasearch.mobile',
            version,
            versionCode,
            channel,
            notes,
            apkUrl: `https://updates.yamachat.eu/yamasearch/YamaSearch-Android-${version}.apk`,
            sha256,
            size,
            publishedAtUtc: new Date().toISOString()
          };
          fs.writeFileSync(process.env.UPDATE_MANIFEST, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          node -e "const m=require(process.env.UPDATE_MANIFEST);if(m.version!==process.env.VERSION||String(m.versionCode)!==process.env.VERSION_CODE)process.exit(1)"
          mkdir -p "$RUNNER_TEMP/android-update-manifest-test"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/android-update-manifest-test" \
            products/yamasearch/android/app/src/main/java/eu/yamachat/yamasearch/AndroidUpdateManifest.java \
            products/yamasearch/android/tests/AndroidUpdateManifestFileTest.java
          java -cp "$RUNNER_TEMP/android-update-manifest-test" \
            eu.yamachat.yamasearch.AndroidUpdateManifestFileTest "$UPDATE_MANIFEST"
          npx --yes wrangler@latest r2 object put 'yamachat-releases/yamasearch/YamaSearch-Android-update.json' --file "$UPDATE_MANIFEST" --content-type 'application/json; charset=utf-8' --cache-control 'no-cache, no-store' --remote

      - name: Verify public Android update manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -euo pipefail
          EXPECTED=$(sha256sum "$RUNNER_TEMP/YamaSearch-Android-update.json" | awk '{print $1}')
          PUBLIC="$RUNNER_TEMP/YamaSearch-Android-update-public.json"
          HEADERS="$RUNNER_TEMP/YamaSearch-Android-update-public.headers"
          for n in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 30 \
              -H 'Cache-Control: no-cache' \
              --dump-header "$HEADERS" \
              "https://updates.yamachat.eu/yamasearch/YamaSearch-Android-update.json?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$n" -o "$PUBLIC" \
              && test "$(sha256sum "$PUBLIC" | awk '{print $1}')" = "$EXPECTED" \
              && grep -qiE '^content-type:[[:space:]]*application/json([;[:space:]]|$)' "$HEADERS"; then
              break
            fi
            test "$n" != 20 || { echo "Public YamaSearch Android update manifest mismatch"; exit 1; }
            sleep 10
          done
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/YamaSearch-Android-update-public.json', 'utf8'));
          if (manifest.schemaVersion !== 1 || manifest.product !== 'YamaSearch Android') throw Error('Unexpected Android update manifest schema');
          if (manifest.packageId !== 'eu.yamachat.yamasearch.mobile') throw Error('Unexpected Android package ID');
          if (manifest.version !== process.env.VERSION || String(manifest.versionCode) !== process.env.VERSION_CODE) throw Error('Unexpected Android version metadata');
          if (manifest.channel !== 'beta' && manifest.channel !== 'stable') throw Error('Unexpected Android release channel');
          if (typeof manifest.notes !== 'string' || !manifest.notes || manifest.notes.length > 2000) throw Error('Unexpected Android release notes');
          if (manifest.apkUrl !== `https://updates.yamachat.eu/yamasearch/YamaSearch-Android-${process.env.VERSION}.apk`) throw Error('Unexpected Android APK URL');
          if (!/^[0-9a-f]{64}$/.test(manifest.sha256)) throw Error('Unexpected Android APK checksum');
          if (!Number.isSafeInteger(manifest.size) || manifest.size < 1 || manifest.size > 512 * 1024 * 1024) throw Error('Unexpected Android APK size');
          if (typeof manifest.publishedAtUtc !== 'string' || !manifest.publishedAtUtc.endsWith('Z') || !Number.isFinite(Date.parse(manifest.publishedAtUtc))) throw Error('Unexpected Android publication time');
          NODE
          java -cp "$RUNNER_TEMP/android-update-manifest-test" \
            eu.yamachat.yamasearch.AndroidUpdateManifestFileTest "$PUBLIC"

      - name: Activate public Android download on official site
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B release-yamasearch-android origin/main
          node - <<'NODE'
          const fs = require('fs');
          const file = 'products/yamasearch/release/android-mobile.json';
          const state = JSON.parse(fs.readFileSync(file, 'utf8'));
          const request = JSON.parse(fs.readFileSync('products/yamasearch/release/android-release-request.json', 'utf8'));
          const versionCode = Number(process.env.VERSION_CODE);
          if (!Number.isSafeInteger(versionCode) || versionCode < 1) throw Error('Invalid released versionCode');
          const expectedPackageId = 'eu.yamachat.yamasearch.mobile';
          if (request.packageId !== expectedPackageId) throw Error('Unexpected release package ID');
          state.version = process.env.VERSION;
          state.versionCode = versionCode;
          state.packageId = expectedPackageId;
          state.updateManifestUrl = 'https://updates.yamachat.eu/yamasearch/YamaSearch-Android-update.json';
          if (request.version === state.version && Number(request.versionCode) === versionCode && request.notes) {
            state.notes = request.notes;
          }
          state.published = true;
          fs.writeFileSync(file, JSON.stringify(state, null, 2) + '\n');
          NODE
          node scripts/build-web.mjs
          node scripts/check.mjs
          git add products/yamasearch/release/android-mobile.json index.html
          git diff --cached --quiet || git commit -m "Activate verified YamaSearch Android $VERSION download"
          git push origin HEAD:main
