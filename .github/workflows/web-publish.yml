name: Publish generated Yamachat web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/build-web.mjs"
      - "reference/**"
      - ".github/workflows/web-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate web from verified desktop reference
        run: node scripts/build-web.mjs

      - name: Verify generated web
        run: node scripts/check.mjs

      - name: Publish generated index
        run: |
          set -euo pipefail
          cp index.html /tmp/yamachat-index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-web origin/main
            cp /tmp/yamachat-index.html index.html
            git add index.html
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish generated Yamachat web [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Web publish raced with another main update; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1
