name: Sync generated feature web

on:
  push:
    branches:
      - feat/admin-account-messages-20260924
    paths:
      - "web/account-messages.js"
      - "web/account-messages.css"
      - "scripts/account-messages.mjs"
      - "scripts/build-web.mjs"
      - ".github/workflows/sync-generated-feature.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-account-messages-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate exact web output
        run: node scripts/build-web.mjs
      - name: Commit generated output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reset-password.html build/password-recovery.js
          if git diff --cached --quiet; then
            echo "Generated files already match."
            exit 0
          fi
          git commit -m "Sync generated web for admin user management [skip ci]"
          git push origin HEAD:feat/admin-account-messages-20260924
