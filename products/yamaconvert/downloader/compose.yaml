services:
  downloader:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status',{headers:{origin:'https://yamachat.eu'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      DOWNLOAD_HOST: ${DOWNLOAD_HOST:?Set DOWNLOAD_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      downloader:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
