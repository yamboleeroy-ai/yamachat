name: Yamachat Desktop Safety Check

on:
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "reference/**"
      - ".github/workflows/desktop-check.yml"
      - ".github/workflows/publish-yamachat-release.yml"
  push:
    paths:
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "reference/**"
      - ".github/workflows/desktop-check.yml"
      - ".github/workflows/publish-yamachat-release.yml"

permissions:
  contents: read

jobs:
  desktop-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse desktop JavaScript
        run: |
          node --check desktop/main.js
          node --check desktop/updater.js
          node --check desktop/preload.js
          node --check desktop/notification-preload.js

      - name: Install release extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Download released Windows 1.0.79 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-1079
          gh release download v1.0.79 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Yamachat-Setup-1.0.79.exe" \
            --dir /tmp/yamachat-1079

      - name: Verify Windows runtime matches released 1.0.79
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-1079-nsis /tmp/yamachat-1079-app
          7z x /tmp/yamachat-1079/Yamachat-Setup-1.0.79.exe -o/tmp/yamachat-1079-nsis -y >/dev/null
          archive="$(find /tmp/yamachat-1079-nsis -type f \( -name 'app-64.7z' -o -name 'app-*.7z' \) | head -n 1 || true)"
          if [ -n "$archive" ]; then
            7z x "$archive" -o/tmp/yamachat-1079-app -y >/dev/null
          else
            cp -a /tmp/yamachat-1079-nsis/. /tmp/yamachat-1079-app/
          fi
          app_root="$(dirname "$(find /tmp/yamachat-1079-app /tmp/yamachat-1079-nsis -type f -path '*/resources/app/main.js' | head -n 1)")"
          test -n "$app_root"
          for file in main.js updater.js updater-helper.ps1 preload.js notification-preload.js desktop.html; do
            test -f "$app_root/$file"
            test -f "desktop/$file"
            cmp "$app_root/$file" "desktop/$file"
            echo "PASS released 1.0.79 runtime: $file"
          done

      - name: Verify generated desktop client
        run: |
          node scripts/build-desktop-client.mjs
          cmp desktop-client-dist/desktop-client.html desktop/desktop-client.html
          grep -q 'id="ycPasswordRequestBack"' desktop/desktop-client.html
          grep -q 'Platform Admin · uživatelské účty' desktop/desktop-client.html
          grep -q 'ACTIVE SERVER CONTEXT 1.0.85' desktop/desktop-client.html
          ! grep -q 'ycActiveServerConnectedFrame' desktop/desktop-client.html
          grep -q 'ycServerContextVisualScript' desktop/desktop-client.html
          grep -q 'pointer-events:none!important' desktop/desktop-client.html
          echo "PASS desktop client matches tested generator and contains connected visual-only server context"

      - name: Verify tray and app icon restoration recipe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/restore-desktop-brand-assets.ps1 -Destination build
          foreach ($name in @("icon.ico","tray-controller-idle.png","tray-controller-speaking.png","tray-status-online.png","tray-status-online-notify.png","app-icon-source.png","yamachat-logo-ui.webp")) {
            if (-not (Test-Path (Join-Path build $name))) { throw "Missing restored Windows asset $name" }
          }
          Write-Host "PASS tray and Windows app icon assets restored from 1.0.79"

      - name: Verify desktop release version
        run: |
          node - <<'NODE'
          const p=require('./desktop/package.json');
          if(p.version!=='1.0.85') throw new Error('Expected desktop source version 1.0.85');
          if(!p.dependencies?.['electron-updater']) throw new Error('electron-updater missing');
          console.log('PASS desktop',p.version);
          NODE
