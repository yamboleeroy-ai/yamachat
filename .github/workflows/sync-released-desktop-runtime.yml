name: Sync released desktop 1.0.79 runtime

on:
  push:
    branches:
      - feature/desktop-user-admin-1.0.80
    paths:
      - ".github/workflows/sync-released-desktop-runtime.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-user-admin-1.0.80
          fetch-depth: 0

      - name: Install extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Download released Windows 1.0.79
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-release
          gh release download v1.0.79 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Yamachat-Setup-1.0.79.exe" \
            --dir /tmp/yamachat-release

      - name: Extract exact released runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-nsis /tmp/yamachat-app
          7z x /tmp/yamachat-release/Yamachat-Setup-1.0.79.exe -o/tmp/yamachat-nsis -y >/dev/null
          archive="$(find /tmp/yamachat-nsis -type f \( -name 'app-64.7z' -o -name 'app-*.7z' \) | head -n 1 || true)"
          if [ -n "$archive" ]; then
            7z x "$archive" -o/tmp/yamachat-app -y >/dev/null
          else
            cp -a /tmp/yamachat-nsis/. /tmp/yamachat-app/
          fi
          app_root="$(dirname "$(find /tmp/yamachat-app /tmp/yamachat-nsis -type f -path '*/resources/app/main.js' | head -n 1)")"
          test -n "$app_root"
          for file in main.js updater.js updater-helper.ps1 preload.js notification-preload.js desktop.html; do
            test -f "$app_root/$file"
            cp "$app_root/$file" "desktop/$file"
          done

      - name: Commit exact released runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/main.js desktop/updater.js desktop/updater-helper.ps1 desktop/preload.js desktop/notification-preload.js desktop/desktop.html
          if git diff --cached --quiet; then
            echo "Runtime already matches released 1.0.79."
            exit 0
          fi
          git commit -m "Sync Windows runtime from released 1.0.79 [skip ci]"
          git push origin HEAD:feature/desktop-user-admin-1.0.80
