<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yamachat Desktop</title>

  <style>
    :root {
      --yc-desktop-accent: #e056fd;
      --yc-desktop-accent-rgb: 224, 86, 253;
      --yc-desktop-secondary: color-mix(in srgb, var(--yc-desktop-accent) 48%, #b34dff);
      --yc-titlebar-h: 42px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #07111b;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    #ycDesktopTitlebar {
      position: relative;
      flex: 0 0 var(--yc-titlebar-h);
      height: var(--yc-titlebar-h);
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr);
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
      background:
        radial-gradient(circle at 42% -120%, rgba(var(--yc-desktop-accent-rgb), .23), transparent 54%),
        radial-gradient(circle at 60% -140%, color-mix(in srgb, var(--yc-desktop-secondary) 18%, transparent), transparent 52%),
        linear-gradient(180deg, rgba(7, 25, 38, .995), rgba(4, 14, 24, .995));
      border-bottom: 1px solid rgba(var(--yc-desktop-accent-rgb), .28);
      box-shadow: 0 1px 0 rgba(255,255,255,.025) inset, 0 5px 20px rgba(0,0,0,.24);
      z-index: 1000;
    }

    #ycDesktopTitlebar::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--yc-desktop-accent), transparent);
      opacity: .55;
      pointer-events: none;
    }

    .yc-titlebar-spacer { min-width: 0; }

    .yc-titlebar-tools {
      grid-column: 1;
      justify-self: start;
      align-self: stretch;
      display: flex;
      align-items: stretch;
      padding-left: 4px;
      -webkit-app-region: no-drag;
    }

    .yc-titlebar-tool {
      width: 38px;
      height: 100%;
      display: grid;
      place-items: center;
      border: 0;
      border-right: 1px solid rgba(255,255,255,.025);
      background: transparent;
      color: #7897a9;
      cursor: pointer;
      outline: none;
      transition: background .14s ease, color .14s ease, box-shadow .14s ease, opacity .14s ease;
      -webkit-app-region: no-drag;
    }

    .yc-titlebar-tool svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .yc-titlebar-tool:hover {
      color: #f0fbff;
      background: linear-gradient(180deg, rgba(var(--yc-desktop-accent-rgb), .12), rgba(var(--yc-desktop-accent-rgb), .06));
      box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--yc-desktop-secondary) 58%, var(--yc-desktop-accent));
    }

    .yc-titlebar-tool:disabled {
      opacity: .34;
      cursor: default;
      background: transparent;
      box-shadow: none;
    }

    .yc-titlebar-tool.sidebar-active {
      color: var(--yc-desktop-accent);
      background: rgba(var(--yc-desktop-accent-rgb), .08);
    }

    .yc-titlebar-brand {
      grid-column: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      min-width: 150px;
      pointer-events: none;
    }

    .yc-titlebar-brand img {
      width: 112px;
      max-height: 29px;
      height: auto;
      object-fit: contain;
      border-radius: 0;
      filter: drop-shadow(0 0 7px rgba(var(--yc-desktop-accent-rgb), .24)) drop-shadow(0 0 8px color-mix(in srgb, var(--yc-desktop-secondary) 28%, transparent));
    }

    .yc-window-controls {
      grid-column: 3;
      justify-self: end;
      align-self: stretch;
      display: flex;
      -webkit-app-region: no-drag;
    }

    .yc-window-btn {
      width: 47px;
      height: 100%;
      display: grid;
      place-items: center;
      border: 0;
      border-left: 1px solid rgba(255,255,255,.035);
      border-radius: 0;
      background: transparent;
      color: #9db3c1;
      cursor: pointer;
      outline: none;
      transition: background .14s ease, color .14s ease, box-shadow .14s ease;
      -webkit-app-region: no-drag;
    }

    .yc-window-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.55;
      vector-effect: non-scaling-stroke;
    }

    .yc-window-btn:hover {
      color: #f3fbff;
      background: rgba(var(--yc-desktop-accent-rgb), .13);
      box-shadow: inset 0 -2px 0 rgba(var(--yc-desktop-accent-rgb), .55);
    }

    .yc-window-btn.close:hover {
      background: rgba(221, 58, 72, .86);
      color: white;
      box-shadow: none;
    }

    #yamachat {
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      border: 0;
      background: #07111b;
    }



    #ycDesktopUpdateGate {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background:
        radial-gradient(circle at 18% 45%, rgba(53, 231, 255, .08), transparent 34%),
        radial-gradient(circle at 82% 30%, rgba(224, 86, 253, .08), transparent 32%),
        rgba(2, 7, 12, .88);
      backdrop-filter: blur(16px);
      -webkit-app-region: no-drag;
    }

    #ycDesktopUpdateGate.show { display: flex; }

    .yc-desktop-update-card {
      width: min(520px, calc(100vw - 64px));
      border: 1px solid rgba(224, 86, 253, .46);
      border-radius: 18px;
      padding: 30px 34px 32px;
      background: linear-gradient(180deg, rgba(12, 22, 31, .99), rgba(6, 12, 18, .995));
      box-shadow: 0 30px 110px rgba(0,0,0,.68), 0 0 46px rgba(53,231,255,.08);
      color: #edfaff;
      text-align: center;
    }

    .yc-desktop-update-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .yc-desktop-update-brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(53,231,255,.24));
    }

    .yc-desktop-update-brand b { font-size: 18px; letter-spacing: .01em; }

    .yc-desktop-update-pill {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 5px 10px;
      border: 1px solid rgba(53,231,255,.28);
      border-radius: 999px;
      color: #8eeaff;
      background: rgba(53,231,255,.06);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    #ycDesktopUpdateTitle { margin: 0; font-size: 24px; line-height: 1.2; }
    #ycDesktopUpdateText { margin: 9px 0 0; color: #8ba5b5; font-size: 13px; line-height: 1.55; }

    #ycDesktopUpdateDetails {
      margin: 18px 0 0;
      border: 1px solid rgba(92,128,149,.24);
      border-radius: 12px;
      background: #07131c;
      text-align: left;
      overflow: hidden;
    }

    #ycDesktopUpdateDetails summary {
      cursor: pointer;
      list-style: none;
      padding: 12px 14px;
      color: #b8d6e5;
      font-size: 12px;
      font-weight: 850;
    }

    #ycDesktopUpdateDetails summary::-webkit-details-marker { display: none; }
    #ycDesktopUpdateNotes { white-space: pre-wrap; padding: 0 14px 13px; color: #7897a8; font-size: 11px; line-height: 1.55; }

    #ycDesktopUpdateProgress { display: none; margin-top: 18px; text-align: left; }
    #ycDesktopUpdateProgress.show { display: block; }
    #ycDesktopUpdateTrack { height: 9px; overflow: hidden; border: 1px solid rgba(53,231,255,.18); border-radius: 999px; background: #102531; }
    #ycDesktopUpdateBar { height: 100%; width: 0%; background: linear-gradient(90deg,#35e7ff,#8d72ff,#e056fd); transition: width .18s ease; }
    #ycDesktopUpdateProgressText { display: block; margin-top: 7px; color: #7897a8; font-size: 10px; }

    #ycDesktopUpdateButton {
      width: 100%;
      min-height: 52px;
      margin-top: 20px;
      border: 1px solid rgba(224,86,253,.75);
      border-radius: 12px;
      background: linear-gradient(135deg,#35e7ff 0%,#8d72ff 50%,#e056fd 100%);
      color: #041017;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .11em;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(224,86,253,.14);
      -webkit-app-region: no-drag;
    }

    #ycDesktopUpdateButton:disabled { opacity: .58; cursor: default; }
    #ycDesktopUpdateError { display: none; margin-top: 10px; color: #ff9faa; font-size: 10px; line-height: 1.4; }
    #ycDesktopUpdateError.show { display: block; }
    #ycDesktopUpdateSafety { margin-top: 13px; color: #637f90; font-size: 9px; line-height: 1.4; }

    #error {
      display: none;
      position: absolute;
      inset: var(--yc-titlebar-h) 0 0 0;
      color: white;
      background: #07111b;
      font-family: Arial, sans-serif;
      padding: 30px;
      z-index: 900;
    }
  </style>
</head>

<body>

  <div id="ycDesktopTitlebar" aria-label="Yamachat">
    <div class="yc-titlebar-tools" aria-label="Navigace Yamachat">
      <button id="ycSidebarToggle" class="yc-titlebar-tool" type="button" title="Skrýt hlavní menu" aria-label="Skrýt hlavní menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.2" width="12.4" height="11.6" rx="1.8"/><path d="M5.1 2.5v11"/></svg>
      </button>
      <button id="ycNavBack" class="yc-titlebar-tool" type="button" title="Zpět" aria-label="Zpět">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.2 5 8l4.8 4.8"/></svg>
      </button>
      <button id="ycNavForward" class="yc-titlebar-tool" type="button" title="Vpřed" aria-label="Vpřed">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6.2 3.2 4.8 4.8-4.8 4.8"/></svg>
      </button>
    </div>
    <div class="yc-titlebar-brand">
      <img src="build/yamachat-logo-full.png" alt="Yamachat">
    </div>
    <div class="yc-window-controls" aria-label="Ovládání okna">
      <button id="ycWindowMinimize" class="yc-window-btn" type="button" title="Minimalizovat" aria-label="Minimalizovat">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8"/></svg>
      </button>
      <button id="ycWindowMaximize" class="yc-window-btn" type="button" title="Maximalizovat" aria-label="Maximalizovat">
        <svg class="yc-max-one" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx=".4"/></svg>
        <svg class="yc-max-two" viewBox="0 0 12 12" aria-hidden="true" style="display:none"><path d="M4 2.2h5.8v5.8M2.2 4h5.8v5.8H2.2z"/></svg>
      </button>
      <button id="ycWindowClose" class="yc-window-btn close" type="button" title="Zavřít" aria-label="Zavřít">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
      </button>
    </div>
  </div>

  <iframe
  id="yamachat"
  allow="microphone; camera; display-capture; autoplay; fullscreen"
  allowfullscreen
></iframe>



  <div id="ycDesktopUpdateGate" aria-hidden="true">
    <div class="yc-desktop-update-card" role="dialog" aria-modal="true" aria-labelledby="ycDesktopUpdateTitle">
      <div class="yc-desktop-update-brand"><img src="build/yamachat-logo-symbol.png" alt=""><b>Yamachat</b></div>
      <div class="yc-desktop-update-pill">Povinná aktualizace</div>
      <h2 id="ycDesktopUpdateTitle">Aktualizace je vyžadována</h2>
      <p id="ycDesktopUpdateText"></p>
      <details id="ycDesktopUpdateDetails"><summary>⌄ Co je nového</summary><div id="ycDesktopUpdateNotes"></div></details>
      <div id="ycDesktopUpdateProgress"><div id="ycDesktopUpdateTrack"><div id="ycDesktopUpdateBar"></div></div><span id="ycDesktopUpdateProgressText"></span></div>
      <div id="ycDesktopUpdateError"></div>
      <button id="ycDesktopUpdateButton" type="button">STÁHNOUT A NAINSTALOVAT</button>
      <div id="ycDesktopUpdateSafety">Aktualizace používá GitHub Releases a stávající bezpečný rollback Yamachatu.</div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById("yamachat");

    let desktopUpdateState = null;
    let desktopUpdateGateAutoInstall = false;
    let desktopUpdateGateInstallBusy = false;

    function renderDesktopUpdateGate() {
      const st = desktopUpdateState || {};
      const gate = document.getElementById('ycDesktopUpdateGate');
      const button = document.getElementById('ycDesktopUpdateButton');
      if (!gate || !button) return;

      const status = String(st.status || '');
      const required = st.required === true;
      const visible = required && !!st.availableVersion && ['available','downloading','downloaded','installing','error'].includes(status);
      gate.classList.toggle('show', visible);
      gate.setAttribute('aria-hidden', visible ? 'false' : 'true');
      if (!visible) {
        desktopUpdateGateAutoInstall = false;
        desktopUpdateGateInstallBusy = false;
        return;
      }

      const pct = Math.max(0, Math.min(100, Number(st.percent || 0)));
      document.getElementById('ycDesktopUpdateText').textContent = `Verze ${st.availableVersion} je dostupná. Pro pokračování aktualizuj Yamachat.`;
      document.getElementById('ycDesktopUpdateNotes').textContent = String(st.releaseNotes || '').trim() || 'Opravy, vylepšení stability a nové funkce Yamachatu.';

      const progress = document.getElementById('ycDesktopUpdateProgress');
      const progressBar = document.getElementById('ycDesktopUpdateBar');
      const progressText = document.getElementById('ycDesktopUpdateProgressText');
      const errorBox = document.getElementById('ycDesktopUpdateError');
      const showProgress = ['downloading','downloaded','installing'].includes(status);
      progress.classList.toggle('show', showProgress);
      progressBar.style.width = (status === 'downloaded' || status === 'installing' ? 100 : pct) + '%';
      errorBox.classList.toggle('show', status === 'error');
      errorBox.textContent = status === 'error' ? String(st.error || 'Aktualizaci se nepodařilo dokončit.') : '';

      if (status === 'available') {
        button.disabled = false;
        button.textContent = 'STÁHNOUT A NAINSTALOVAT';
        progressText.textContent = '';
      } else if (status === 'downloading') {
        button.disabled = true;
        button.textContent = 'STAHUJI… ' + Math.round(pct) + ' %';
        progressText.textContent = 'Stahuji aktualizaci… ' + Math.round(pct) + ' %';
      } else if (status === 'downloaded') {
        button.disabled = desktopUpdateGateInstallBusy;
        button.textContent = desktopUpdateGateInstallBusy ? 'SPOUŠTÍM INSTALACI…' : 'RESTARTOVAT A NAINSTALOVAT';
        progressText.textContent = 'Staženo a ověřeno. Yamachat je připravený k instalaci.';
      } else if (status === 'installing') {
        button.disabled = true;
        button.textContent = 'INSTALUJI AKTUALIZACI…';
        progressText.textContent = 'Yamachat se zavře, nainstaluje novou verzi a znovu spustí.';
      } else if (status === 'error') {
        button.disabled = false;
        button.textContent = 'ZKUSIT ZNOVU';
        progressText.textContent = '';
      }
    }

    async function installDesktopUpdateFromGate() {
      if (desktopUpdateGateInstallBusy) return;
      desktopUpdateGateInstallBusy = true;
      renderDesktopUpdateGate();
      try { await window.yamachatDesktop?.installUpdate?.(); }
      catch (error) {
        console.warn('Yamachat update install failed', error);
        desktopUpdateGateInstallBusy = false;
        renderDesktopUpdateGate();
      }
    }

    document.getElementById('ycDesktopUpdateButton')?.addEventListener('click', async () => {
      const st = desktopUpdateState || {};
      const status = String(st.status || '');
      if (status === 'downloaded') {
        await installDesktopUpdateFromGate();
        return;
      }
      if (status === 'available' || status === 'error') {
        desktopUpdateGateAutoInstall = true;
        try { await window.yamachatDesktop?.downloadUpdate?.(); }
        catch (error) { console.warn('Yamachat update download failed', error); }
      }
    });

    function forwardUpdateState(state) {
      desktopUpdateState = state || null;
      renderDesktopUpdateGate();
      if (desktopUpdateGateAutoInstall && desktopUpdateState?.required === true && desktopUpdateState?.status === 'downloaded' && !desktopUpdateGateInstallBusy) {
        setTimeout(() => { void installDesktopUpdateFromGate(); }, 500);
      }
      try {
        iframe.contentWindow?.postMessage({ type: 'yamachat:update-state', state: desktopUpdateState }, '*');
      } catch (error) {
        console.warn('Yamachat update state bridge failed', error);
      }
    }

    window.yamachatDesktop?.onUpdateState?.(forwardUpdateState);
    void window.yamachatDesktop?.getUpdateState?.().then(forwardUpdateState).catch(() => {});

    window.yamachatDesktop?.onOpenNotificationTarget?.((target) => {
      const deliver = () => {
        try {
          const fn = iframe.contentWindow?.ycOpenDesktopNotificationTarget;
          if (typeof fn === 'function') { fn(target); return true; }
        } catch (error) {
          console.warn('Yamachat notification target forward failed', error);
        }
        return false;
      };
      if (!deliver()) setTimeout(deliver, 350);
    });

    const YC_DESKTOP_DEFAULT_THEME = '#e056fd';
    const YC_DESKTOP_THEME_PRESETS = [
      '#35e7ff', '#7bdcff', '#7b68ee', '#9b59b6', '#e056fd', '#e74c3c', '#e67e22',
      '#f1c40f', '#2ecc71', '#1abc9c', '#00bcd4', '#95a5a6', '#ecf0f1'
    ];
    let desktopThemeColor = YC_DESKTOP_DEFAULT_THEME;
    let desktopThemeAccountId = null;

    function ycDesktopNormalizeColor(value) {
      const color = String(value || '').trim().toLowerCase();
      return /^#[0-9a-f]{6}$/.test(color) ? color : YC_DESKTOP_DEFAULT_THEME;
    }

    function ycDesktopColorRgb(color) {
      const c = ycDesktopNormalizeColor(color).slice(1);
      return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)];
    }

    function applyDesktopChromeTheme(color) {
      const safe = ycDesktopNormalizeColor(color);
      desktopThemeColor = safe;
      const [r, g, b] = ycDesktopColorRgb(safe);
      document.documentElement.style.setProperty('--yc-desktop-accent', safe);
      document.documentElement.style.setProperty('--yc-desktop-accent-rgb', `${r}, ${g}, ${b}`);
      document.documentElement.style.setProperty('--yc-desktop-secondary', `color-mix(in srgb, ${safe} 48%, #b34dff)`);
      return safe;
    }

    function detectDesktopThemeAccountId() {
      try {
        const storage = iframe.contentWindow?.localStorage;
        if (!storage) return '';
        for (let i = 0; i < storage.length; i++) {
          const key = storage.key(i) || '';
          if (!key.includes('auth-token')) continue;
          try {
            const parsed = JSON.parse(storage.getItem(key) || 'null');
            const id = String(parsed?.user?.id || parsed?.currentSession?.user?.id || '').trim();
            if (id) return id;
          } catch {}
        }
      } catch {}
      return '';
    }

    async function saveDesktopThemeColor(color, { quiet = false } = {}) {
      const safe = applyDesktopChromeTheme(color);
      const userId = desktopThemeAccountId || detectDesktopThemeAccountId();
      desktopThemeAccountId = userId;
      try {
        if (userId) {
          await window.yamachatDesktop?.setAppSetting?.('uiThemeColorForUser', { userId, color: safe });
        } else {
          await window.yamachatDesktop?.setAppSetting?.('uiThemeColor', safe);
        }
      } catch (error) {
        console.warn('Yamachat desktop theme save failed', error);
      }
      applyDesktopThemeToIframe();
      if (!quiet) {
        try { iframe.contentWindow?.toast?.('Vzhled desktopu uložen jen pro desktop.'); } catch {}
      }
      return safe;
    }

    async function loadDesktopThemeColor({ accountAware = true, userId: explicitUserId } = {}) {
      try {
        const settings = await window.yamachatDesktop?.getAppSettings?.();
        const userId = explicitUserId ?? (accountAware ? detectDesktopThemeAccountId() : '');
        desktopThemeAccountId = userId;
        const accountColor = userId && settings?.uiThemeColors && typeof settings.uiThemeColors === 'object'
          ? settings.uiThemeColors[userId]
          : null;
        applyDesktopChromeTheme(accountColor || settings?.uiThemeColor || YC_DESKTOP_DEFAULT_THEME);
      } catch (error) {
        console.warn('Yamachat desktop theme load failed', error);
        applyDesktopChromeTheme(YC_DESKTOP_DEFAULT_THEME);
      }
      applyDesktopThemeToIframe();
    }

    let desktopSidebarCollapsed = false;
    let desktopSidebarLoaded = false;
    let desktopViewHistory = [];
    let desktopViewHistoryIndex = -1;
    let desktopViewHistoryRestoring = false;

    function updateSidebarToggleButton() {
      const btn = document.getElementById('ycSidebarToggle');
      if (!btn) return;
      btn.classList.toggle('sidebar-active', desktopSidebarCollapsed);
      btn.title = desktopSidebarCollapsed ? 'Zobrazit hlavní menu' : 'Skrýt hlavní menu';
      btn.setAttribute('aria-label', btn.title);
    }

    function applyDesktopSidebarStateToIframe() {
      try {
        const doc = iframe.contentWindow?.document;
        if (!doc) return;
        doc.documentElement.classList.toggle('yc-desktop-global-nav-collapsed', desktopSidebarCollapsed);
        doc.body?.classList.toggle('yc-desktop-global-nav-collapsed', desktopSidebarCollapsed);
      } catch (error) {
        console.warn('Yamachat sidebar state apply failed', error);
      }
      updateSidebarToggleButton();
    }

    async function loadDesktopSidebarState() {
      try {
        const settings = await window.yamachatDesktop?.getAppSettings?.();
        desktopSidebarCollapsed = settings?.sidebarCollapsed === true;
      } catch (error) {
        console.warn('Yamachat sidebar state load failed', error);
        desktopSidebarCollapsed = false;
      }
      desktopSidebarLoaded = true;
      applyDesktopSidebarStateToIframe();
      return desktopSidebarCollapsed;
    }

    async function setDesktopSidebarCollapsed(collapsed) {
      desktopSidebarCollapsed = !!collapsed;
      applyDesktopSidebarStateToIframe();
      try {
        await window.yamachatDesktop?.setAppSetting?.('sidebarCollapsed', desktopSidebarCollapsed);
      } catch (error) {
        console.warn('Yamachat sidebar state save failed', error);
      }
      return desktopSidebarCollapsed;
    }

    function desktopViewState() {
      try {
        const doc = iframe.contentWindow?.document;
        if (!doc) return null;
        const activeGlobal = doc.querySelector('#ycGlobalNav .active[id], #ycGlobalNav [aria-current="page"][id]');
        const activeCommunity = doc.querySelector('#rail [data-community].active');
        const activeChannel = doc.querySelector('#channelList [data-channel].active');
        const activeThread = doc.querySelector('#dmList [data-thread].active, [data-thread].active');
        const friendsHome = !!doc.querySelector('#ycFriendsHome:not(.hidden)');
        return {
          globalId: activeGlobal?.id || '',
          communityId: activeCommunity?.dataset?.community || '',
          channelId: activeChannel?.dataset?.channel || '',
          threadId: activeThread?.dataset?.thread || '',
          friendsHome
        };
      } catch {
        return null;
      }
    }

    function desktopViewStateKey(state) {
      return state ? [state.globalId, state.communityId, state.channelId, state.threadId, state.friendsHome ? '1' : '0'].join('|') : '';
    }

    function updateDesktopHistoryButtons() {
      const back = document.getElementById('ycNavBack');
      const forward = document.getElementById('ycNavForward');
      if (back) back.disabled = desktopViewHistoryIndex <= 0;
      if (forward) forward.disabled = desktopViewHistoryIndex < 0 || desktopViewHistoryIndex >= desktopViewHistory.length - 1;
    }

    function rememberDesktopView() {
      if (desktopViewHistoryRestoring) return;
      const state = desktopViewState();
      if (!state) return;
      const key = desktopViewStateKey(state);
      const current = desktopViewHistory[desktopViewHistoryIndex];
      if (current && desktopViewStateKey(current) === key) {
        updateDesktopHistoryButtons();
        return;
      }
      if (desktopViewHistoryIndex < desktopViewHistory.length - 1) {
        desktopViewHistory = desktopViewHistory.slice(0, desktopViewHistoryIndex + 1);
      }
      desktopViewHistory.push(state);
      if (desktopViewHistory.length > 40) desktopViewHistory.shift();
      desktopViewHistoryIndex = desktopViewHistory.length - 1;
      updateDesktopHistoryButtons();
    }

    const ycDesktopSleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function restoreDesktopView(state) {
      if (!state) return false;
      desktopViewHistoryRestoring = true;
      try {
        const doc = iframe.contentWindow?.document;
        if (!doc) return false;

        if (state.globalId) {
          doc.getElementById(state.globalId)?.click();
          await ycDesktopSleep(90);
        }
        if (state.friendsHome) {
          doc.getElementById('ycFriendsRailBtn')?.click();
          await ycDesktopSleep(110);
        }
        if (state.communityId) {
          doc.querySelector(`#rail [data-community="${CSS.escape(state.communityId)}"]`)?.click();
          await ycDesktopSleep(220);
        }
        if (state.channelId) {
          doc.querySelector(`#channelList [data-channel="${CSS.escape(state.channelId)}"]`)?.click();
          await ycDesktopSleep(140);
        }
        if (state.threadId) {
          if (!state.friendsHome) doc.getElementById('ycFriendsRailBtn')?.click();
          await ycDesktopSleep(100);
          doc.querySelector(`[data-thread="${CSS.escape(state.threadId)}"]`)?.click();
          await ycDesktopSleep(140);
        }
        return true;
      } catch (error) {
        console.warn('Yamachat desktop history restore failed', error);
        return false;
      } finally {
        desktopViewHistoryRestoring = false;
        updateDesktopHistoryButtons();
      }
    }

    async function navigateDesktopHistory(delta) {
      const next = desktopViewHistoryIndex + delta;
      if (next >= 0 && next < desktopViewHistory.length) {
        desktopViewHistoryIndex = next;
        await restoreDesktopView(desktopViewHistory[next]);
        return;
      }
      try {
        if (delta < 0) iframe.contentWindow?.history?.back?.();
        else iframe.contentWindow?.history?.forward?.();
      } catch {}
      updateDesktopHistoryButtons();
    }

    function installDesktopHistoryCapture() {
      try {
        const doc = iframe.contentWindow?.document;
        if (!doc || doc.__ycDesktopHistoryBound) return;
        doc.__ycDesktopHistoryBound = true;
        const selector = '#ycGlobalNav button, #rail [data-community], #channelList [data-channel], #dmList [data-thread], [data-thread], #friendsTab, #membersTab, #ycFriendsRailBtn';
        doc.addEventListener('click', event => {
          if (!event.target?.closest?.(selector)) return;
          setTimeout(rememberDesktopView, 90);
          setTimeout(rememberDesktopView, 360);
        }, true);
        setTimeout(rememberDesktopView, 250);
      } catch (error) {
        console.warn('Yamachat desktop history capture failed', error);
      }
    }

      btn.title = maximized ? 'Obnovit velikost' : 'Maximalizovat';

    function syncDesktopServerAccentScope(doc) {
      if (!doc) return;
      // Server color is deliberately kept away from the global UI skin in desktop.
      for (const el of [doc.querySelector('#side .side-head'), doc.querySelector('.right')]) {
        if (!el) continue;
        el.classList.remove('yc-community-colored');
        el.style.removeProperty('--yc-server-color');
        el.style.removeProperty('--yc-server-rgb');
      }

      const voice = doc.querySelector('#voiceControls');
      if (!voice) return;
      const activeServer = doc.querySelector('#rail [data-community].active');
      const color = activeServer?.style?.getPropertyValue('--yc-server-color')?.trim() || '';
      const rgb = activeServer?.style?.getPropertyValue('--yc-server-rgb')?.trim() || '';
      if (/^#[0-9a-f]{6}$/i.test(color)) {
        voice.style.setProperty('--yc-server-color', color);
        if (rgb) voice.style.setProperty('--yc-server-rgb', rgb);
        voice.classList.add('yc-desktop-server-voice-accent');
      } else {
        voice.classList.remove('yc-desktop-server-voice-accent');
        voice.style.removeProperty('--yc-server-color');
        voice.style.removeProperty('--yc-server-rgb');
      }
    }

        const settings = await window.yamachatDesktop?.getAppSettings?.();

    async function saveDesktopServerCardBackground(communityId, background) {
      const id = String(communityId || '').trim();
      if (!id) throw new Error('Chybí ID serveru.');
      const value = String(background || '').trim();
      const settings = await window.yamachatDesktop?.setAppSetting?.('serverCardBackground', {
        communityId: id,
        background: value
      });
      desktopServerCardBackgrounds = settings?.serverCardBackgrounds && typeof settings.serverCardBackgrounds === 'object'
        ? { ...settings.serverCardBackgrounds }

    function ycCompressServerCardImage(file) {
      return new Promise((resolve, reject) => {
        if (!file || !String(file.type || '').startsWith('image/')) {
          reject(new Error('Vyber obrázek PNG, JPG nebo WEBP.'));
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          reject(new Error('Obrázek je příliš velký. Maximum je 8 MB.'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Obrázek se nepodařilo načíst.'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('Obrázek se nepodařilo zpracovat.'));
          image.onload = () => {
            try {
              const maxW = 1280, maxH = 640;
              const scale = Math.min(1, maxW / image.naturalWidth, maxH / image.naturalHeight);
              const width = Math.max(1, Math.round(image.naturalWidth * scale));
              const height = Math.max(1, Math.round(image.naturalHeight * scale));
              const canvas = document.createElement('canvas');
              canvas.width = width; canvas.height = height;
              const ctx = canvas.getContext('2d', { alpha: false });
              ctx.fillStyle = '#07131f'; ctx.fillRect(0, 0, width, height);
              ctx.drawImage(image, 0, 0, width, height);
              let data = canvas.toDataURL('image/webp', .76);
              if (data.length > 1150000) data = canvas.toDataURL('image/jpeg', .68);
              if (data.length > 1150000) throw new Error('Obrázek je i po zmenšení příliš velký.');
              resolve(data);
            } catch (error) { reject(error); }
          };
          image.src = String(reader.result || '');
        };
        reader.readAsDataURL(file);
      });
    }

    function decorateDesktopServerCards() {
      try {
        const doc = iframe.contentWindow?.document;
        if (!doc) return;
        installDesktopServerCardBackgroundStyle(doc);
        doc.querySelectorAll('#rail [data-community], .yc-v3-ribbon [data-community]').forEach(card => {
          const id = String(card.dataset?.community || '').trim();
          if (!id) return;
          const custom = iframe.contentWindow?.ycGetServerHeaderBackground?.(id) || '';
          const bg = custom || YC_SERVER_CARD_DEFAULT_BG;
          card.style.setProperty('--yc-card-bg', `url("${ycSafeCssUrl(bg)}")`);
          card.dataset.ycCardBackground = custom ? 'custom' : 'default';
        });

        // Keep the large CURRENT COMMUNITY header on the same image as the active server card.
        // Unlike the compact ribbon cards, this header deliberately has no blur.
        const current = ycDesktopCommunityInfo(doc);
        const sideHead = doc.querySelector('.yc-v3-content-grid .side-head, .side-head');
        if (sideHead && current?.id) {
          const custom = iframe.contentWindow?.ycGetServerHeaderBackground?.(current.id) || '';
          const bg = custom || YC_SERVER_CARD_DEFAULT_BG;
          sideHead.style.setProperty('--yc-current-community-bg', `url("${ycSafeCssUrl(bg)}")`);
          sideHead.dataset.ycHeaderBackground = custom ? 'custom' : 'default';
        }
      } catch (error) {
        console.warn('Yamachat server card decorate failed', error);
      }
    }

    function openDesktopServerCardBackgroundModal(host = null) {
      try {
        const win = iframe.contentWindow;
        const doc = win?.document;
        if (!win || !doc) return;
        if (!ycCanManageServerAppearance(win)) {
          try { win.toast?.('Na změnu vzhledu serveru nemáš oprávnění.', true); } catch {}
          return;
        }
        const community = ycDesktopCommunityInfo(doc);
        if (!community) return;
        doc.querySelector('.yc-server-card-bg-backdrop')?.remove();
        let selected = win.ycGetServerHeaderBackground?.(community.id) || '';
        const back = doc.createElement('div');
        back.className = host ? 'yc-server-card-bg-embedded' : 'yc-server-card-bg-backdrop';
        back.innerHTML = `
          <div class="yc-server-card-bg-modal" role="dialog" aria-modal="true">
            <div class="yc-server-card-bg-head"><strong>🎨 Pozadí karty · ${String(community.name).replace(/[<>&"]/g,'')}</strong><button class="yc-server-card-bg-close" type="button">×</button></div>
            <div class="yc-server-card-bg-preview"><span>${String(community.name).replace(/[<>&"]/g,'')}</span></div>
            <div class="yc-server-card-bg-actions">
              <label class="yc-server-card-bg-file">Vybrat vlastní obrázek<input type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
              <button type="button" data-yc-bg-default>↺ Yamachat logo</button>
              <button type="button" class="yc-server-card-bg-save" data-yc-bg-save>Uložit pozadí karty</button>
            </div>
            <div class="yc-server-card-bg-note">Výchozí karta používá rozmazané Yamachat logo bez nápisu. Vlastní obrázek se zmenší a uloží na server. Uvidí ho všichni členové v nové desktopové aplikaci. Přístup řídí oprávnění „Správa serveru“.</div>
          </div>`;
        (host || doc.body).appendChild(back);
        if(host){
          const panel=back.querySelector('.yc-server-card-bg-modal');
          panel.removeAttribute('role');panel.removeAttribute('aria-modal');
          back.querySelector('.yc-server-card-bg-close').hidden=true;
          back.querySelector('.yc-server-card-bg-head strong').textContent='Pozadí hlavičky';
          back.querySelector('.yc-server-card-bg-note').textContent='Vyber vlastní obrázek nebo obnov výchozí pozadí Yamachatu. Změnu uvidí všichni členové v desktopové aplikaci.';
        }
        const preview = back.querySelector('.yc-server-card-bg-preview');
        const paint = () => preview?.style.setProperty('--yc-preview-bg', `url("${ycSafeCssUrl(selected || YC_SERVER_CARD_DEFAULT_BG)}")`);
        paint();
        back.querySelector('.yc-server-card-bg-close').onclick = () => back.remove();
        back.addEventListener('click', e => { if (e.target === back) back.remove(); });
        const input = back.querySelector('input[type="file"]');
        input.onchange = async () => {
          const file = input.files?.[0];
          if (!file) return;
          try { selected = await ycCompressServerCardImage(file); paint(); }
          catch (error) { try { win.toast?.(String(error?.message || error), true); } catch {} }
        };
        back.querySelector('[data-yc-bg-default]').onclick = () => { selected = ''; paint(); };
        back.querySelector('[data-yc-bg-save]').onclick = async () => {
          const btn = back.querySelector('[data-yc-bg-save]');
          btn.disabled = true;
          try {
            await win.ycSaveServerHeaderBackground(community.id, selected);
            if(!host)back.remove();
            btn.disabled=false;
            try { win.toast?.(selected ? 'Pozadí serverové karty uloženo.' : 'Obnoveno výchozí Yamachat pozadí.'); } catch {}
          } catch (error) {
            btn.disabled = false;
            try { win.toast?.('Pozadí se nepodařilo uložit: ' + String(error?.message || error), true); } catch {}
          }
        };
      } catch (error) {
        console.warn('Yamachat server card background modal failed', error);
      }
    }

    function installDesktopServerCardBackgroundFeature() {
      try {
        const win = iframe.contentWindow;
        const doc = win?.document;
        if (!win || !doc) return;
        installDesktopServerCardBackgroundStyle(doc);
        decorateDesktopServerCards();

        win.ycOpenDesktopServerCardBackgroundModal = openDesktopServerCardBackgroundModal;
        if (!doc.__ycServerCardPermissionObserver) {
          let queued=false;
          const relevant=node=>node?.nodeType===1&&(node.matches?.('#rail,.yc-v3-ribbon,.side-head,[data-community]')||node.closest?.('#rail,.yc-v3-ribbon,.side-head')||node.querySelector?.('#rail,.yc-v3-ribbon,.side-head'));
          const observer = new MutationObserver(records => {
            if(queued||!records.some(record=>relevant(record.target)||[...record.addedNodes,...record.removedNodes].some(relevant)))return;
            queued=true;requestAnimationFrame(()=>{queued=false;decorateDesktopServerCards()});
          });
          observer.observe(doc.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class','data-community'] });
          doc.__ycServerCardPermissionObserver = observer;
        }
      } catch (error) {
        console.warn('Yamachat server card feature install failed', error);
      }
    }

    function installDesktopAppearanceIntegration() {
      try {
        const win = iframe.contentWindow;
        const doc = win?.document;
        if (!win || !doc) return;
        installDesktopAppearanceStyle(doc);
        installDesktopFullThemeStyle(doc);
        installDesktopCardHarmonyStyle(doc);
        installDesktopServerCardBackgroundFeature();
        applyDesktopSidebarStateToIframe();
        installDesktopHistoryCapture();


        if (!win.__ycDesktopAppearanceRegistered && win.YamachatAppSettings?.register) {
          win.__ycDesktopAppearanceRegistered = true;
          win.YamachatAppSettings.register({
            id: 'desktop-appearance',
            title: 'Vzhled desktopu',
            description: 'Osobní barva celého Yamachatu v desktopové aplikaci. Ukládá se lokálně a nezasahuje do webu.',
            render: appearanceSectionHtml,
            bind: bindAppearanceSection
          });
        }

        syncDesktopServerAccentScope(doc);
      } catch (error) {
        console.warn('Yamachat desktop appearance integration failed', error);
      }
    }

    function applyDesktopThemeToIframe(color = desktopThemeColor) {
      try {
        const safe = ycDesktopNormalizeColor(color);
        const win = iframe.contentWindow;
        const doc = win?.document;
        if (!win || !doc) return;
        try { win.localStorage?.setItem('yc_theme_color', safe); } catch {}
        const [r, g, b] = ycDesktopColorRgb(safe);
        doc.documentElement.style.setProperty('--yc-theme', safe);
        doc.documentElement.style.setProperty('--yc-theme-rgb', `${r},${g},${b}`);
        doc.documentElement.style.setProperty('--yc-logo-secondary', `color-mix(in srgb, ${safe} 48%, #b34dff)`);
        if (typeof win.ycApplyThemeColor === 'function') {
          win.ycApplyThemeColor(safe);
        } else {
          doc.documentElement.style.setProperty('--yc-theme', safe);
        }
        installDesktopAppearanceIntegration();
      } catch (error) {
        console.warn('Yamachat desktop iframe theme failed', error);
      }
    }

    function installYamachatBranding() {
      try {
        const doc = iframe.contentWindow?.document;
        if (!doc) return;
        installDesktopAppearanceIntegration();
        applyDesktopThemeToIframe();
        applyDesktopSidebarStateToIframe();
        installDesktopHistoryCapture();
        syncDesktopServerAccentScope(doc);
        installDesktopServerCardBackgroundFeature();

        if (!doc.getElementById('ycDesktopBrandingStyle')) {
          const style = doc.createElement('style');
          style.id = 'ycDesktopBrandingStyle';
          style.textContent = `
            #ycGlobalNav .brand.yc-desktop-brand {
              display:block !important;
              width:100% !important;
              min-width:0 !important;
              margin:1px 0 18px !important;
              padding:0 2px !important;
            }
            #ycGlobalNav .brand.yc-desktop-brand > .logo,
            #ycGlobalNav .brand.yc-desktop-brand > span {
              display:none !important;
            }
            #ycGlobalNav .yc-desktop-brand-logo {
              display:block;
              width:118px;
              max-width:100%;
              height:auto;
              object-fit:contain;
              cursor:pointer;
              outline:none;
              filter:drop-shadow(0 4px 12px rgba(34,195,255,.13));
              transition:transform .15s ease,filter .15s ease;
            }
            #ycGlobalNav .yc-desktop-brand-logo:hover {
              transform:translateY(-1px) scale(1.015);
              filter:drop-shadow(0 5px 15px rgba(47,211,255,.20))
                     drop-shadow(0 0 12px rgba(168,74,255,.10));
            }
            #auth .brand.yc-desktop-auth-brand {
              display:block !important;
              margin-bottom:14px !important;
            }
            #auth .brand.yc-desktop-auth-brand > .logo,
            #auth .brand.yc-desktop-auth-brand > span {
              display:none !important;
            }
            #auth .yc-desktop-auth-logo {
              display:block;
              width:min(290px,82vw);
              height:auto;
              margin:0 auto;
              object-fit:contain;
              filter:drop-shadow(0 8px 24px rgba(61,194,255,.16));
            }
          `;
          doc.head?.appendChild(style);
        }

        const navBrand = doc.querySelector('#ycGlobalNav .brand');
        if (navBrand) {
          navBrand.classList.add('yc-desktop-brand');
          let img = navBrand.querySelector('.yc-desktop-brand-logo');
          if (!img) {
            img = doc.createElement('img');
            img.className = 'yc-desktop-brand-logo';
            img.alt = 'Yamachat';
            img.draggable = false;
            img.src = YAMACHAT_BRAND_LOGO;
            navBrand.appendChild(img);

            const oldLogo = navBrand.querySelector('.logo');
            img.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopPropagation();
              try {
                if (typeof iframe.contentWindow?.YamachatAppSettings?.open === 'function') {
                  void iframe.contentWindow.YamachatAppSettings.open();
                } else if (typeof iframe.contentWindow?.ycOpenThemeModal === 'function') {
                  iframe.contentWindow.ycOpenThemeModal();
                } else {
                  oldLogo?.click();
                }
              } catch {
                oldLogo?.click();
              }
            });
            img.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                img.click();
              }
            });
            img.tabIndex = 0;
            img.setAttribute('role', 'button');
            img.title = 'Moje barva Yamachatu';
          }
        }

        const authBrand = doc.querySelector('#auth .brand');
        if (authBrand) {
          authBrand.classList.add('yc-desktop-auth-brand');
          let img = authBrand.querySelector('.yc-desktop-auth-logo');
          if (!img) {
            img = doc.createElement('img');
            img.className = 'yc-desktop-auth-logo';
            img.alt = 'Yamachat';
            img.draggable = false;
            img.src = YAMACHAT_BRAND_LOGO;
            authBrand.appendChild(img);
          }
        }
      } catch (error) {
        console.warn('Yamachat desktop branding install failed', error);
      }
    }


    async function sendAppSettingsState() {
      try {
        if (!window.yamachatDesktop?.getAppSettings || !iframe.contentWindow) return;
        const settings = await window.yamachatDesktop.getAppSettings();
        iframe.contentWindow.postMessage({
          type: 'yamachat:app-settings-state',
          settings
        }, '*');
      } catch (error) {
        console.warn('Yamachat settings bridge state failed', error);
      }
    }

    window.addEventListener('message', async (event) => {
      if (event.source !== iframe.contentWindow) return;
      if (event.data?.type === 'yamachat:client-ready' && iframe.contentWindow?.__ycClientReady === true) {
        void window.yamachatDesktop?.reportRendererReady?.();
        return;
      }
      const data = event.data || {};
      if (data.type !== 'yamachat:desktop-request' || !data.requestId) return;

      let ok = true;
      let result = null;
      let error = '';

      try {
        if (data.action === 'get-settings') {
          result = await window.yamachatDesktop?.getAppSettings?.();
        } else if (data.action === 'set-setting') {
          result = await window.yamachatDesktop?.setAppSetting?.(
            data.payload?.key,
            data.payload?.value
          );
        } else if (data.action === 'get-update-state') {
          result = await window.yamachatDesktop?.getUpdateState?.();
        } else if (data.action === 'check-update') {
          result = await window.yamachatDesktop?.checkForUpdates?.();
        } else if (data.action === 'download-update') {
          result = await window.yamachatDesktop?.downloadUpdate?.();
        } else if (data.action === 'install-update') {
          result = await window.yamachatDesktop?.installUpdate?.();
        } else {
          throw new Error('Unknown desktop request: ' + data.action);
        }
      } catch (err) {
        ok = false;
        error = String(err?.message || err);
      }

      try {
        iframe.contentWindow.postMessage({
          type: 'yamachat:desktop-response',
          requestId: data.requestId,
          ok,
          result,
          error
        }, '*');
      } catch (err) {
        console.warn('Yamachat settings bridge response failed', err);
      }
    });

    function patchDisplayMedia(targetWindow) {
      try {
        const media = targetWindow.navigator?.mediaDevices;

        if (!media?.getDisplayMedia) {
          return;
        }

        if (media.__yamachatPatched) {
          return;
        }

        const originalGetDisplayMedia =
          media.getDisplayMedia.bind(media);

        media.getDisplayMedia = async function(constraints = {}) {
          console.log(
            "Yamachat original capture constraints:",
            constraints
          );

          const safeConstraints = {
            video: true
          };

          if (constraints.audio) {
            safeConstraints.audio = true;
          }

          console.log(
            "Yamachat Electron capture constraints:",
            safeConstraints
          );

          return originalGetDisplayMedia(safeConstraints);
        };

        media.__yamachatPatched = true;

        console.log("Yamachat display capture patched");
      } catch (error) {
        console.error("Display capture patch error:", error);
      }
    }

    patchDisplayMedia(window);

    iframe.addEventListener("load", () => {
      try {
        patchDisplayMedia(iframe.contentWindow);
      } catch (error) {
        console.error("Iframe patch error:", error);
      }
      void sendAppSettingsState();
      if (desktopUpdateState) forwardUpdateState(desktopUpdateState);
      if (iframe.contentWindow?.__ycClientReady === true) void window.yamachatDesktop?.reportRendererReady?.();
      if (!desktopSidebarLoaded) void loadDesktopSidebarState();
      if (!desktopServerCardBackgroundsLoaded) void loadDesktopServerCardBackgrounds();
      installDesktopAppearanceIntegration();
      installDesktopServerCardBackgroundFeature();
      applyDesktopThemeToIframe();
      applyDesktopSidebarStateToIframe();
      installDesktopHistoryCapture();
      installYamachatBranding();
      setTimeout(rememberDesktopView, 450);

    });

    // Explicit bridge to the module client; assigning window properties does not
    // replace module-scoped theme functions. Finish appearance before first reveal.
    window.YamachatDesktopAppearance = Object.freeze({
      async loadTheme(userId) {
        await desktopAppearanceLoaded;
        await loadDesktopThemeColor({ userId });
        return desktopThemeColor;
      },
      saveTheme: color => saveDesktopThemeColor(color),
      async prepare(userId) {
        await desktopAppearanceLoaded;
        if (desktopThemeAccountId !== userId) await loadDesktopThemeColor({ userId });
        installYamachatBranding();
        const doc = iframe.contentDocument;
        await Promise.all([...doc.querySelectorAll('.yc-desktop-brand-logo,.yc-desktop-auth-logo')]
          .map(img => img.decode?.().catch(() => {})));
      }
    });

    fetch(
      "./desktop-client.html",
      {
        cache: "no-store"
      }
    )
    .then(response => {
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return response.text();
    })
    .then(html => {
      iframe.srcdoc = html;
    })
    .catch(error => {
      console.error(error);

      const box = document.getElementById("error");

      box.style.display = "block";

      box.innerHTML =
        "<h2>Yamachat se nepodařilo načíst</h2>" +
        "<p>" + String(error.message || error) + "</p>";
    });
  </script>

</body>
</html>
