name: Build YamaSearch Address Popup Fix Preview

on:
  push:
    branches:
      - hotfix/yamasearch-address-popup-position

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore products/yamasearch/YamaSearch.csproj
      - name: Publish preview
        shell: pwsh
        run: |
          $out='products/yamasearch/artifacts/address-popup-preview'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet publish products/yamasearch/YamaSearch.csproj -c Release -r win-x64 --self-contained false -p:Version=0.2.2 -p:AssemblyVersion=0.2.2.0 -p:FileVersion=0.2.2.0 -o $out
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          Compress-Archive -Path "$out/*" -DestinationPath 'YamaSearch-Address-Popup-Fix-Preview.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: YamaSearch-Address-Popup-Fix-Preview
          path: YamaSearch-Address-Popup-Fix-Preview.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
