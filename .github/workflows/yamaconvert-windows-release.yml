name: Publish YamaConvert Windows app

on:
  pull_request:
    paths:
      - 'products/yamaconvert/windows/**'
      - '.github/workflows/yamaconvert-windows-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing YamaConvert release tag to attach the Windows packages to
        required: true
        default: yamaconvert-v1.0.8-10006
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test standalone desktop app, portable ZIP and setup EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $nodeVersion = '22.23.3'
          $work = Join-Path $env:RUNNER_TEMP 'yamaconvert-windows'
          $stage = Join-Path $work 'package'
          $appDir = Join-Path $stage 'resources\app'
          New-Item -ItemType Directory -Path $stage, $appDir -Force | Out-Null

          $nodeZipName = "node-v$nodeVersion-win-x64.zip"
          $nodeBase = "https://nodejs.org/dist/v$nodeVersion"
          $nodeZip = Join-Path $work $nodeZipName
          Invoke-WebRequest -Uri "$nodeBase/$nodeZipName" -OutFile $nodeZip
          $nodeChecksums = (Invoke-WebRequest -Uri "$nodeBase/SHASUMS256.txt").Content
          $nodeLine = [regex]::Match($nodeChecksums, "(?m)^([0-9a-f]{64})\s+\*?$([regex]::Escape($nodeZipName))$")
          if (-not $nodeLine.Success) { throw 'Oficiální seznam Node.js neobsahuje kontrolní součet archivu.' }
          if ((Get-FileHash -LiteralPath $nodeZip -Algorithm SHA256).Hash -ine $nodeLine.Groups[1].Value) { throw 'Kontrolní součet Node.js nesouhlasí.' }
          Expand-Archive -LiteralPath $nodeZip -DestinationPath $work
          $nodeDir = Join-Path $work "node-v$nodeVersion-win-x64"
          $runtimeDir = Join-Path $stage 'runtime'
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Copy-Item (Join-Path $nodeDir 'node.exe') (Join-Path $runtimeDir 'node.exe')
          Copy-Item (Join-Path $nodeDir 'LICENSE') (Join-Path $runtimeDir 'NODE-LICENSE.txt')

          $headers = @{ 'User-Agent' = 'YamaConvert-Windows-Packager'; 'Accept' = 'application/vnd.github+json'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          $electronRelease = Invoke-RestMethod -Uri 'https://api.github.com/repos/electron/electron/releases/latest' -Headers $headers
          $electronVersion = [string]$electronRelease.tag_name
          if ($electronVersion -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Electron API nevrátila stabilní verzi.' }
          $electronZipName = "electron-$electronVersion-win32-x64.zip"
          $electronAsset = $electronRelease.assets | Where-Object name -eq $electronZipName | Select-Object -First 1
          if (-not $electronAsset) { throw "Oficiální Electron vydání neobsahuje $electronZipName." }
          $electronHash = [regex]::Match([string]$electronAsset.digest, '^sha256:([0-9a-fA-F]{64})$')
          if (-not $electronHash.Success) { throw 'GitHub API nevrátilo ověřitelný SHA-256 pro Electron.' }
          $electronZip = Join-Path $work $electronZipName
          Invoke-WebRequest -Uri $electronAsset.browser_download_url -OutFile $electronZip -Headers $headers
          if ((Get-FileHash -LiteralPath $electronZip -Algorithm SHA256).Hash -ine $electronHash.Groups[1].Value) { throw 'Kontrolní součet Electronu nesouhlasí.' }
          $electronDir = Join-Path $work 'electron'
          Expand-Archive -LiteralPath $electronZip -DestinationPath $electronDir
          Copy-Item (Join-Path $electronDir '*') $stage -Recurse -Force
          $electronExe = Join-Path $stage 'electron.exe'
          if (-not (Test-Path -LiteralPath $electronExe)) { throw 'Stažený Electron neobsahuje spustitelný soubor.' }
          Move-Item -LiteralPath $electronExe -Destination (Join-Path $stage 'YamaConvert.exe')
          $defaultApp = Join-Path $stage 'resources\default_app.asar'
          if (Test-Path -LiteralPath $defaultApp) { Remove-Item -LiteralPath $defaultApp -Force }

          $windowsSource = 'products/yamaconvert/windows'
          Get-ChildItem -LiteralPath $windowsSource -Force | Where-Object { $_.Name -notin @('YamaConvert.iss', 'Start-YamaConvert.cmd', 'Stop-YamaConvert.cmd', 'Stop-YamaConvert.ps1', 'Start-YamaConvert.ps1', 'Install-YtDlp.ps1') } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $appDir -Recurse -Force
          }
          Copy-Item 'products/yamaconvert/windows/README-Windows.txt' (Join-Path $stage 'README-Windows.txt')
          Copy-Item 'products/yamaconvert/windows/THIRD-PARTY-NOTICES.md' (Join-Path $stage 'THIRD-PARTY-NOTICES.md')

          $resourceEditor = Join-Path $work 'rcedit-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile $resourceEditor
          $resourceEditorHash = (Get-FileHash -LiteralPath $resourceEditor -Algorithm SHA256).Hash
          if ($resourceEditorHash -ine '3E7801DB1A5EDBEC91B49A24A094AAD776CB4515488EA5A4CA2289C400EADE2A') { throw 'Kontrolní součet nástroje pro ikonu EXE nesouhlasí.' }
          & $resourceEditor (Join-Path $stage 'YamaConvert.exe') --set-icon (Join-Path $appDir 'icons\yamaconvert.ico')
          if ($LASTEXITCODE -ne 0) { throw 'Logo se nepodařilo vložit do souboru YamaConvert.exe.' }

          $ytRelease = Invoke-RestMethod -Uri 'https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest' -Headers $headers
          $ytBinary = $ytRelease.assets | Where-Object name -eq 'yt-dlp.exe' | Select-Object -First 1
          if (-not $ytBinary) { throw 'Oficiální vydání yt-dlp neobsahuje program.' }
          $ytTemp = Join-Path $work 'yt-dlp.exe'
          Invoke-WebRequest -Uri $ytBinary.browser_download_url -OutFile $ytTemp -Headers $headers
          $ytHash = [regex]::Match([string]$ytBinary.digest, '^sha256:([0-9a-fA-F]{64})$')
          if (-not $ytHash.Success) { throw 'GitHub API nevrátilo SHA-256 pro oficiální yt-dlp.exe.' }
          if ((Get-FileHash -LiteralPath $ytTemp -Algorithm SHA256).Hash -ine $ytHash.Groups[1].Value) { throw 'Kontrolní součet yt-dlp nesouhlasí.' }
          $ytDir = Join-Path $appDir 'vendor\yt-dlp'
          New-Item -ItemType Directory -Path $ytDir -Force | Out-Null
          Move-Item -LiteralPath $ytTemp -Destination (Join-Path $ytDir 'yt-dlp.exe')
          & (Join-Path $ytDir 'yt-dlp.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Přibalený yt-dlp se nepodařilo spustit.' }

          foreach ($required in @('YamaConvert.exe', 'runtime\node.exe', 'resources\app\main.cjs', 'resources\app\preview.cjs', 'resources\app\media-downloader.cjs', 'resources\app\icons\yamaconvert.ico', 'resources\app\vendor\yt-dlp\yt-dlp.exe')) {
            if (-not (Test-Path (Join-Path $stage $required))) { throw "Balíčku chybí $required." }
          }
          $env:YAMACONVERT_SMOKE_TEST = '1'
          $smoke = Start-Process -FilePath (Join-Path $stage 'YamaConvert.exe') -WorkingDirectory $stage -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(35)
          while (-not $smoke.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 400; $smoke.Refresh() }
          Remove-Item Env:YAMACONVERT_SMOKE_TEST -ErrorAction SilentlyContinue
          if (-not $smoke.HasExited) {
            Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue
            throw 'Test samostatného okna doběhl do limitu.'
          }
          if ($smoke.ExitCode -ne 0) { throw "Test samostatného okna selhal (exit code $($smoke.ExitCode))." }

          $portable = Join-Path $work 'YamaConvert-Windows-Portable.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $portable -CompressionLevel Optimal
          if ((Get-Item $portable).Length -lt 100000) { throw 'Vytvořený ZIP je neúplný.' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Na Windows runneru chybí Inno Setup.' }
          & $iscc "/DSourceDir=$stage" "/DOutputDir=$work" 'products/yamaconvert/windows/YamaConvert.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Vytvoření instalačního EXE selhalo.' }
          $setup = Join-Path $work 'YamaConvert-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup) -or (Get-Item $setup).Length -lt 100000) { throw 'Instalační EXE je neúplné.' }
          $zipSum = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeSum = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$zipSum  YamaConvert-Windows-Portable.zip", "$exeSum  YamaConvert-Setup.exe") | Set-Content -LiteralPath (Join-Path $work 'YamaConvert-Windows-SHA256SUMS.txt') -Encoding ascii
          "PORTABLE_PATH=$portable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_PATH=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SUMS_PATH=$(Join-Path $work 'YamaConvert-Windows-SHA256SUMS.txt')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Attach Windows downloads to the YamaConvert release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^yamaconvert-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$') { throw 'Neplatná značka vydání YamaConvert.' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY | Out-Null
          gh release upload $env:RELEASE_TAG $env:SETUP_PATH $env:PORTABLE_PATH $env:SUMS_PATH --repo $env:GITHUB_REPOSITORY --clobber

      - name: Publish Windows downloads to Yamaportal
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CLOUDFLARE_API_TOKEN -or -not $env:CLOUDFLARE_ACCOUNT_ID) { throw 'Chybí ověření úložiště Yamaportalu.' }
          $version = [regex]::Match($env:RELEASE_TAG, '^yamaconvert-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$').Groups[1].Value
          if (-not $version) { throw 'Verzi nelze bezpečně určit ze značky vydání.' }
          $expectedSetup = (Get-FileHash -LiteralPath $env:SETUP_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPortable = (Get-FileHash -LiteralPath $env:PORTABLE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          $base = 'https://updates.yamachat.eu/yamaconvert'
          $versioned = @(
            @{ source=$env:SETUP_PATH; key="YamaConvert-Setup-$version.exe"; contentType='application/vnd.microsoft.portable-executable'; hash=$expectedSetup },
            @{ source=$env:PORTABLE_PATH; key="YamaConvert-Portable-$version.zip"; contentType='application/zip'; hash=$expectedPortable }
          )
          foreach ($asset in $versioned) {
            $temp = Join-Path $env:RUNNER_TEMP $asset.key
            $status = (& curl.exe --silent --show-error --max-time 30 --output $temp --write-out '%{http_code}' "$base/$($asset.key)?preflight=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
            if ($LASTEXITCODE -ne 0) { throw "Nepodařilo se ověřit $($asset.key)." }
            if ($status -eq '200') {
              if ((Get-FileHash -LiteralPath $temp -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.hash) { throw "Odmítám přepsat neměnný soubor $($asset.key)." }
            } elseif ($status -eq '404') {
              $source = (Resolve-Path -LiteralPath $asset.source).Path
              npx --yes wrangler@latest r2 object put "yamachat-releases/yamaconvert/$($asset.key)" --file $source --content-type $asset.contentType --content-disposition "attachment; filename=$($asset.key)" --cache-control 'public, max-age=31536000, immutable' --remote
              if ($LASTEXITCODE -ne 0) { throw "Nahrání $($asset.key) selhalo." }
            } else { throw "Nelze ověřit původní soubor $($asset.key) (HTTP $status)." }
            $verified = Join-Path $env:RUNNER_TEMP "verified-$($asset.key)"
            for ($attempt=1; $attempt -le 20; $attempt++) {
              & curl.exe --fail --silent --show-error --max-time 45 "$base/$($asset.key)?verify=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$attempt" --output $verified
              if ($LASTEXITCODE -eq 0 -and (Get-FileHash -LiteralPath $verified -Algorithm SHA256).Hash.ToLowerInvariant() -eq $asset.hash) { break }
              if ($attempt -eq 20) { throw "Kontrola souboru $($asset.key) selhala." }
              Start-Sleep -Seconds 10
            }
          }
          $latest = @(
            @{ source=$env:SETUP_PATH; key='YamaConvert-Setup-latest.exe'; contentType='application/vnd.microsoft.portable-executable' },
            @{ source=$env:PORTABLE_PATH; key='YamaConvert-Portable-latest.zip'; contentType='application/zip' }
          )
          foreach ($asset in $latest) {
            $source = (Resolve-Path -LiteralPath $asset.source).Path
            npx --yes wrangler@latest r2 object put "yamachat-releases/yamaconvert/$($asset.key)" --file $source --content-type $asset.contentType --content-disposition "attachment; filename=$($asset.key)" --cache-control 'no-cache, no-store' --remote
            if ($LASTEXITCODE -ne 0) { throw "Aktualizace odkazu $($asset.key) selhala." }
            $verified = Join-Path $env:RUNNER_TEMP "latest-$($asset.key)"
            & curl.exe --fail --silent --show-error --max-time 45 "$base/$($asset.key)?verify=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --output $verified
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $verified -Algorithm SHA256).Hash.ToLowerInvariant() -ne (Get-FileHash -LiteralPath $asset.source -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "Odkaz $($asset.key) nevrací správný soubor." }
          }

      - name: Add the verified Windows release to Yamaportal history
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [regex]::Match($env:RELEASE_TAG, '^yamaconvert-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$').Groups[1].Value
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body | ConvertFrom-Json
          $notes = [string]$release.body
          if (-not $version -or -not $notes.Trim()) { throw 'Chybí ověřená verze nebo poznámky vydání.' }
          $entry = @{ id="yamaconvert:windows:$version"; app='yamaconvert'; kind='update'; version=$version; title="YamaConvert Windows $version"; summary=($notes -split "`n")[0].Trim(); details=$notes.Trim(); releasedAt=[DateTime]::UtcNow.ToString('o'); platforms=@('Windows instalátor (.exe)','Windows portable (.zip)') } | ConvertTo-Json -Compress
          $entryPath = Join-Path $env:RUNNER_TEMP 'portal-release-entry.json'
          Set-Content -LiteralPath $entryPath -Value $entry -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B publish-main origin/main
          node scripts/record-portal-release.cjs $entryPath
          git add release-feed.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Record YamaConvert Windows $version release [skip ci]" }
          git push origin HEAD:main
          $previous = gh run list --workflow yamaportal-pages-production.yml --repo $env:GITHUB_REPOSITORY --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty'
          $releaseId = "yamaconvert:windows:$version"
          gh workflow run yamaportal-pages-production.yml --repo $env:GITHUB_REPOSITORY --ref main -f "release_id=$releaseId"
          if ($LASTEXITCODE -ne 0) { throw 'Spuštění vydání Yamaportalu selhalo.' }
          $runId = ''
          for ($attempt=1; $attempt -le 30; $attempt++) {
            $runId = gh run list --workflow yamaportal-pages-production.yml --repo $env:GITHUB_REPOSITORY --event workflow_dispatch --branch main --limit 5 --json databaseId --jq '.[0].databaseId // empty'
            if ($runId -and $runId -ne $previous) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $runId -or $runId -eq $previous) { throw 'Nepodařilo se najít běh nasazení Yamaportalu.' }
          gh run watch $runId --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) { throw 'Nasazení nebo kontrola Yamaportalu selhala.' }

