name: Publish Yamachat Windows 1.0.82 Once

on:
  push:
    branches:
      - feature/desktop-active-server-context-1.0.82
    paths:
      - ".github/workflows/publish-windows-1.0.82-once.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-active-server-context-1.0.82

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $p = Get-Content desktop/package.json | ConvertFrom-Json
          if ($p.version -ne "1.0.82") { throw "Expected desktop 1.0.82" }

          $client = Get-Content desktop/desktop-client.html -Raw
          foreach ($marker in @(
            'id="ycPasswordRequestBack"',
            "Platform Admin · uživatelské účty",
            "Zabanovat účet",
            "Zprávy od Yamachatu",
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext"
          )) {
            if (-not $client.Contains($marker)) { throw "Missing desktop client marker: $marker" }
          }

          $runtime = Get-Content desktop/main.js -Raw
          foreach ($marker in @(
            "function createTray()",
            "new Tray(trayIconForCurrentState())",
            "createTray();",
            "if (behavior === 'tray')",
            "'build',",
            "'icon.ico'"
          )) {
            if (-not $runtime.Contains($marker)) { throw "Missing tray/runtime marker: $marker" }
          }

          if (-not (Test-Path build/installer.nsh)) { throw "Missing NSIS rollback hook" }
          ./scripts/restore-desktop-brand-assets.ps1 -Destination build

          foreach ($name in @(
            "icon.ico",
            "app-icon-source.png",
            "tray-controller-idle.png",
            "tray-controller-speaking.png",
            "tray-status-online.png",
            "tray-status-online-notify.png",
            "yamachat-logo-ui.webp"
          )) {
            if (-not (Test-Path (Join-Path build $name))) { throw "Missing Windows brand asset $name" }
          }
          Write-Host "PASS Windows 1.0.82 source, tray runtime and active-server client."
      
      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Setup
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify packaged runtime and assets
        shell: pwsh
        run: |
          $appRoot = "desktop/dist/win-unpacked/resources/app"
          $client = Get-Content "$appRoot/desktop-client.html" -Raw
          foreach ($marker in @(
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext",
            'id="ycPasswordRequestBack"'
          )) {
            if (-not $client.Contains($marker)) { throw "Packaged client missing $marker" }
          }

          $appBuild = Join-Path $appRoot "build"
          foreach ($name in @(
            "icon.ico",
            "app-icon-source.png",
            "tray-controller-idle.png",
            "tray-controller-speaking.png",
            "tray-status-online.png",
            "tray-status-online-notify.png",
            "yamachat-logo-ui.webp"
          )) {
            $asset = Join-Path $appBuild $name
            if (-not (Test-Path $asset)) { throw "Packaged app is missing $name" }
            Write-Host "PACKAGED $name $((Get-FileHash $asset -Algorithm SHA256).Hash)"
          }

          $exe = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.82.exe
          $block = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.82.exe.blockmap
          $latest = Get-Content desktop/dist/latest.yml -Raw
          if ($latest -notmatch "version:\s*1\.0\.82") { throw "latest.yml is not 1.0.82" }
          Write-Host "SETUP_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "SETUP_SIZE=$($exe.Length)"
          Write-Host "BLOCKMAP_SIZE=$($block.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-1.0.82
          path: |
            desktop/dist/Yamachat-Setup-1.0.82.exe
            desktop/dist/Yamachat-Setup-1.0.82.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yamachat-windows-1.0.82
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Yamachat 1.0.82

          - Aktivní server je nově jasně, ale jemně zvýrazněný v barvách Yamachatu.
          - Karta aktivního serveru dostává cyan/fialový ring a slabý glow.
          - Desktop/tablet má tenký gradientový obrys serverové pracovní oblasti.
          - Domů, Přátelé, DM a další neserverové pohledy serverový highlight nezobrazují.
          - Při přepnutí serveru se zvýraznění automaticky přesune.
          - Zachované tray chování, Windows ikony, voice, obnova hesla a Platform Admin funkce z 1.0.81.
          EOF

          if gh release view v1.0.82 --repo yamboleeroy-ai/yamachat >/dev/null 2>&1; then
            gh release upload v1.0.82 release-assets/* --repo yamboleeroy-ai/yamachat --clobber
            gh release edit v1.0.82 --repo yamboleeroy-ai/yamachat --title "Yamachat 1.0.82" --notes-file release-notes.md --latest
          else
            gh release create v1.0.82 release-assets/* --repo yamboleeroy-ai/yamachat --title "Yamachat 1.0.82" --notes-file release-notes.md --latest
          fi
