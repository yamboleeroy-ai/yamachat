name: Publish YamaHelp 1.0.83

on:
  push:
    branches:
      - preview/yamahelp-full-header-logo
    paths:
      - '.github/workflows/yamahelp-release-1.0.83.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yamahelp-release
  cancel-in-progress: false

env:
  VERSION: 1.0.83
  SHORT_VERSION: v83
  NOTES: 'Opravené zobrazení celého loga YamaHelp v hlavičce a samostatná čtvercová ikona YamaHelp pro Windows, hlavní panel, nabídku Start a zástupce.'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Guard current public version
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $live=Invoke-RestMethod -Uri 'https://updates.yamachat.eu/yamahelp/latest.json' -TimeoutSec 30
          Write-Host ('Current public YamaHelp=' + $live.version)
          if([string]$live.version -ne '1.0.82'){ throw "Refusing to publish 1.0.83 because current public version is $($live.version), expected 1.0.82." }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct tested source and branding
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $partsRoot=Join-Path $env:GITHUB_WORKSPACE 'preview\yamahelp-parts'
          $srcRoot=Join-Path $env:GITHUB_WORKSPACE 'preview\yamahelp-release-src'
          $desktop=Join-Path $srcRoot 'desktop'

          $srcParts=Get-ChildItem $partsRoot -Filter 'src.*.part' -File | Sort-Object Name
          if($srcParts.Count -ne 11){ throw "Expected 11 source parts, got $($srcParts.Count)." }
          $srcB64=($srcParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive=Join-Path $env:GITHUB_WORKSPACE 'preview\yamahelp-source.tar.gz'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($srcB64))
          New-Item -ItemType Directory -Path $srcRoot -Force | Out-Null
          tar -xzf $archive -C $srcRoot
          if(-not (Test-Path (Join-Path $desktop 'MainWindow.xaml'))){ throw 'Source extraction failed.' }

          $logoParts=Get-ChildItem $partsRoot -Filter 'header-logo.*.part' -File | Sort-Object Name
          $logoB64=($logoParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $desktop 'yamahelp-logo.png'),[Convert]::FromBase64String($logoB64))

          $iconParts=Get-ChildItem $partsRoot -Filter 'square-icon.*.part' -File | Sort-Object Name
          $iconB64=($iconParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $desktop 'yamahelp-icon.png'),[Convert]::FromBase64String($iconB64))

          @'
          import struct
          from pathlib import Path
          root=Path(r"preview/yamahelp-release-src/desktop")
          png=(root/"yamahelp-icon.png").read_bytes()
          header=struct.pack("<HHH",0,1,1)
          entry=struct.pack("<BBBBHHII",192,192,0,0,1,32,len(png),22)
          (root/"yamahelp-icon.ico").write_bytes(header+entry+png)
          '@ | python -

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <ApplicationIcon>yamahelp-icon.ico</ApplicationIcon>
              <Version>$env:VERSION</Version>
              <AssemblyVersion>$env:VERSION.0</AssemblyVersion>
              <FileVersion>$env:VERSION.0</FileVersion>
              <InformationalVersion>$env:VERSION</InformationalVersion>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="LibreHardwareMonitorLib" Version="0.9.6" />
              <PackageReference Include="System.Management" Version="10.0.12" />
            </ItemGroup>
            <ItemGroup>
              <Content Include="yamahelp-logo.png">
                <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>
              </Content>
              <Content Include="yamahelp-icon.png">
                <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>
              </Content>
            </ItemGroup>
          </Project>
          "@ | Set-Content -Path (Join-Path $desktop 'YamaHelp.Desktop.csproj') -Encoding UTF8

          $match=Select-String -Path (Join-Path $desktop 'MainWindow.xaml') -Pattern 'yamahelp-logo.png'
          if(-not $match){ throw 'The tested full header logo binding is missing.' }
          Write-Host $match.Line

      - name: Build self-contained Windows x64 release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish preview/yamahelp-release-src/desktop/YamaHelp.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o preview/yamahelp-release-out
          $exe=Get-Item preview/yamahelp-release-out/YamaHelp.Desktop.exe
          Write-Host ('Built EXE bytes=' + $exe.Length)
          if($exe.VersionInfo.ProductVersion -notlike "$env:VERSION*"){ throw "Built executable version mismatch: $($exe.VersionInfo.ProductVersion)" }

      - name: Preserve required runtime extras from current public portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-latest.zip' -OutFile current-portable.zip -TimeoutSec 180
          Expand-Archive -Path current-portable.zip -DestinationPath current-portable -Force
          foreach($name in @('CoreTemp.exe','CoreTemp.ini','CoreTemp-License.txt','yamachat-logo.png')){
            $file=Get-ChildItem current-portable -Recurse -File -Filter $name | Select-Object -First 1
            if($file){
              Copy-Item $file.FullName (Join-Path 'preview/yamahelp-release-out' $name) -Force
              Write-Host "Copied $name"
            } elseif($name -like 'CoreTemp*') {
              throw "Required runtime extra missing from current public portable: $name"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Detect current installer identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-latest.exe' -OutFile current-setup.exe -TimeoutSec 180
          $proc=Start-Process -FilePath (Resolve-Path '.\current-setup.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if($proc.ExitCode -ne 0){ throw "Current YamaHelp setup exited with $($proc.ExitCode)" }
          Start-Sleep -Seconds 2

          $entry=$null
          $entryKey=$null
          $roots=@(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          foreach($root in $roots){
            if(Test-Path $root){
              foreach($k in Get-ChildItem $root){
                $p=Get-ItemProperty $k.PSPath
                if(([string]$p.DisplayName) -eq 'YamaHelp'){
                  $entry=$p
                  $entryKey=$k.PSChildName
                  break
                }
              }
            }
            if($entry){ break }
          }
          $local=[IO.Path]::GetFullPath($env:LOCALAPPDATA).TrimEnd('\')
          if(-not $entry){
            $candidate=Get-ChildItem $env:LOCALAPPDATA -Recurse -File -Filter 'YamaHelp.Desktop.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\Programs\YamaHelp\YamaHelp.Desktop.exe' } |
              Select-Object -First 1
            if(-not $candidate){
              Get-ChildItem $env:LOCALAPPDATA -Recurse -File -Filter 'YamaHelp.Desktop.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 10 | ForEach-Object { Write-Host ('Found candidate: ' + $_.FullName) }
              throw 'Could not determine the current YamaHelp installation path after installing public 1.0.82.'
            }
            $inst=[IO.Path]::GetFullPath((Split-Path $candidate.FullName -Parent)).TrimEnd('\')
            $appId='YamaHelp'
            $publisher='Lukáš Hubáček'
            Write-Host 'No uninstall registry entry was created by public 1.0.82; using verified install-path fallback.'
          } else {
            $installLocation=[string]$entry.InstallLocation
            if([string]::IsNullOrWhiteSpace($installLocation)){
              $uninstall=[string]$entry.UninstallString
              if($uninstall -match '^"(.+?)\\unins\d+\.exe"'){ $installLocation=Split-Path $matches[1] -Parent }
            }
            if([string]::IsNullOrWhiteSpace($installLocation)){ throw 'Current YamaHelp install location could not be determined.' }
            $inst=[IO.Path]::GetFullPath($installLocation).TrimEnd('\')
            $appId=$entryKey -replace '_is\d+
          Write-Host "Current AppId=$appId"
          Write-Host "Current InstallLocation=$inst"
          Write-Host "Mapped DefaultDirName=$defaultDir"
          Write-Host "Current Publisher=$publisher"
          "APP_ID=$appId" >> $env:GITHUB_ENV
          "CURRENT_INSTALL_LOCATION=$inst" >> $env:GITHUB_ENV
          "DEFAULT_DIR=$defaultDir" >> $env:GITHUB_ENV
          "PUBLISHER=$publisher" >> $env:GITHUB_ENV

      - name: Build installer and portable release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $out=Join-Path $env:GITHUB_WORKSPACE 'preview\yamahelp-release-out'
          $src=Join-Path $env:GITHUB_WORKSPACE 'preview\yamahelp-release-src\desktop'

          $iss=Join-Path $env:GITHUB_WORKSPACE 'preview\YamaHelp-1.0.83.iss'
          @"
          [Setup]
          AppId=$env:APP_ID
          AppName=YamaHelp
          AppVersion=$env:VERSION
          AppVerName=YamaHelp $env:VERSION
          AppPublisher=$env:PUBLISHER
          DefaultDirName=$env:DEFAULT_DIR
          DefaultGroupName=YamaHelp
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=$release
          OutputBaseFilename=YamaHelp-Setup-$env:SHORT_VERSION
          SetupIconFile=$src\yamahelp-icon.ico
          UninstallDisplayIcon={app}\YamaHelp.Desktop.exe
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no
          VersionInfoVersion=$env:VERSION.0
          VersionInfoProductVersion=$env:VERSION
          VersionInfoProductName=YamaHelp
          VersionInfoDescription=YamaHelp Setup
          VersionInfoCompany=$env:PUBLISHER

          [Files]
          Source: "$out\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\YamaHelp"; Filename: "{app}\YamaHelp.Desktop.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\YamaHelp"; Filename: "{app}\YamaHelp.Desktop.exe"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\YamaHelp.Desktop.exe"; Description: "Spustit YamaHelp"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path $iss -Encoding UTF8

          $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if(-not (Test-Path $iscc)){ throw 'ISCC.exe not found.' }
          & $iscc $iss
          if($LASTEXITCODE -ne 0){ throw "Inno Setup failed with $LASTEXITCODE" }

          $portable=Join-Path $release "YamaHelp-Portable-$env:SHORT_VERSION.zip"
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $portable -CompressionLevel Optimal -Force

          $manifest=[ordered]@{
            version=$env:VERSION
            notes=$env:NOTES
            portableUrl="https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-$env:SHORT_VERSION.zip"
            installerUrl="https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-$env:SHORT_VERSION.exe"
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $release 'latest.json') -Encoding UTF8

          $files=@("YamaHelp-Portable-$env:SHORT_VERSION.zip","YamaHelp-Setup-$env:SHORT_VERSION.exe")
          $sumLines=@()
          foreach($name in $files){
            $p=Join-Path $release $name
            if(-not (Test-Path $p)){ throw "Missing release artifact: $name" }
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            $sumLines += "$h  $name"
            Write-Host "$name bytes=$((Get-Item $p).Length) sha256=$h"
          }
          $sumLines | Set-Content (Join-Path $release 'SHA256SUMS.txt') -Encoding ASCII

          if((Get-Item $portable).Length -lt 20000000){ throw 'Portable release is unexpectedly small; self-contained packaging likely failed.' }
          if((Get-Item (Join-Path $release "YamaHelp-Setup-$env:SHORT_VERSION.exe")).Length -lt 15000000){ throw 'Installer is unexpectedly small.' }

      - name: Verify upgrade from public 1.0.82 to 1.0.83
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Resolve-Path "release-assets\YamaHelp-Setup-$env:SHORT_VERSION.exe"
          $proc=Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if($proc.ExitCode -ne 0){ throw "New YamaHelp setup exited with $($proc.ExitCode)" }
          Start-Sleep -Seconds 2

          $exe=Join-Path $env:CURRENT_INSTALL_LOCATION 'YamaHelp.Desktop.exe'
          if(-not (Test-Path $exe)){ throw "Upgraded executable missing at original install path: $exe" }
          $v=(Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Upgraded installed ProductVersion=$v"
          if($v -notlike "$env:VERSION*"){ throw "Upgrade did not replace the existing app with $env:VERSION." }

          $shortcutStart=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\YamaHelp.lnk'
          $shortcutDesktop=Join-Path $env:USERPROFILE 'Desktop\YamaHelp.lnk'
          if(-not (Test-Path $shortcutStart)){ throw 'Start Menu shortcut missing after upgrade.' }
          if(-not (Test-Path $shortcutDesktop)){ throw 'Desktop shortcut missing after upgrade.' }

          $manifest=Get-Content release-assets/latest.json -Raw | ConvertFrom-Json
          if($manifest.version -ne $env:VERSION){ throw 'Release manifest version mismatch.' }
          if($manifest.portableUrl -notmatch '/YamaHelp-Portable-v83\.zip$'){ throw 'Portable manifest URL mismatch.' }
          if($manifest.installerUrl -notmatch '/YamaHelp-Setup-v83\.exe$'){ throw 'Installer manifest URL mismatch.' }

      - uses: actions/upload-artifact@v4
        with:
          name: yamahelp-windows-1.0.83
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: yamahelp-windows-1.0.83
          path: release-assets

      - name: Verify Cloudflare R2 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@latest r2 bucket list | grep -q 'yamachat-releases'

      - name: Publish YamaHelp 1.0.83 to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          W='npx --yes wrangler@latest'
          BUCKET='yamachat-releases/yamahelp'
          $W r2 object put "$BUCKET/YamaHelp-Portable-v83.zip" --file release-assets/YamaHelp-Portable-v83.zip --content-type application/zip --content-disposition 'attachment; filename=YamaHelp-Portable-v83.zip' --cache-control 'public, max-age=31536000, immutable' --remote
          $W r2 object put "$BUCKET/YamaHelp-Setup-v83.exe" --file release-assets/YamaHelp-Setup-v83.exe --content-type application/vnd.microsoft.portable-executable --content-disposition 'attachment; filename=YamaHelp-Setup-v83.exe' --cache-control 'public, max-age=31536000, immutable' --remote
          $W r2 object put "$BUCKET/YamaHelp-Portable-latest.zip" --file release-assets/YamaHelp-Portable-v83.zip --content-type application/zip --content-disposition 'attachment; filename=YamaHelp-Portable-latest.zip' --cache-control 'no-cache, no-store, must-revalidate' --remote
          $W r2 object put "$BUCKET/YamaHelp-Setup-latest.exe" --file release-assets/YamaHelp-Setup-v83.exe --content-type application/vnd.microsoft.portable-executable --content-disposition 'attachment; filename=YamaHelp-Setup-latest.exe' --cache-control 'no-cache, no-store, must-revalidate' --remote
          $W r2 object put "$BUCKET/SHA256SUMS.txt" --file release-assets/SHA256SUMS.txt --content-type text/plain --cache-control 'no-cache, no-store' --remote
          $W r2 object put "$BUCKET/latest.json" --file release-assets/latest.json --content-type application/json --cache-control 'no-cache, no-store, must-revalidate' --remote

      - name: Try to purge Cloudflare cache for stable YamaHelp URLs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=yamachat.eu' | jq -r '.result[0].id // empty')"
          test -n "$zone_id"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data '{"files":["https://updates.yamachat.eu/yamahelp/latest.json","https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-latest.zip","https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-latest.exe"]}'             | jq -e '.success == true'

      - name: Verify public update feed and latest aliases
        run: |
          set -euo pipefail
          expected_portable="$(grep 'YamaHelp-Portable-v83.zip' release-assets/SHA256SUMS.txt | awk '{print $1}')"
          expected_setup="$(grep 'YamaHelp-Setup-v83.exe' release-assets/SHA256SUMS.txt | awk '{print $1}')"

          ok=0
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://updates.yamachat.eu/yamahelp/latest.json?verify=$i" || true)"
            if echo "$body" | jq -e '.version=="1.0.83" and .portableUrl=="https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-v83.zip" and .installerUrl=="https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-v83.exe"' >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1 || { echo 'Public YamaHelp update feed did not become 1.0.83'; exit 1; }

          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-v83.zip' -o /tmp/versioned-portable.zip
          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-v83.exe' -o /tmp/versioned-setup.exe
          test "$(sha256sum /tmp/versioned-portable.zip | awk '{print $1}')" = "$expected_portable"
          test "$(sha256sum /tmp/versioned-setup.exe | awk '{print $1}')" = "$expected_setup"

          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-latest.zip?release=83' -o /tmp/latest-portable.zip
          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-latest.exe?release=83' -o /tmp/latest-setup.exe
          test "$(sha256sum /tmp/latest-portable.zip | awk '{print $1}')" = "$expected_portable"
          test "$(sha256sum /tmp/latest-setup.exe | awk '{print $1}')" = "$expected_setup"

          echo 'YamaHelp 1.0.83 is public: manifest, versioned files and latest aliases all verified.'
,''
            if([string]::IsNullOrWhiteSpace($appId)){ $appId='YamaHelp' }
            $publisher=[string]$entry.Publisher
            if([string]::IsNullOrWhiteSpace($publisher)){ $publisher='Lukáš Hubáček' }
          }

          if($inst.StartsWith($local,[StringComparison]::OrdinalIgnoreCase)){
            $rel=$inst.Substring($local.Length).TrimStart('\')
            $defaultDir='{localappdata}\' + $rel
          } else {
            throw "Current YamaHelp install location is outside LocalAppData: $inst"
          }

          Write-Host "Current AppId=$appId"
          Write-Host "Current InstallLocation=$inst"
          Write-Host "Mapped DefaultDirName=$defaultDir"
          Write-Host "Current Publisher=$publisher"
          "APP_ID=$appId" >> $env:GITHUB_ENV
          "CURRENT_INSTALL_LOCATION=$inst" >> $env:GITHUB_ENV
          "DEFAULT_DIR=$defaultDir" >> $env:GITHUB_ENV
          "PUBLISHER=$publisher" >> $env:GITHUB_ENV

      - name: Build installer and portable release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $out=Join-Path $env:GITHUB_WORKSPACE 'preview\yamahelp-release-out'
          $src=Join-Path $env:GITHUB_WORKSPACE 'preview\yamahelp-release-src\desktop'

          $iss=Join-Path $env:GITHUB_WORKSPACE 'preview\YamaHelp-1.0.83.iss'
          @"
          [Setup]
          AppId=$env:APP_ID
          AppName=YamaHelp
          AppVersion=$env:VERSION
          AppVerName=YamaHelp $env:VERSION
          AppPublisher=$env:PUBLISHER
          DefaultDirName=$env:DEFAULT_DIR
          DefaultGroupName=YamaHelp
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=$release
          OutputBaseFilename=YamaHelp-Setup-$env:SHORT_VERSION
          SetupIconFile=$src\yamahelp-icon.ico
          UninstallDisplayIcon={app}\YamaHelp.Desktop.exe
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no
          VersionInfoVersion=$env:VERSION.0
          VersionInfoProductVersion=$env:VERSION
          VersionInfoProductName=YamaHelp
          VersionInfoDescription=YamaHelp Setup
          VersionInfoCompany=$env:PUBLISHER

          [Files]
          Source: "$out\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\YamaHelp"; Filename: "{app}\YamaHelp.Desktop.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\YamaHelp"; Filename: "{app}\YamaHelp.Desktop.exe"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\YamaHelp.Desktop.exe"; Description: "Spustit YamaHelp"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path $iss -Encoding UTF8

          $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if(-not (Test-Path $iscc)){ throw 'ISCC.exe not found.' }
          & $iscc $iss
          if($LASTEXITCODE -ne 0){ throw "Inno Setup failed with $LASTEXITCODE" }

          $portable=Join-Path $release "YamaHelp-Portable-$env:SHORT_VERSION.zip"
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $portable -CompressionLevel Optimal -Force

          $manifest=[ordered]@{
            version=$env:VERSION
            notes=$env:NOTES
            portableUrl="https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-$env:SHORT_VERSION.zip"
            installerUrl="https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-$env:SHORT_VERSION.exe"
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $release 'latest.json') -Encoding UTF8

          $files=@("YamaHelp-Portable-$env:SHORT_VERSION.zip","YamaHelp-Setup-$env:SHORT_VERSION.exe")
          $sumLines=@()
          foreach($name in $files){
            $p=Join-Path $release $name
            if(-not (Test-Path $p)){ throw "Missing release artifact: $name" }
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            $sumLines += "$h  $name"
            Write-Host "$name bytes=$((Get-Item $p).Length) sha256=$h"
          }
          $sumLines | Set-Content (Join-Path $release 'SHA256SUMS.txt') -Encoding ASCII

          if((Get-Item $portable).Length -lt 20000000){ throw 'Portable release is unexpectedly small; self-contained packaging likely failed.' }
          if((Get-Item (Join-Path $release "YamaHelp-Setup-$env:SHORT_VERSION.exe")).Length -lt 15000000){ throw 'Installer is unexpectedly small.' }

      - name: Verify upgrade from public 1.0.82 to 1.0.83
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Resolve-Path "release-assets\YamaHelp-Setup-$env:SHORT_VERSION.exe"
          $proc=Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if($proc.ExitCode -ne 0){ throw "New YamaHelp setup exited with $($proc.ExitCode)" }
          Start-Sleep -Seconds 2

          $exe=Join-Path $env:CURRENT_INSTALL_LOCATION 'YamaHelp.Desktop.exe'
          if(-not (Test-Path $exe)){ throw "Upgraded executable missing at original install path: $exe" }
          $v=(Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Upgraded installed ProductVersion=$v"
          if($v -notlike "$env:VERSION*"){ throw "Upgrade did not replace the existing app with $env:VERSION." }

          $shortcutStart=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\YamaHelp.lnk'
          $shortcutDesktop=Join-Path $env:USERPROFILE 'Desktop\YamaHelp.lnk'
          if(-not (Test-Path $shortcutStart)){ throw 'Start Menu shortcut missing after upgrade.' }
          if(-not (Test-Path $shortcutDesktop)){ throw 'Desktop shortcut missing after upgrade.' }

          $manifest=Get-Content release-assets/latest.json -Raw | ConvertFrom-Json
          if($manifest.version -ne $env:VERSION){ throw 'Release manifest version mismatch.' }
          if($manifest.portableUrl -notmatch '/YamaHelp-Portable-v83\.zip$'){ throw 'Portable manifest URL mismatch.' }
          if($manifest.installerUrl -notmatch '/YamaHelp-Setup-v83\.exe$'){ throw 'Installer manifest URL mismatch.' }

      - uses: actions/upload-artifact@v4
        with:
          name: yamahelp-windows-1.0.83
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: yamahelp-windows-1.0.83
          path: release-assets

      - name: Verify Cloudflare R2 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@latest r2 bucket list | grep -q 'yamachat-releases'

      - name: Publish YamaHelp 1.0.83 to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          W='npx --yes wrangler@latest'
          BUCKET='yamachat-releases/yamahelp'
          $W r2 object put "$BUCKET/YamaHelp-Portable-v83.zip" --file release-assets/YamaHelp-Portable-v83.zip --content-type application/zip --content-disposition 'attachment; filename=YamaHelp-Portable-v83.zip' --cache-control 'public, max-age=31536000, immutable' --remote
          $W r2 object put "$BUCKET/YamaHelp-Setup-v83.exe" --file release-assets/YamaHelp-Setup-v83.exe --content-type application/vnd.microsoft.portable-executable --content-disposition 'attachment; filename=YamaHelp-Setup-v83.exe' --cache-control 'public, max-age=31536000, immutable' --remote
          $W r2 object put "$BUCKET/YamaHelp-Portable-latest.zip" --file release-assets/YamaHelp-Portable-v83.zip --content-type application/zip --content-disposition 'attachment; filename=YamaHelp-Portable-latest.zip' --cache-control 'no-cache, no-store, must-revalidate' --remote
          $W r2 object put "$BUCKET/YamaHelp-Setup-latest.exe" --file release-assets/YamaHelp-Setup-v83.exe --content-type application/vnd.microsoft.portable-executable --content-disposition 'attachment; filename=YamaHelp-Setup-latest.exe' --cache-control 'no-cache, no-store, must-revalidate' --remote
          $W r2 object put "$BUCKET/SHA256SUMS.txt" --file release-assets/SHA256SUMS.txt --content-type text/plain --cache-control 'no-cache, no-store' --remote
          $W r2 object put "$BUCKET/latest.json" --file release-assets/latest.json --content-type application/json --cache-control 'no-cache, no-store, must-revalidate' --remote

      - name: Try to purge Cloudflare cache for stable YamaHelp URLs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=yamachat.eu' | jq -r '.result[0].id // empty')"
          test -n "$zone_id"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data '{"files":["https://updates.yamachat.eu/yamahelp/latest.json","https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-latest.zip","https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-latest.exe"]}'             | jq -e '.success == true'

      - name: Verify public update feed and latest aliases
        run: |
          set -euo pipefail
          expected_portable="$(grep 'YamaHelp-Portable-v83.zip' release-assets/SHA256SUMS.txt | awk '{print $1}')"
          expected_setup="$(grep 'YamaHelp-Setup-v83.exe' release-assets/SHA256SUMS.txt | awk '{print $1}')"

          ok=0
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://updates.yamachat.eu/yamahelp/latest.json?verify=$i" || true)"
            if echo "$body" | jq -e '.version=="1.0.83" and .portableUrl=="https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-v83.zip" and .installerUrl=="https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-v83.exe"' >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1 || { echo 'Public YamaHelp update feed did not become 1.0.83'; exit 1; }

          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-v83.zip' -o /tmp/versioned-portable.zip
          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-v83.exe' -o /tmp/versioned-setup.exe
          test "$(sha256sum /tmp/versioned-portable.zip | awk '{print $1}')" = "$expected_portable"
          test "$(sha256sum /tmp/versioned-setup.exe | awk '{print $1}')" = "$expected_setup"

          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Portable-latest.zip?release=83' -o /tmp/latest-portable.zip
          curl -fsSL --max-time 180 -H 'Cache-Control: no-cache' 'https://updates.yamachat.eu/yamahelp/YamaHelp-Setup-latest.exe?release=83' -o /tmp/latest-setup.exe
          test "$(sha256sum /tmp/latest-portable.zip | awk '{print $1}')" = "$expected_portable"
          test "$(sha256sum /tmp/latest-setup.exe | awk '{print $1}')" = "$expected_setup"

          echo 'YamaHelp 1.0.83 is public: manifest, versioned files and latest aliases all verified.'
