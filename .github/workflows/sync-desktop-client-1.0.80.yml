name: Sync desktop 1.0.80 client

on:
  push:
    branches:
      - feature/desktop-user-admin-1.0.80
    paths:
      - ".github/workflows/sync-desktop-client-1.0.80.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-user-admin-1.0.80
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate tested desktop client
        run: node scripts/build-desktop-client.mjs
      - name: Copy client into complete Windows runtime
        run: |
          set -euo pipefail
          cp desktop-client-dist/desktop-client.html desktop/desktop-client.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/desktop-client.html
          if git diff --cached --quiet; then
            echo "Desktop client already matches generator."
            exit 0
          fi
          git commit -m "Sync generated desktop client for 1.0.80 [skip ci]"
          git push origin HEAD:feature/desktop-user-admin-1.0.80
