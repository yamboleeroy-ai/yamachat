name: Publish Yamachat Windows 1.0.93 Real Voices

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-windows-real-voices-1.0.93.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/windows-1.0.93-real-voices
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Regenerate verified Real Voices client
        run: node scripts/prepare-desktop-1.0.92.mjs

      - name: Verify uploaded portable baseline exactly
        shell: pwsh
        run: |
          $pkg=Get-Content desktop/package.json | ConvertFrom-Json
          if($pkg.version -ne "1.0.93"){throw "Expected Windows version 1.0.93"}

          $expected=@{
            "desktop/desktop-client.html"="382368b2846df72aa78d17d004b5784fe83a7397f598b3b83b1537fab6c1e5f0"
            "desktop/desktop.html"="5800c157cf689ffd6789a89134bd3509d69ad040f2f9171fa0bdd603d779881d"
            "desktop/main.js"="c6167fafb770ba2b92b37e132b22c1839d7f2ae1c06735721091fd878bc64159"
            "audio/yamachat_join_voice.mp3"="d0f4654da5668871290144e88cef5e879397a8ab05a6df0f4ecbd1c7a9cd151e"
            "audio/yamachat_leave_voice.mp3"="08fcd45a4141b3e28e24d0ce6051b7123c0f0d124ae297291b0077a3788ebaa1"
          }
          foreach($file in $expected.Keys){
            if(-not (Test-Path $file)){throw "Missing verified file: $file"}
            $actual=(Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if($actual -ne $expected[$file]){throw "$file differs from uploaded Real Voices portable"}
          }

          $client=Get-Content desktop/desktop-client.html -Raw
          foreach($marker in @(
            "ycVoiceSelectedVoice",
            "u.voice=selected",
            "u.rate=1;u.pitch=1",
            "YC_VOICE_JOIN_CUE_SRC",
            "YC_VOICE_LEAVE_CUE_SRC",
            "ycVoiceDiffAnnouncements",
            "ycVoiceThemePolishStyle",
            "html body .composer"
          )){if(-not $client.Contains($marker)){throw "Missing verified marker: $marker"}}
          foreach($forbidden in @("ycSurfaceThemeStyle","yc_surface_theme_v1","male-deep","female-bright")){
            if($client.Contains($forbidden)){throw "Rejected experiment/fake profile present: $forbidden"}
          }
          $runtime=Get-Content desktop/main.js -Raw
          if(-not $runtime.Contains("disable-direct-composition")){throw "GPU compositor workaround missing"}

      - name: Prepare runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Setup update
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify packaged update
        shell: pwsh
        run: |
          $appRoot="desktop/dist/win-unpacked/resources/app"
          $expected=@{
            "$appRoot/desktop-client.html"="382368b2846df72aa78d17d004b5784fe83a7397f598b3b83b1537fab6c1e5f0"
            "$appRoot/desktop.html"="5800c157cf689ffd6789a89134bd3509d69ad040f2f9171fa0bdd603d779881d"
            "$appRoot/main.js"="c6167fafb770ba2b92b37e132b22c1839d7f2ae1c06735721091fd878bc64159"
            "$appRoot/audio/yamachat_join_voice.mp3"="d0f4654da5668871290144e88cef5e879397a8ab05a6df0f4ecbd1c7a9cd151e"
            "$appRoot/audio/yamachat_leave_voice.mp3"="08fcd45a4141b3e28e24d0ce6051b7123c0f0d124ae297291b0077a3788ebaa1"
          }
          foreach($file in $expected.Keys){
            if(-not (Test-Path $file)){throw "Missing packaged verified file: $file"}
            if((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $expected[$file]){throw "Packaged file changed: $file"}
          }
          foreach($file in @(
            "desktop/dist/Yamachat-Setup-1.0.93.exe",
            "desktop/dist/Yamachat-Setup-1.0.93.exe.blockmap",
            "desktop/dist/latest.yml"
          )){if(-not (Test-Path $file)){throw "Missing update asset: $file"}}
          $latest=Get-Content desktop/dist/latest.yml -Raw
          if($latest -notmatch "version:\s*1\.0\.93"){throw "latest.yml is not 1.0.93"}

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-1.0.93-real-voices-release
          path: |
            desktop/dist/Yamachat-Setup-1.0.93.exe
            desktop/dist/Yamachat-Setup-1.0.93.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yamachat-windows-1.0.93-real-voices-release
          path: release-assets

      - name: Publish v1.0.93
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Yamachat 1.0.93

          - používá přesně ověřenou Real Voices + Composer testovací verzi
          - skutečné systémové TTS hlasy přes voiceURI, bez falešných pitch/rate profilů
          - přesné JOIN/LEAVE zvuky
          - opravené jednorázové join/leave oznámení se jménem
          - osobní barva Yamachatu na composeru a voice prvkách
          - sjednocený vzhled server settings a zavírání user settings kliknutím mimo
          - GPU compositor workaround z ověřeného portable buildu
          EOF
          if gh release view v1.0.93 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.93 release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.0.93 --repo "$GITHUB_REPOSITORY" --title "Yamachat 1.0.93" --notes-file release-notes.md --latest
          else
            gh release create v1.0.93 release-assets/* --repo "$GITHUB_REPOSITORY" --target release/windows-1.0.93-real-voices --title "Yamachat 1.0.93" --notes-file release-notes.md --latest
          fi
