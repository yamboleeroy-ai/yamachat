name: Publish Yamaportal Windows
on:
  workflow_dispatch:
  pull_request:
    paths: ['products/yamaportal/**', '.github/workflows/yamaportal-release.yml']
  push:
    branches: [main]
    paths: ['products/yamaportal/package.json']
permissions:
  contents: write
concurrency:
  group: yamaportal-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
        working-directory: products/yamaportal
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify real offline navigation without account or network
        run: node products/yamaportal/tests/offline-browser.cjs
  build:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/yamaportal/package-lock.json
      - run: npm ci
        working-directory: products/yamaportal
      - run: npx electron-builder --config electron-builder.json --win --publish never
        working-directory: products/yamaportal
      - uses: actions/upload-artifact@v4
        with:
          name: yamaportal-windows
          path: products/yamaportal/artifacts/*.exe
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: yamaportal-windows
          path: release-assets
      - name: Publish separate Yamaportal prefix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          W='npx --yes wrangler@latest'
          $W r2 bucket list | grep -q yamachat-releases
          cd release-assets
          sha256sum *.exe > SHA256SUMS.txt
          for kind in Setup Portable; do
            file="Yamaportal-$kind-0.2.0-x64.exe"
            test -s "$file"
            $W r2 object put "yamachat-releases/yamaportal/$file" --file "$file" --content-type application/vnd.microsoft.portable-executable --cache-control 'public,max-age=31536000,immutable' --remote
            $W r2 object put "yamachat-releases/yamaportal/Yamaportal-$kind-latest.exe" --file "$file" --content-type application/vnd.microsoft.portable-executable --cache-control no-cache --remote
          done
          $W r2 object put yamachat-releases/yamaportal/SHA256SUMS.txt --file SHA256SUMS.txt --content-type text/plain --cache-control no-cache --remote
          curl -fsSI --retry 5 --retry-delay 10 https://updates.yamachat.eu/yamaportal/Yamaportal-Setup-latest.exe
          curl -fsSI --retry 5 --retry-delay 10 https://updates.yamachat.eu/yamaportal/Yamaportal-Portable-latest.exe
          printf '%s\n' '{"product":"Yamaportal","version":"0.2.0","installerUrl":"https://updates.yamachat.eu/yamaportal/Yamaportal-Setup-latest.exe","portableUrl":"https://updates.yamachat.eu/yamaportal/Yamaportal-Portable-latest.exe"}' > latest.json
          $W r2 object put yamachat-releases/yamaportal/latest.json --file latest.json --content-type application/json --cache-control 'no-cache,no-store' --remote
      - name: Record this published Yamaportal release on the Portal
        run: |
          set -euo pipefail
          export VERSION="$(node -p "require('./products/yamaportal/package.json').version")"
          node - <<'NODE'
          const fs=require('fs');
          const path=`products/yamaportal/release-notes/v${process.env.VERSION}.json`;
          const notes=JSON.parse(fs.readFileSync(path,'utf8'));
          const entry={...notes,id:`yamaportal:v${process.env.VERSION}`,app:'yamaportal',version:process.env.VERSION,releasedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/portal-release-entry.json',JSON.stringify(entry));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B publish-main origin/main
          node scripts/record-portal-release.cjs /tmp/portal-release-entry.json
          git add release-feed.json
          git diff --cached --quiet || git commit -m "Record Yamaportal $VERSION release [skip ci]"
          git push origin HEAD:main
