name: Yamachat Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "index.html"
      - "icons/**"
      - "audio/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Prepare bundled Yamachat web
        working-directory: mobile
        run: npm run prepare:web

      - name: Create Android project when missing
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync and patch Android
        working-directory: mobile
        run: |
          npx cap sync android
          node scripts/patch-native.mjs android

      - name: Build installable APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Yamachat-Android.apk

      - name: Upload Yamachat APK
        uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Android
          path: Yamachat-Android.apk
          if-no-files-found: error
          retention-days: 30
