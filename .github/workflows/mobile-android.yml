name: Yamachat Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "mobile/**"
      - "index.html"
      - "icons/**"
      - "audio/**"
      - "web/**"
      - "scripts/**"
      - "reference/**"
      - "vendor/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare bundled Yamachat web
        working-directory: mobile
        run: npm run prepare:web

      - name: Verify unchanged desktop reference and bundled scripts
        run: node scripts/check.mjs

      - name: Create Android project when missing
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync and patch Android
        working-directory: mobile
        run: |
          npx cap sync android
          node scripts/patch-native.mjs android

      - name: Build with permanent Android identity
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Configure the permanent Android keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the permanent Android keystore password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/yamachat-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          export ANDROID_VERSION_CODE="$((200000 + GITHUB_RUN_NUMBER))"
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../Yamachat-Android.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../../Yamachat-Android.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 ../../Yamachat-Android.apk
          python ../../scripts/verify-android-apk.py \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner" \
            --apk ../../Yamachat-Android.apk --previous ../../download/Yamachat-Android.apk \
            --expected-code "$ANDROID_VERSION_CODE" --report ../../android-artifact.json

      - name: Publish APK for yamachat.eu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp Yamachat-Android.apk /tmp/Yamachat-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-apk origin/main
            mkdir -p download
            cp /tmp/Yamachat-Android.apk download/Yamachat-Android.apk
            git add -f download/Yamachat-Android.apk
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish latest Yamachat Android APK [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "APK publish raced with another main update; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1

      - name: Upload Yamachat APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Android
          path: |
            Yamachat-Android.apk
            android-artifact.json
          if-no-files-found: error
          retention-days: 30
