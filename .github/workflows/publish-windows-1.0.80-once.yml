name: Publish Yamachat Windows 1.0.80 Once

on:
  push:
    branches:
      - feature/desktop-user-admin-1.0.80
    paths:
      - ".github/workflows/publish-windows-1.0.80-once.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-user-admin-1.0.80

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release source
        shell: pwsh
        run: |
          $p = Get-Content desktop/package.json | ConvertFrom-Json
          if ($p.version -ne "1.0.80") { throw "Expected desktop 1.0.80" }
          $client = Get-Content desktop/desktop-client.html -Raw
          foreach ($marker in @(
            "Platform Admin · uživatelské účty",
            "Zabanovat účet",
            "Zprávy od Yamachatu",
            "ycForgotPassword"
          )) {
            if (-not $client.Contains($marker)) { throw "Missing desktop client marker: $marker" }
          }
          Write-Host "PASS desktop 1.0.80 release source; Linux safety checks already verified generator equivalence."

      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Setup
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify Windows update files
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.80.exe
          $block = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.80.exe.blockmap
          $latest = Get-Content desktop/dist/latest.yml -Raw
          if ($latest -notmatch "version:\s*1\.0\.80") { throw "latest.yml is not 1.0.80" }
          Write-Host "SETUP_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "SETUP_SIZE=$($exe.Length)"
          Write-Host "BLOCKMAP_SIZE=$($block.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-1.0.80
          path: |
            desktop/dist/Yamachat-Setup-1.0.80.exe
            desktop/dist/Yamachat-Setup-1.0.80.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: yamachat-windows-1.0.80
          path: release-assets

      - name: Add current signed Android APK
        run: |
          set -euo pipefail
          test -f download/Yamachat-Android.apk
          cp download/Yamachat-Android.apk release-assets/Yamachat-Android.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Yamachat 1.0.80

          - Platform Admin: seznam registrovaných uživatelů včetně e-mailu, registrace a posledního přihlášení.
          - Ban / odbanování účtů: 24 hodin, 7 dní, 30 dní nebo dlouhodobě, včetně důvodu zásahu.
          - Admin může poslat uživateli vzkaz přímo do účtu Yamachat.
          - Přidaná obnova zapomenutého hesla přes společný recovery flow.
          - Zachované profilové akce, chat, voice a updater z předchozí desktop verze.
          EOF
          if gh release view v1.0.80 >/dev/null 2>&1; then
            gh release upload v1.0.80 release-assets/* --clobber
            gh release edit v1.0.80 --title "Yamachat 1.0.80" --notes-file release-notes.md --latest
          else
            gh release create v1.0.80 release-assets/* --title "Yamachat 1.0.80" --notes-file release-notes.md --latest
          fi

      - name: Update shared Windows manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, subprocess
          p=pathlib.Path("update-manifest.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          latest=pathlib.Path("release-assets/latest.yml").read_text(encoding="utf-8")
          mm=re.search(r"^version:\s*['\"]?([^'\"\s]+)", latest, re.M)
          if not mm or mm.group(1)!="1.0.80":
              raise SystemExit("latest.yml version mismatch")
          w=m.setdefault("windows",{})
          w["latestVersion"]="1.0.80"
          w["required"]=True
          w["releaseUrl"]="https://github.com/yamboleeroy-ai/yamachat/releases/tag/v1.0.80"
          w["notes"]="Yamachat 1.0.80: Platform Admin správa uživatelů, ban/odbanování, vzkazy do účtu a obnova hesla."
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Windows updater 1.0.80 [skip ci]"
            git push origin HEAD:main
          fi
