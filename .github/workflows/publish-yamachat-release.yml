name: Publish Yamachat Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows version, e.g. 1.0.79"
        required: true
        default: "1.0.79"
        type: string
      title:
        description: "Release title"
        required: true
        default: "Yamachat"
        type: string
      notes:
        description: "Co je nového"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 1.0.79"
          }

      - name: Prepare unchanged desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set release version without changing repository
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm version "%RELEASE_VERSION%" --no-git-tag-version

      - name: Build Windows Setup
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Upload Windows update files
        uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-release
          path: |
            desktop/dist/Yamachat-Setup-*.exe
            desktop/dist/Yamachat-Setup-*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: yamachat-windows-release
          path: release-assets

      - name: Add current signed Android APK
        run: |
          set -euo pipefail
          test -f download/Yamachat-Android.apk
          cp download/Yamachat-Android.apk release-assets/Yamachat-Android.apk

      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "${RELEASE_NOTES:-Aktualizace Yamachatu.}" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          RELEASE_TITLE="$TITLE $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" release-assets/* --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          fi

      - name: Summary
        run: |
          echo "### Yamachat release published" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows: Setup.exe + blockmap + latest.yml" >> "$GITHUB_STEP_SUMMARY"
          echo "Android: Yamachat-Android.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Shared manifest will be synchronized by Sync update manifest from Release." >> "$GITHUB_STEP_SUMMARY"
