name: Stream and voice isolated preview
on:
  push:
    branches: [fix/windows-stream-voice-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium
      - run: node scripts/verify-stream-preview.cjs
      - run: node tests/stream-preview.cjs
      - run: node tests/voice-experience.cjs
      - run: node tests/voice-experience.cjs
        env:
          YC_CLIENT: desktop/desktop-client.html
      - name: Build native process audio
        shell: pwsh
        run: ./scripts/build-windows-process-audio.ps1
      - name: Assemble isolated portable from verified released runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yamboleeroy-ai/yamachat/releases/download/v1.0.99/Yamachat-Setup-1.0.99.exe -OutFile "$env:RUNNER_TEMP/baseline.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP/baseline.exe").Hash.ToLower() -ne 'c41d4660c7536ba77e37d5700ff884d878fad379f14f7c83fb9bd0b2c02d6cf0') { throw 'Baseline hash mismatch' }
          7z x -t7z "$env:RUNNER_TEMP/baseline.exe" -opreview-dist -y
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          foreach ($file in @('main.js','preload.js','updater.js','desktop.html','desktop-client.html')) { Copy-Item "desktop/$file" "preview-dist/resources/app/$file" -Force }
          Copy-Item desktop/process-audio/Yamachat.ProcessAudioCapture.exe preview-dist/resources/app/process-audio/ -Force
          Set-Content preview-dist/resources/app/preview.json '{"preview":true}'
          Copy-Item docs/stream-preview-test-plan.md preview-dist/README-preview.md
          7z a -tzip Yamachat-1.0.99-stream-preview.zip ./preview-dist/*
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          Get-FileHash Yamachat-1.0.99-stream-preview.zip | Format-List | Out-File preview-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Windows-isolated-preview
          path: |
            Yamachat-1.0.99-stream-preview.zip
            preview-sha256.txt
          retention-days: 14
      - run: node scripts/prepare-preview-web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Yamachat-web-PWA-preview
          path: preview-web/
          retention-days: 14
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: mobile
      - name: Prepare current shared client with isolated Android identity
        working-directory: mobile
        env:
          YC_USE_CURRENT_WEB: '1'
        run: |
          npm run prepare:web
          node -e "const fs=require('fs'),p=require('./capacitor.config.json');p.appId='eu.yamachat.preview';p.appName='Yamachat Preview';fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2))"
          npx cap add android
          npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Android-isolated-debug-preview
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
