name: Windows app-only stream audio portable preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-process-audio-capture-20260927
    paths:
      - "desktop/**"
      - "windows/process-audio/**"
      - "scripts/build-windows-process-audio.ps1"
      - "scripts/stream-viewer.mjs"
      - "scripts/apply-stream-viewer-desktop.mjs"
      - "scripts/build-stream-desktop.mjs"
      - "tests/windows-process-audio.cjs"
      - "tests/windows-stream-lifecycle.cjs"
      - "tests/stream-transport.mjs"
      - ".github/workflows/windows-process-audio-preview.yml"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/windows-process-audio-capture-20260927
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          npm install --no-save @microsoft/winappcli
          npx --no-install winapp --version

      - name: Parse Electron runtime
        run: |
          node --check desktop/main.js
          node --check desktop/preload.js

      - name: Build native app-only audio helper
        shell: pwsh
        run: ./scripts/build-windows-process-audio.ps1

      - name: Restore verified Yamachat desktop assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/restore-desktop-brand-assets.ps1 -Destination build

      - name: Regenerate released Windows client
        run: |
          node scripts/prepare-desktop-1.0.92.mjs
          node scripts/apply-stream-viewer-desktop.mjs
          node scripts/build-stream-desktop.mjs

      - name: Verify protected transport and app-only audio architecture
        run: |
          node tests/stream-transport.mjs
          node tests/windows-stream-lifecycle.cjs
          node tests/windows-process-audio.cjs

      - name: Verify preview remains Windows 1.0.97 lineage
        shell: pwsh
        run: |
          $p=Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if($p.version -ne "1.0.97"){throw "Preview must stay on Windows 1.0.97 lineage"}
          $client=Get-Content desktop/desktop-client.html -Raw
          foreach($marker in @(
            'const YC_STREAM_DESKTOP=true;',
            'ycPrepareDesktopProcessAudio',
            "window.__ycDesktopProcessAudioMode='process'",
            'stream.addTrack(result.track)',
            'await ycStopDesktopProcessAudio()'
          )){
            if(-not $client.Contains($marker)){throw "Missing app-only stream-audio marker: $marker"}
          }
          $main=Get-Content desktop/main.js -Raw
          if(-not $main.Contains("shareSystemAudio && !isWindowSource")){throw "Window source may still request system loopback"}
          if(-not $main.Contains("Yamachat.ProcessAudioCapture.exe")){throw "Native process-audio helper bridge missing"}

      - name: Build WNS runtime without changing production identity
        shell: pwsh
        env:
          YAMACHAT_WNS_PACKAGE_VERSION: "1.0.97.0"
        run: ./scripts/build-windows-wns.ps1

      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js
          if(-not(Test-Path "desktop/process-audio/Yamachat.ProcessAudioCapture.exe")){throw "Process-audio helper missing before package"}

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unpacked Windows preview
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Verify packaged app-only audio preview
        shell: pwsh
        run: |
          $appRoot="desktop/dist/win-unpacked/resources/app"
          foreach($file in @(
            "$appRoot/main.js",
            "$appRoot/preload.js",
            "$appRoot/desktop.html",
            "$appRoot/desktop-client.html",
            "$appRoot/process-audio/Yamachat.ProcessAudioCapture.exe",
            "$appRoot/wns/Yamachat.WnsBridge.exe",
            "$appRoot/build/icon.ico",
            "desktop/dist/win-unpacked/Yamachat.exe"
          )){
            if(-not(Test-Path $file)){throw "Packaged preview file missing: $file"}
          }
          & "$appRoot/process-audio/Yamachat.ProcessAudioCapture.exe" --version
          if($LASTEXITCODE -ne 0){throw "Packaged process-audio helper version probe failed"}

          $main=Get-Content "$appRoot/main.js" -Raw
          $preload=Get-Content "$appRoot/preload.js" -Raw
          $shell=Get-Content "$appRoot/desktop.html" -Raw
          $client=Get-Content "$appRoot/desktop-client.html" -Raw
          if(-not $main.Contains("spawn(executable, ['--hwnd', selection.windowHandle]")){throw "Packaged native process capture launch missing"}
          if(-not $main.Contains("shareSystemAudio && !isWindowSource")){throw "Packaged window source can fall back to system loopback"}
          if(-not $preload.Contains("onProcessAudioChunk")){throw "Packaged process-audio preload bridge missing"}
          if(-not $shell.Contains("YamachatDesktopProcessAudio")){throw "Packaged PCM-to-MediaStream bridge missing"}
          if(-not $client.Contains("ycPrepareDesktopProcessAudio")){throw "Packaged stream client process-audio hook missing"}
          Write-Host "PASS packaged Windows preview contains app-only process audio path and no window-share system-loopback fallback."

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-app-only-audio-preview
          path: desktop/dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 7
