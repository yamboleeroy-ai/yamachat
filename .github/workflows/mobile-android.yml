name: Yamachat Android APK

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "index.html"
      - "icons/**"
      - "audio/**"
      - "web/**"
      - "scripts/**"
      - "reference/**"
      - "vendor/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate shared Web/PWA client from reviewed sources
        run: node scripts/build-web.mjs

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare bundled Yamachat web
        working-directory: mobile
        run: npm run prepare:web

      - name: Verify unchanged desktop reference and bundled scripts
        run: node scripts/check.mjs

      - name: Create Android project when missing
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync and patch Android
        working-directory: mobile
        run: |
          npx cap sync android
          node scripts/patch-native.mjs android

      - name: Verify Android Microsoft Natural voices stay Android-only
        run: node tests/android-natural-voices.cjs

      - name: Restore and validate Firebase client config
        id: firebase_client
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
          elif [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          fi
          if [ -f android/app/google-services.json ]; then
            node scripts/verify-firebase-config.mjs android/app/google-services.json android-release.json
            grep -q 'com.google.gms.google-services' android/app/build.gradle
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Firebase client config verified for eu.yamachat.app."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase client config is not configured; APK will build, but killed-app FCM delivery stays disabled."
          fi
          test -f android/app/src/main/res/raw/yamachat_message.mp3
          test -f android/app/src/main/res/drawable/ic_yamachat_notification.xml
          test -f android/app/src/main/res/drawable-nodpi/yamachat_notification_logo.png
          grep -q 'com.google.firebase.messaging.default_notification_icon' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.firebase.messaging.default_notification_channel_id' android/app/src/main/AndroidManifest.xml
          grep -q 'yamachat-messages-v2' android/app/src/main/AndroidManifest.xml

      - name: Check Yamachat FCM backend readiness
        id: firebase_server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://bxjvmjdppmqgbxfcowpf.supabase.co/functions/v1/yamachat-source/push \
            -o /tmp/yamachat-push-config.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/yamachat-push-config.json').read_text())
          ready=bool(data.get('androidFcmConfigured'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('configured='+('true' if ready else 'false')+'\n')
          print('FCM server credential configured:', ready)
          PY

      - name: Build with permanent Android identity
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Configure the permanent Android keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the permanent Android keystore password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/yamachat-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = ''.join(os.environ['ANDROID_KEYSTORE_B64'].split())
          try:
              key = base64.b64decode(encoded, validate=True)
          except ValueError:
              raise SystemExit('ANDROID_KEYSTORE_B64 must contain only the base64 file contents, not a path or label')
          Path(os.environ['ANDROID_KEYSTORE_PATH']).write_bytes(key)
          PY
          export ANDROID_VERSION_CODE="$(node -p 'Math.max(200000+Number(process.env.GITHUB_RUN_NUMBER),require("../../update-manifest.json").android.latestVersionCode+1)')"
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../Yamachat-Android.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../../Yamachat-Android.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 ../../Yamachat-Android.apk
          python ../../scripts/verify-android-apk.py \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner" \
            --apk ../../Yamachat-Android.apk --previous ../../download/Yamachat-Android.apk \
            --expected-code "$ANDROID_VERSION_CODE" --report ../../android-artifact.json

      - name: Report killed-app FCM readiness
        run: |
          echo "Firebase client configured: ${{ steps.firebase_client.outputs.configured }}"
          echo "Firebase server configured: ${{ steps.firebase_server.outputs.configured }}"
          if [ "${{ steps.firebase_client.outputs.configured }}" = "true" ] && [ "${{ steps.firebase_server.outputs.configured }}" = "true" ]; then
            echo "FCM killed-app push is fully configured."
          else
            echo "FCM killed-app push is NOT fully configured yet."
          fi

      - name: Keep Android publication external to Git repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Verified APK is uploaded only as a workflow artifact here."
          echo "Production APK publication is handled by the Cloudflare R2 release workflow."

      - name: Upload Yamachat APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Android
          path: |
            Yamachat-Android.apk
            android-artifact.json
          if-no-files-found: error
          retention-days: 30


