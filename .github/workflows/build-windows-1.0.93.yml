name: Validate Yamachat Windows 1.0.93 voice accent

on:
  push:
    branches:
      - release/windows-1.0.93-voice-accent
    paths:
      - ".github/workflows/build-windows-1.0.93.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/windows-1.0.93-voice-accent
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Prepare approved desktop 1.0.93 client
        run: node scripts/prepare-desktop-1.0.93.mjs

      - name: Verify stable desktop baseline and accent-only patch
        shell: pwsh
        run: |
          $p = Get-Content desktop/package.json | ConvertFrom-Json
          if ($p.version -ne "1.0.93") { throw "Expected Yamachat desktop 1.0.93" }

          $client = Get-Content desktop/desktop-client.html -Raw
          foreach ($marker in @(
            'id="ycPasswordRequestBack"',
            "Platform Admin · uživatelské účty",
            "Zabanovat účet",
            "Zprávy od Yamachatu",
            "ycServerContextFrame",
            "ycServerCardContextStyle",
            "ycFriendsPanelRefreshStyle",
            "ycFriendsStableSet",
            "data-yc-modern-friends",
            "ycUiAccentPolishStyle",
            "border-right:0!important",
            "border-bottom:0!important",
            "scrollbar-color:color-mix(in srgb,var(--yc-theme",
            "*::-webkit-scrollbar-thumb"
          )) {
            if (-not $client.Contains($marker)) { throw "Missing desktop client marker: $marker" }
          }

          foreach ($forbidden in @(
            "ycActiveServerConnectedFrame",
            "__ycActiveServerContextV2",
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext"
          )) {
            if ($client.Contains($forbidden)) { throw "Forbidden old active-server runtime found: $forbidden" }
          }

          $runtime = Get-Content desktop/main.js -Raw
          foreach ($marker in @(
            "function createTray()",
            "new Tray(trayIconForCurrentState())",
            "createTray();",
            "if (behavior === 'tray')",
            "'build',",
            "'icon.ico'"
          )) {
            if (-not $runtime.Contains($marker)) { throw "Missing tray/runtime marker: $marker" }
          }

          if (-not (Test-Path build/installer.nsh)) { throw "Missing NSIS rollback hook" }
          ./scripts/restore-desktop-brand-assets.ps1 -Destination build
          Write-Host "PASS: verified 1.0.81-derived runtime plus approved social/server features and accent-only voice/scrollbar polish."

      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Setup
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify packaged client and updater files
        shell: pwsh
        run: |
          $appRoot = "desktop/dist/win-unpacked/resources/app"
          $client = Get-Content "$appRoot/desktop-client.html" -Raw

          foreach ($marker in @(
            "ycServerContextFrame",
            "ycServerCardContextStyle",
            "ycFriendsPanelRefreshStyle",
            "ycFriendsStableSet",
            "data-yc-modern-friends",
            "ycUiAccentPolishStyle",
            "border-right:0!important",
            "border-bottom:0!important",
            "scrollbar-color:color-mix(in srgb,var(--yc-theme",
            "*::-webkit-scrollbar-thumb"
          )) {
            if (-not $client.Contains($marker)) { throw "Packaged client missing approved marker: $marker" }
          }

          foreach ($forbidden in @(
            "ycActiveServerConnectedFrame",
            "__ycActiveServerContextV2",
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext"
          )) {
            if ($client.Contains($forbidden)) { throw "Packaged client contains forbidden old active-server runtime: $forbidden" }
          }

          $exe = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.93.exe
          $block = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.93.exe.blockmap
          $latest = Get-Content desktop/dist/latest.yml -Raw
          if ($latest -notmatch "version:\s*1\.0\.93") { throw "latest.yml is not 1.0.93" }

          Write-Host "SETUP_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "SETUP_SIZE=$($exe.Length)"
          Write-Host "BLOCKMAP_SIZE=$($block.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-1.0.93-validation
          path: |
            desktop/dist/Yamachat-Setup-1.0.93.exe
            desktop/dist/Yamachat-Setup-1.0.93.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
