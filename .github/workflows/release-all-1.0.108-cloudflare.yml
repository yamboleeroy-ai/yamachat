name: Yamachat 1.0.108 Cloudflare release

on:
  push:
    branches: [release/1.0.108-cloudflare-clean-20260929]
    paths:
      - ".github/workflows/release-all-1.0.108-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yamachat-1.0.108-cloudflare-release
  cancel-in-progress: false

jobs:
  cloudflare-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are required before production publication."
            exit 2
          fi
          npx --yes wrangler@latest r2 bucket list >/dev/null
          echo "Cloudflare R2 access verified."

  web:
    needs: cloudflare-preflight
    uses: ./.github/workflows/web-check.yml

  android:
    needs: cloudflare-preflight
    uses: ./.github/workflows/mobile-android.yml
    secrets: inherit

  ios-pwa:
    needs: cloudflare-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-web.mjs
      - run: node scripts/check.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium
      - name: Verify iOS/PWA and cross-platform runtime
        run: |
          node tests/full-platform-user-journey.cjs
          node tests/web-mobile-desktop-behavior-sync.cjs
          node tests/cross-platform-voice-interop.cjs
          node tests/service-worker-guard.cjs
          node tests/platform-install-ui.cjs
          node tests/no-public-github-distribution.cjs

  windows:
    needs: cloudflare-preflight
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preserve repository line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - name: Verify release source descends from audited runtime
        shell: pwsh
        run: |
          git merge-base --is-ancestor 43aa1814b5c85a7e3c9f142c1ddba92a8d5940c3 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release branch is not based on the completed audited runtime.' }
      - name: Generate and verify shared clients
        shell: pwsh
        run: |
          node scripts/build-web.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Web generation failed' }
          node scripts/check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Project checks failed' }
          node scripts/check-legal-baseline.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Legal baseline failed' }
          node tests/no-public-github-distribution.cjs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub distribution guard failed' }
      - name: Run critical stability regression guards
        shell: pwsh
        run: |
          node tests/voice-experience.cjs
          if ($LASTEXITCODE -ne 0) { throw 'voice-experience failed' }
          node tests/windows-presence-stability.cjs
          if ($LASTEXITCODE -ne 0) { throw 'windows-presence-stability failed' }
          node tests/cross-platform-voice-interop.cjs
          if ($LASTEXITCODE -ne 0) { throw 'cross-platform-voice-interop failed' }
          node tests/voice-scale-model.cjs
          if ($LASTEXITCODE -ne 0) { throw 'voice-scale-model failed' }
          node tests/stream-viewer.cjs
          if ($LASTEXITCODE -ne 0) { throw 'stream-viewer failed' }
          node tests/windows-stream-lifecycle.cjs
          if ($LASTEXITCODE -ne 0) { throw 'windows-stream-lifecycle failed' }
          node tests/windows-process-audio.cjs
          if ($LASTEXITCODE -ne 0) { throw 'windows-process-audio failed' }
          node tests/windows-taskbar-restore.cjs
          if ($LASTEXITCODE -ne 0) { throw 'windows-taskbar-restore failed' }
      - name: Build native process audio
        shell: pwsh
        run: ./scripts/build-windows-process-audio.ps1
      - name: Build WNS with unchanged production identity
        shell: pwsh
        env:
          YAMACHAT_WNS_PACKAGE_VERSION: '1.0.108.0'
        run: |
          npm install --no-save --package-lock=false @microsoft/winappcli
          if ($LASTEXITCODE -ne 0) { throw 'WinApp CLI install failed' }
          ./scripts/build-windows-wns.ps1
      - name: Prepare reviewed runtime
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop/build
          Copy-Item -Recurse -Force audio desktop/audio
          Copy-Item boot-guard.js desktop/boot-guard.js
          if (Test-Path desktop/preview.json) { throw 'Preview configuration must not enter production' }
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Windows installer
        run: npm run release:win
        working-directory: desktop
      - name: Verify Windows Cloudflare updater package
        shell: pwsh
        run: |
          $appRoot='desktop/dist/win-unpacked/resources/app'
          foreach ($file in @('main.js','preload.js','updater.js','desktop.html','desktop-client.html')) {
            if ((Get-FileHash "$appRoot/$file").Hash -ne (Get-FileHash "desktop/$file").Hash) { throw "Packaged source mismatch: $file" }
          }
          if ((Get-Content desktop/dist/latest.yml -Raw) -notmatch 'version:\s*1\.0\.108') { throw 'Wrong updater version' }
          foreach ($file in @('Yamachat-Setup-1.0.108.exe','Yamachat-Setup-1.0.108.exe.blockmap','latest.yml')) {
            if (-not (Test-Path "desktop/dist/$file")) { throw "Missing updater asset: $file" }
          }
          $cfg=Get-Content desktop/dist/win-unpacked/resources/app-update.yml -Raw
          if ($cfg -notmatch 'provider:\s*generic' -or $cfg -notmatch 'https://updates\.yamachat\.eu/windows/') { throw 'Packaged updater is not using Cloudflare generic feed' }
          if (Test-Path "$appRoot/preview.json") { throw 'Preview isolation leaked into production' }
      - uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Windows-1.0.108
          path: |
            desktop/dist/Yamachat-Setup-1.0.108.exe
            desktop/dist/Yamachat-Setup-1.0.108.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: [cloudflare-preflight, web, android, ios-pwa, windows]
    if: ${{ always() && needs.cloudflare-preflight.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' && needs.ios-pwa.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: Yamachat-Windows-1.0.108
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Yamachat-Android
          path: release-assets
      - name: Validate final artifacts
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin tag legal-baseline-2026-09-27 --force
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor legal-baseline-2026-09-27 HEAD
          node scripts/check-legal-baseline.mjs
          node scripts/verify-release-assets.cjs release-assets
          node tests/no-public-github-distribution.cjs
          cd release-assets
          sha256sum Yamachat-Setup-1.0.108.exe Yamachat-Setup-1.0.108.exe.blockmap latest.yml Yamachat-Android.apk > SHA256SUMS.txt
      - name: Provision Cloudflare R2 distribution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BUCKET='yamachat-releases'
          if ! npx --yes wrangler@latest r2 bucket list | grep -q "$BUCKET"; then
            npx --yes wrangler@latest r2 bucket create "$BUCKET"
          fi
          ZONE_ID="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=yamachat.eu&account.id=$CLOUDFLARE_ACCOUNT_ID" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const id=j?.result?.[0]?.id;if(!j.success||!id)process.exit(2);process.stdout.write(id)})")"
          if ! npx --yes wrangler@latest r2 bucket domain get "$BUCKET" --domain updates.yamachat.eu >/dev/null 2>&1; then
            npx --yes wrangler@latest r2 bucket domain add "$BUCKET" --domain updates.yamachat.eu --zone-id "$ZONE_ID" --force
          fi
      - name: Upload Windows update assets to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          W='npx --yes wrangler@latest'
          $W r2 object put yamachat-releases/windows/Yamachat-Setup-1.0.108.exe --file release-assets/Yamachat-Setup-1.0.108.exe --content-type application/vnd.microsoft.portable-executable --content-disposition 'attachment; filename="Yamachat-Setup-1.0.108.exe"' --cache-control 'public, max-age=31536000, immutable' --remote
          $W r2 object put yamachat-releases/windows/Yamachat-Setup-1.0.108.exe.blockmap --file release-assets/Yamachat-Setup-1.0.108.exe.blockmap --content-type application/octet-stream --cache-control 'public, max-age=31536000, immutable' --remote
          $W r2 object put yamachat-releases/windows/SHA256SUMS.txt --file release-assets/SHA256SUMS.txt --content-type text/plain --cache-control 'no-cache' --remote
          $W r2 object put yamachat-releases/windows/latest.yml --file release-assets/latest.yml --content-type text/yaml --cache-control 'no-cache, no-store' --remote
      - name: Verify Cloudflare public update feed
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 https://updates.yamachat.eu/windows/latest.yml | grep -q 'version: 1.0.108'; then
              break
            fi
            if [ "$i" = 30 ]; then echo 'Cloudflare update feed did not become ready'; exit 1; fi
            sleep 10
          done
          curl -fsSI --max-time 20 https://updates.yamachat.eu/windows/Yamachat-Setup-1.0.108.exe >/dev/null
      - name: Integrate verified source, Android APK and manifest into main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp release-assets/Yamachat-Android.apk /tmp/Yamachat-Android.apk
          cp release-assets/android-artifact.json /tmp/android-artifact.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-main origin/main
          if ! git merge --no-ff --no-commit "$RELEASE_SHA"; then
            git merge --abort || true
            echo "Release source no longer merges cleanly into main; refusing publication."
            exit 1
          fi
          mkdir -p download
          cp /tmp/Yamachat-Android.apk download/Yamachat-Android.apk
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          report=json.loads(Path('/tmp/android-artifact.json').read_text())
          artifact=report['artifact']
          p=Path('update-manifest.json')
          m=json.loads(p.read_text())
          w=m.setdefault('windows',{})
          if w.get('latestVersion')!='1.0.108':
              raise SystemExit('Windows manifest is not prepared for 1.0.108')
          w['required']=True
          w['feedUrl']='https://updates.yamachat.eu/windows/'
          w['installerUrl']='https://updates.yamachat.eu/windows/Yamachat-Setup-1.0.108.exe'
          w.pop('releaseUrl',None)
          a=m.setdefault('android',{})
          a['latestVersion']=artifact['versionName']
          a['latestVersionCode']=int(artifact['versionCode'])
          a['required']=True
          a['apkUrl']=f"https://yamachat.eu/download/Yamachat-Android.apk?v={artifact['versionCode']}"
          a['sha256']=artifact['sha256']
          a['notes']=[
              'Deep stability audit: voice, stream, WebRTC, reconnect a cleanup lifecycle byly zpevněné.',
              'Android zachovává současné mobilní rozložení, Microsoft Natural Voices a interoperabilitu s webem a Windows.',
              'Veřejná distribuce klientů už nevyžaduje GitHub Releases.'
          ]
          m['publishedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          node scripts/build-web.mjs
          node scripts/check.mjs
          node scripts/check-legal-baseline.mjs
          node tests/no-public-github-distribution.cjs
          git add -A
          git commit -m "Release Yamachat 1.0.108 across Cloudflare platforms [skip ci]"
          git push origin HEAD:main
      - name: Create one-time GitHub bridge for installed 1.0.107 clients
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view v1.0.108 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Bridge release already exists; refusing overwrite.'
            exit 1
          fi
          gh release create v1.0.108 release-assets/Yamachat-Setup-1.0.108.exe release-assets/Yamachat-Setup-1.0.108.exe.blockmap release-assets/latest.yml release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "Yamachat 1.0.108 migration bridge" --notes-file docs/release-1.0.108.md --latest
      - name: Verify main no longer exposes GitHub distribution
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:desktop/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "1.0.108"
          git show origin/main:update-manifest.json | grep -q 'https://updates.yamachat.eu/windows/'
          ! git show origin/main:update-manifest.json | grep -q 'github.com/yamboleeroy-ai/yamachat/releases'
