name: Yamachat Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "mobile/**"
      - "index.html"
      - "icons/**"
      - "audio/**"
      - "web/**"
      - "scripts/**"
      - "reference/**"
      - "vendor/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare bundled Yamachat web
        working-directory: mobile
        run: npm run prepare:web

      - name: Create Android project when missing
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync and patch Android
        working-directory: mobile
        run: |
          npx cap sync android
          node scripts/patch-native.mjs android

      - name: Set monotonic Android version
        working-directory: mobile/android
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          run = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 100000 + run
          version_name = f"1.0.{run}"

          groovy = Path("app/build.gradle")
          kotlin = Path("app/build.gradle.kts")
          p = groovy if groovy.exists() else kotlin
          if not p.exists():
              raise SystemExit("Android app Gradle file not found")

          s = p.read_text(encoding="utf-8")
          if p.suffix == ".kts":
              s, n1 = re.subn(r'\bversionCode\s*=\s*\d+', f'versionCode = {version_code}', s, count=1)
              s, n2 = re.subn(r'\bversionName\s*=\s*"[^"]*"', f'versionName = "{version_name}"', s, count=1)
          else:
              s, n1 = re.subn(r'\bversionCode\s+\d+', f'versionCode {version_code}', s, count=1)
              s, n2 = re.subn(r'\bversionName\s+"[^"]*"', f'versionName "{version_name}"', s, count=1)

          if not n1 or not n2:
              raise SystemExit("Could not patch Android versionCode/versionName")
          p.write_text(s, encoding="utf-8")
          print(f"Android versionCode={version_code}, versionName={version_name}")
          PY

      - name: Build installable APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          if [ -n "${ANDROID_KEYSTORE_B64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "Building stable signed release APK."
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/yamachat-release.jks"

            ./gradlew assembleRelease

            BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            test -x "$BUILD_TOOLS/zipalign"
            test -x "$BUILD_TOOLS/apksigner"

            "$BUILD_TOOLS/zipalign" -f -p 4               app/build/outputs/apk/release/app-release-unsigned.apk               "$RUNNER_TEMP/Yamachat-Android-aligned.apk"

            "$BUILD_TOOLS/apksigner" sign               --ks "$RUNNER_TEMP/yamachat-release.jks"               --ks-key-alias yamachat               --ks-pass env:ANDROID_KEYSTORE_PASSWORD               --key-pass env:ANDROID_KEYSTORE_PASSWORD               --out ../../Yamachat-Android.apk               "$RUNNER_TEMP/Yamachat-Android-aligned.apk"

            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../../Yamachat-Android.apk
          else
            echo "::warning::Stable Android signing secrets are not configured. This debug APK cannot update a build signed by a different runner key."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../Yamachat-Android.apk
          fi

      - name: Publish APK for yamachat.eu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp Yamachat-Android.apk /tmp/Yamachat-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-apk origin/main
            mkdir -p download
            cp /tmp/Yamachat-Android.apk download/Yamachat-Android.apk
            git add -f download/Yamachat-Android.apk
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish latest Yamachat Android APK [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "APK publish raced with another main update; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1

      - name: Upload Yamachat APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Android
          path: Yamachat-Android.apk
          if-no-files-found: error
          retention-days: 30
