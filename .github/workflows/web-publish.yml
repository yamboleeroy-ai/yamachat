name: Verify current Yamachat web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'web/**', 'scripts/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
