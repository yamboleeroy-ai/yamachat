name: Sync update manifest from Release

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to resync (for example v1.0.79)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          test -n "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release view "$TAG" --json tagName,publishedAt,body,url,assets > /tmp/yamachat-release.json

      - name: Download update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/yamachat-release-assets
          gh release download "$TAG" --pattern 'latest.yml' --dir /tmp/yamachat-release-assets || true
          gh release download "$TAG" --pattern 'Yamachat-Android*.apk' --dir /tmp/yamachat-release-assets || true

      - name: Inspect and verify assets
        run: |
          set -euo pipefail
          : > /tmp/yamachat-update.env

          LATEST_YML="$(find /tmp/yamachat-release-assets -maxdepth 1 -type f -name 'latest.yml' | head -n 1 || true)"
          if [ -n "$LATEST_YML" ]; then
            WIN_VERSION="$(sed -n 's/^version:[[:space:]]*//p' "$LATEST_YML" | head -n 1 | tr -d '\r"' | xargs)"
            if [ -n "$WIN_VERSION" ]; then
              printf 'WINDOWS_VERSION=%s\n' "$WIN_VERSION" >> /tmp/yamachat-update.env
            fi
          fi

          APK="$(find /tmp/yamachat-release-assets -maxdepth 1 -type f -name 'Yamachat-Android*.apk' | head -n 1 || true)"
          if [ -n "$APK" ]; then
            BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            test -x "$BUILD_TOOLS/aapt"
            test -x "$BUILD_TOOLS/apksigner"

            BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
            APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
            VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
            VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
            CERT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | sed -n -E 's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([0-9a-fA-F:]+)$/\3/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
            EXPECTED_APP="$(python -c "import json;print(json.load(open('mobile/android-release.json'))['applicationId'])")"
            EXPECTED_CERT="$(python -c "import json;print(json.load(open('mobile/android-release.json'))['certificateSha256'])")"

            test "$APP_ID" = "$EXPECTED_APP"
            test "$CERT" = "$EXPECTED_CERT"
            test -n "$VERSION_CODE"
            test -n "$VERSION_NAME"

            SHA="$(sha256sum "$APK" | awk '{print $1}')"
            printf 'ANDROID_VERSION=%s\nANDROID_VERSION_CODE=%s\nANDROID_SHA256=%s\n' "$VERSION_NAME" "$VERSION_CODE" "$SHA" >> /tmp/yamachat-update.env
          fi

          cat /tmp/yamachat-update.env >> "$GITHUB_ENV"

      - name: Update shared manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest_path = Path('update-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          release = json.loads(Path('/tmp/yamachat-release.json').read_text(encoding='utf-8'))
          assets = {a['name']: a.get('url') for a in release.get('assets', [])}
          notes = (release.get('body') or '').strip()

          win_version = os.environ.get('WINDOWS_VERSION', '').strip()
          if win_version:
              w = manifest.setdefault('windows', {})
              w['latestVersion'] = win_version
              w['releaseUrl'] = release.get('url') or w.get('releaseUrl')
              if notes:
                  w['notes'] = notes

          android_version = os.environ.get('ANDROID_VERSION', '').strip()
          android_code = os.environ.get('ANDROID_VERSION_CODE', '').strip()
          if android_version and android_code:
              apk_name = next((name for name in assets if name.lower().endswith('.apk') and name.startswith('Yamachat-Android')), '')
              if not apk_name:
                  raise SystemExit('Android APK was inspected but its release URL was not found')
              a = manifest.setdefault('android', {})
              a['latestVersion'] = android_version
              a['latestVersionCode'] = int(android_code)
              a['apkUrl'] = assets[apk_name]
              a['sha256'] = os.environ['ANDROID_SHA256'].strip()
              if notes:
                  a['notes'] = notes

          manifest['publishedAt'] = release.get('publishedAt') or manifest.get('publishedAt')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish manifest
        run: |
          set -euo pipefail
          if git diff --quiet -- update-manifest.json; then
            echo "Manifest already matches release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          git commit -m "Sync update manifest for $TAG [skip ci]"
          git push origin HEAD:main
