name: Publish Yamachat Windows 1.0.81 Once

on:
  push:
    branches:
      - feature/desktop-tray-recovery-1.0.81
    paths:
      - ".github/workflows/publish-windows-1.0.81-once.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-tray-recovery-1.0.81

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $p = Get-Content desktop/package.json | ConvertFrom-Json
          if ($p.version -ne "1.0.81") { throw "Expected desktop 1.0.81" }

          $client = Get-Content desktop/desktop-client.html -Raw
          foreach ($marker in @(
            'id="ycPasswordRequestBack"',
            "Platform Admin · uživatelské účty",
            "Zabanovat účet",
            "Zprávy od Yamachatu"
          )) {
            if (-not $client.Contains($marker)) { throw "Missing desktop client marker: $marker" }
          }

          $runtime = Get-Content desktop/main.js -Raw
          foreach ($marker in @(
            "function createTray()",
            "new Tray(trayIconForCurrentState())",
            "createTray();",
            "if (behavior === 'tray')",
            "'build',",
            "'icon.ico'"
          )) {
            if (-not $runtime.Contains($marker)) { throw "Missing tray/runtime marker: $marker" }
          }

          if (-not (Test-Path build/installer.nsh)) { throw "Missing NSIS rollback hook" }
          ./scripts/restore-desktop-brand-assets.ps1 -Destination build

          foreach ($name in @(
            "icon.ico",
            "app-icon-source.png",
            "tray-controller-idle.png",
            "tray-controller-speaking.png",
            "tray-status-online.png",
            "tray-status-online-notify.png",
            "yamachat-logo-ui.webp"
          )) {
            if (-not (Test-Path (Join-Path build $name))) { throw "Missing Windows brand asset $name" }
          }
          Write-Host "PASS Windows 1.0.81 source, tray runtime and verified 1.0.79 brand assets."

      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Setup
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify packaged tray and app icons
        shell: pwsh
        run: |
          $appBuild = "desktop/dist/win-unpacked/resources/app/build"
          foreach ($name in @(
            "icon.ico",
            "app-icon-source.png",
            "tray-controller-idle.png",
            "tray-controller-speaking.png",
            "tray-status-online.png",
            "tray-status-online-notify.png",
            "yamachat-logo-ui.webp"
          )) {
            $p = Join-Path $appBuild $name
            if (-not (Test-Path $p)) { throw "Packaged app is missing $name" }
            Write-Host "PACKAGED $name $((Get-FileHash $p -Algorithm SHA256).Hash)"
          }

          $exe = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.81.exe
          $block = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.81.exe.blockmap
          $latest = Get-Content desktop/dist/latest.yml -Raw
          if ($latest -notmatch "version:\s*1\.0\.81") { throw "latest.yml is not 1.0.81" }
          Write-Host "SETUP_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "SETUP_SIZE=$($exe.Length)"
          Write-Host "BLOCKMAP_SIZE=$($block.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-1.0.81
          path: |
            desktop/dist/Yamachat-Setup-1.0.81.exe
            desktop/dist/Yamachat-Setup-1.0.81.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: yamachat-windows-1.0.81
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Yamachat 1.0.81

          - Opravená Windows ikona aplikace na ploše, hlavním panelu i v okně.
          - Obnovené původní tray ikony a tray chování z ověřené verze 1.0.79.
          - Zachované schování do tray a voice-safe minimize.
          - Žádost o obnovu hesla se nyní odesílá přímo uvnitř Yamachatu; webová reset stránka se použije až po kliknutí na odkaz v e-mailu.
          - Zachována Platform Admin správa uživatelů, ban/odbanování a vzkazy do účtu.
          EOF
          if gh release view v1.0.81 >/dev/null 2>&1; then
            gh release upload v1.0.81 release-assets/* --clobber
            gh release edit v1.0.81 --title "Yamachat 1.0.81" --notes-file release-notes.md --latest
          else
            gh release create v1.0.81 release-assets/* --title "Yamachat 1.0.81" --notes-file release-notes.md --latest
          fi

      - name: Update Windows updater manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          p=pathlib.Path("update-manifest.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          latest=pathlib.Path("release-assets/latest.yml").read_text(encoding="utf-8")
          mm=re.search(r"^version:\s*['\"]?([^'\"\s]+)",latest,re.M)
          if not mm or mm.group(1)!="1.0.81":
              raise SystemExit("latest.yml version mismatch")
          w=m.setdefault("windows",{})
          w["latestVersion"]="1.0.81"
          w["required"]=True
          w["releaseUrl"]="https://github.com/yamboleeroy-ai/yamachat/releases/tag/v1.0.81"
          w["notes"]="Yamachat 1.0.81: opravené Windows/tray ikony, obnovené tray chování a obnova hesla přímo uvnitř aplikace."
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git add update-manifest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish Windows updater 1.0.81 [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --soft HEAD~1
            sleep 2
          done
          exit 1
