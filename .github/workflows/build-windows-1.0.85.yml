name: Build Yamachat Windows 1.0.85 Connected Context

on:
  push:
    branches:
      - release/windows-1.0.85-connected-context
    paths:
      - ".github/workflows/build-windows-1.0.85.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/windows-1.0.85-connected-context

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify clean 1.0.81-derived source
        shell: pwsh
        run: |
          $p = Get-Content desktop/package.json | ConvertFrom-Json
          if ($p.version -ne "1.0.85") { throw "Expected desktop 1.0.85" }

          $client = Get-Content desktop/desktop-client.html -Raw
          foreach ($marker in @(
            'id="ycPasswordRequestBack"',
            "Platform Admin · uživatelské účty",
            "Zabanovat účet",
            "Zprávy od Yamachatu",
            "ACTIVE SERVER CONTEXT 1.0.85"
          )) {
            if (-not $client.Contains($marker)) { throw "Missing desktop client marker: $marker" }
          }

          foreach ($forbidden in @(
            "ycActiveServerConnectedFrame",
            "__ycActiveServerContextV2",
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext"
          )) {
            if ($client.Contains($forbidden)) { throw "Forbidden old active-server runtime found: $forbidden" }
          }

          $runtime = Get-Content desktop/main.js -Raw
          foreach ($marker in @(
            "function createTray()",
            "new Tray(trayIconForCurrentState())",
            "createTray();",
            "if (behavior === 'tray')",
            "'build',",
            "'icon.ico'"
          )) {
            if (-not $runtime.Contains($marker)) { throw "Missing tray/runtime marker: $marker" }
          }

          if (-not (Test-Path build/installer.nsh)) { throw "Missing NSIS rollback hook" }
          ./scripts/restore-desktop-brand-assets.ps1 -Destination build
          Write-Host "PASS: clean 1.0.81-derived runtime with visual-only active-server glow."

      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop\build
          Copy-Item -Recurse -Force audio desktop\audio
          Copy-Item -Force boot-guard.js desktop\boot-guard.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Setup
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify packaged client
        shell: pwsh
        run: |
          $appRoot = "desktop/dist/win-unpacked/resources/app"
          $client = Get-Content "$appRoot/desktop-client.html" -Raw

          if (-not $client.Contains("ACTIVE SERVER CONTEXT 1.0.85")) { throw "Packaged client missing active-server glow" }
          foreach ($forbidden in @(
            "ycActiveServerConnectedFrame",
            "__ycActiveServerContextV2",
            "yc-active-server-context-card",
            "ycActiveServerGlobalContext"
          )) {
            if ($client.Contains($forbidden)) { throw "Packaged client contains old active-server runtime: $forbidden" }
          }

          $exe = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.85.exe
          $block = Get-ChildItem desktop/dist/Yamachat-Setup-1.0.85.exe.blockmap
          $latest = Get-Content desktop/dist/latest.yml -Raw
          if ($latest -notmatch "version:\s*1\.0\.84") { throw "latest.yml is not 1.0.85" }

          Write-Host "SETUP_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "SETUP_SIZE=$($exe.Length)"
          Write-Host "BLOCKMAP_SIZE=$($block.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-1.0.85-glow
          path: |
            desktop/dist/Yamachat-Setup-1.0.85.exe
            desktop/dist/Yamachat-Setup-1.0.85.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30


  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: yamachat-windows-1.0.85-glow
          path: release-assets

      - name: Create Windows 1.0.85 connected-context release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Yamachat 1.0.85

          - Aktivní server má výraznější cyan/fialový glow podle Work návrhu.
          - Aktivní server je vizuálně propojený s otevřeným serverovým panelem.
          - Propojení je čistě vizuální a má pointer-events:none, takže neblokuje ovládání.
          - Zachované tray chování, voice, chat, obnova hesla a Platform Admin funkce.
          - Starší release se nepřepisují.
          EOF

          gh release create v1.0.85 release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target release/windows-1.0.85-connected-context \
            --title "Yamachat 1.0.85" \
            --notes-file release-notes.md \
            --latest

      - name: Point Windows updater to 1.0.85
        run: |
          set -euo pipefail
          cp release-assets/latest.yml /tmp/yamachat-latest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-main origin/main

            python - <<'PY'
          import json, pathlib, re
          from datetime import datetime, timezone

          latest=pathlib.Path('/tmp/yamachat-latest.yml').read_text(encoding='utf-8')
          match=re.search(r"^version:\s*['\"]?([^'\"\s]+)",latest,re.M)
          if not match or match.group(1) != '1.0.85':
              raise SystemExit('latest.yml version mismatch')

          path=pathlib.Path('update-manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['publishedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          windows=manifest.setdefault('windows',{})
          windows['latestVersion']='1.0.85'
          windows['required']=True
          windows['releaseUrl']='https://github.com/yamboleeroy-ai/yamachat/releases/tag/v1.0.85'
          windows['notes']='Yamachat 1.0.85: výraznější cyan/fialový aktivní server a vizuální propojení se serverovým panelem; propojení neblokuje ovládání a voice, chat, tray, obnova hesla i Platform Admin zůstávají zachované.'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            git add update-manifest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish clean Windows updater 1.0.85 [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
