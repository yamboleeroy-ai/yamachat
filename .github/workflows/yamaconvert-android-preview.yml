name: Build YamaConvert Android preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'products/yamaconvert/android/**'
      - 'products/yamaconvert/pwa/downloads.js'
      - 'products/yamaconvert/tests/**'
      - '.github/workflows/yamaconvert-android-preview.yml'
  push:
    branches: [main]
    paths:
      - 'products/yamaconvert/android/**'
      - 'products/yamaconvert/pwa/downloads.js'
      - 'products/yamaconvert/tests/**'
      - '.github/workflows/yamaconvert-android-preview.yml'

permissions:
  contents: read

concurrency:
  group: yamaconvert-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: products/yamaconvert/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ffmpegkit-maintained/yt-dlp-android
          ref: 33a5b092896047f90f34c819926b0ac79683381f
          path: products/yamaconvert/android/.ci/yt-dlp-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build yt-dlp Android runtime with current extractor
        working-directory: products/yamaconvert/android/.ci/yt-dlp-android
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          build_file = Path("library/build.gradle")
          source = build_file.read_text()
          old = 'install "yt-dlp"'
          new = 'install "yt-dlp==2026.08.19"'
          if source.count(old) != 1:
              raise SystemExit("Could not pin the yt-dlp package in the Android runtime source.")
          source = source.replace(old, new)
          import re
          source, removed = re.subn(r"(?m)^[ \t]*signAllPublications\(\)[ \t]*\r?\n", "", source)
          if removed != 1:
              raise SystemExit(f"Expected one upstream Maven signing call, found {removed}.")
          build_file.write_text(source)
          PY
          chmod +x gradlew
          ./gradlew --no-daemon :library:publishToMavenLocal -PVERSION=2.0.3 -x test
      - name: Build the Android JavaScript runtime
        run: bash scripts/build-quickjs.sh
      - name: Verify product sources
        working-directory: .
        run: |
          node --check products/yamaconvert/pwa/downloads.js
          node --test products/yamaconvert/tests/*.test.cjs products/yamaconvert/downloader/tests/*.test.cjs
      - name: Build installable preview APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify preview package identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='eu.yamachat.yamaconvert.preview'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "sdkVersion:'26'"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libqjs.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libqjs.so'
      - uses: actions/upload-artifact@v4
        with:
          name: YamaConvert-Android-preview-${{ github.run_number }}
          path: products/yamaconvert/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

