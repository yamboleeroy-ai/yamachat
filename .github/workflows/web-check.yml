name: Desktop-derived web checks
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Resolve the pinned, current Windows release client.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate shared Web/PWA client from reviewed sources
        run: node scripts/build-web.mjs
      - run: node scripts/check.mjs
      - name: Verify proprietary legal baseline packaging
        run: node scripts/check-legal-baseline.mjs
      - run: node scripts/verify-stream-preview.cjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Legal UI structural checks
        run: node tests/legal-ui.mjs
      - name: Legal UI responsive visual checks
        run: node tests/legal-ui-visual.cjs
      - name: Platform install and login legal portal checks
        run: node tests/platform-install-ui.cjs
      - name: Upload legal UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yamachat-legal-ui-screens
          path: tests/legal-ui-screens/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Profile action tests
        run: node tests/profile-actions.cjs
      - name: Profile layout tests
        run: node tests/profile-layout.cjs
      - name: Password recovery tests
        run: node tests/password-recovery.cjs
      - name: Platform user management tests
        run: node tests/account-messages.cjs
      - name: Social release generated web/mobile smoke test
        run: node tests/social-release-web.cjs
      - name: Mobile Friends drawer one-tap switch
        run: node tests/mobile-friends-drawer.cjs
      - name: Mobile long-press, mic-test and notification preferences
        run: node tests/interaction-notifications.cjs
      - name: Current desktop behavior sync on shared web/mobile client
        run: node tests/web-mobile-desktop-behavior-sync.cjs
      - name: Cross-platform login bootstrap
        run: node tests/auth-login-flow.cjs
      - name: Repeated login logout lifecycle
        run: node tests/auth-relogin-lifecycle.cjs
      - name: Cross-platform voice interoperability
        run: node tests/cross-platform-voice-interop.cjs
      - name: Full authenticated platform journey
        run: node tests/full-platform-user-journey.cjs
      - name: Simultaneous multi-platform voice and stream
        run: node tests/cross-platform-multiclient-voice.cjs
      - name: 10-client cross-platform stability stress
        run: node tests/stability-10-client-load.cjs
      - name: Voice scale model
        run: node tests/voice-scale-model.cjs
      - name: Independent stream viewer and WebRTC lifecycle
        run: |
          node tests/stream-transport.mjs
          node tests/stream-viewer.cjs
      - run: node tests/stream-preview.cjs
      - run: node tests/voice-experience.cjs
      - run: node tests/voice-experience.cjs
        env:
          YC_CLIENT: desktop/desktop-client.html
      - name: Windows Microsoft Natural voice integration
        run: node tests/windows-natural-voices.cjs
      - name: Prepare web deployment
        run: |
          mkdir -p web-dist web-dist/legal
          cp index.html reset-password.html sw.js boot-guard.js favicon.ico manifest.webmanifest offline.html CNAME .nojekyll web-dist/
          cp -r icons audio vendor build download web-dist/
          cp LICENSE TERMS_OF_USE.md PRIVACY_POLICY.md BRAND-NOTICE.md PROVENANCE.md THIRD_PARTY_NOTICES.md LEGAL-BASELINE.md ASSET-MANIFEST.md web-dist/legal/
      - uses: actions/upload-artifact@v4
        with:
          name: Yamachat-Web
          path: web-dist
      - name: Publish generated Web/PWA client
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp index.html /tmp/yamachat-generated-index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-web origin/main
            cp /tmp/yamachat-generated-index.html index.html
            git add index.html
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish generated Yamachat Web/PWA client [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Web publish raced with another main update; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1
