name: Publish YamaConvert Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, for example 1.0.0'
        required: true
        type: string
      versionCode:
        description: 'Increasing Android version code, for example 10000'
        required: true
        type: string
      notes:
        description: 'Short release notes shown in Yamaportal'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yamaconvert-android-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: products/yamaconvert/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ffmpegkit-maintained/yt-dlp-android
          ref: 33a5b092896047f90f34c819926b0ac79683381f
          path: products/yamaconvert/android/.ci/yt-dlp-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build yt-dlp Android runtime with current extractor
        working-directory: products/yamaconvert/android/.ci/yt-dlp-android
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          build_file = Path("library/build.gradle")
          source = build_file.read_text()
          old = 'install "yt-dlp"'
          new = 'install "yt-dlp==2026.10.21"'
          if source.count(old) != 1:
              raise SystemExit("Could not pin the yt-dlp package in the Android runtime source.")
          source = source.replace(old, new)
          signing = "    signAllPublications()\n"
          if source.count(signing) != 1:
              raise SystemExit("Could not disable upstream Maven signing for local-only publication.")
          build_file.write_text(source.replace(signing, ""))

          PY
          chmod +x gradlew
          ./gradlew --no-daemon :library:publishToMavenLocal -PVERSION=2.0.3 -x test
      - name: Build the Android JavaScript runtime
        run: bash scripts/build-quickjs.sh
      - name: Test YamaConvert web and downloader
        working-directory: .
        run: |
          node --check products/yamaconvert/pwa/downloads.js
          node --check products/yamaconvert/pwa/batch-download.js
          node --test products/yamaconvert/tests/*.test.cjs products/yamaconvert/downloader/tests/*.test.cjs
      - name: Validate release identity and signing key
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CODE: ${{ inputs.versionCode }}
          KEYSTORE_BASE64: ${{ secrets.YAMACONVERT_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: yamaconvert
          KEY_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$INPUT_CODE" =~ ^[1-9][0-9]*$ ]]
          test "${#KEYSTORE_BASE64}" -gt 100
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yamaconvert-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/yamaconvert-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "YAMACONVERT_KEYSTORE_FILE=$RUNNER_TEMP/yamaconvert-release.jks" >> "$GITHUB_ENV"
          echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$INPUT_CODE" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        env:
          YAMACONVERT_STORE_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_STORE_PASSWORD }}
          YAMACONVERT_KEY_ALIAS: yamaconvert
          YAMACONVERT_KEY_PASSWORD: ${{ secrets.YAMACONVERT_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: E6:ED:B6:3B:36:F4:BF:CB:D4:00:60:2A:2E:0B:03:66:BE:FA:77:9B:3E:8B:FD:15:06:7F:46:73:35:74:23:58
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease -PyamaconvertVersionName="$VERSION" -PyamaconvertVersionCode="$VERSION_CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='eu.yamachat.yamaconvert'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'35'"
          SIGNER=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          ACTUAL=$(printf '%s\n' "$SIGNER" | sed -n -E 's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([0-9a-fA-F:]+)$/\3/p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED" || { echo 'APK signing certificate does not match the pinned YamaConvert certificate.'; exit 1; }
          mkdir -p release
          cp "$APK" release/YamaConvert-Android.apk
          (cd release && sha256sum YamaConvert-Android.apk > SHA256SUMS.txt)
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.versionCode }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          TAG="yamaconvert-v${VERSION}-${VERSION_CODE}"
          git fetch --tags
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/YamaConvert-Android.apk release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/YamaConvert-Android.apk release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "YamaConvert Android $VERSION" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Publish the signed APK to Yamaportal downloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" && test -n "${AWS_SECRET_ACCESS_KEY:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          FILE=release/YamaConvert-Android.apk
          EXPECTED=$(sha256sum "$FILE" | awk '{print $1}')
          test "${#EXPECTED}" = 64
          PUBLIC="https://updates.yamachat.eu/yamaconvert/YamaConvert-Android-$VERSION.apk"
          EXISTING="$RUNNER_TEMP/YamaConvert-Android-$VERSION-existing.apk"
          STATUS=$(curl --silent --show-error --max-time 30 --output "$EXISTING" --write-out '%{http_code}' "$PUBLIC?preflight=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true)
          if test "$STATUS" = 200; then
            test "$(sha256sum "$EXISTING" | awk '{print $1}')" = "$EXPECTED" || { echo 'Refusing to replace immutable YamaConvert APK bytes.'; exit 1; }
          elif test "$STATUS" = 404; then
            aws s3api put-object --bucket yamachat-releases --key "yamaconvert/YamaConvert-Android-$VERSION.apk" --body "$FILE" --content-type application/vnd.android.package-archive --content-disposition "attachment; filename=YamaConvert-Android-$VERSION.apk" --cache-control 'public, max-age=31536000, immutable' --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" --no-cli-pager
          else
            echo "Could not safely check the versioned APK (HTTP $STATUS)"
            exit 1
          fi
          VERIFIED="$RUNNER_TEMP/YamaConvert-Android-$VERSION-verified.apk"
          for n in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 30 "$PUBLIC?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$n" -o "$VERIFIED" && test "$(sha256sum "$VERIFIED" | awk '{print $1}')" = "$EXPECTED"; then break; fi
            test "$n" != 20 || { echo 'Versioned Yamaportal APK checksum verification failed.'; exit 1; }
            sleep 10
          done
          aws s3api put-object --bucket yamachat-releases --key 'yamaconvert/YamaConvert-Android-latest.apk' --body "$FILE" --content-type application/vnd.android.package-archive --content-disposition 'attachment; filename=YamaConvert-Android-latest.apk' --cache-control 'no-cache, no-store' --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" --no-cli-pager
          LATEST="$RUNNER_TEMP/YamaConvert-Android-latest.apk"
          curl --fail --silent --show-error --max-time 30 "https://updates.yamachat.eu/yamaconvert/YamaConvert-Android-latest.apk?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$LATEST"
          test "$(sha256sum "$LATEST" | awk '{print $1}')" = "$EXPECTED"

      - name: Add the verified Android release to Yamaportal history
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.versionCode }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const notes=String(process.env.NOTES||'').trim();
          if(!notes)throw Error('YamaConvert Android release notes are required.');
          const entry={id:`yamaconvert:android:${process.env.VERSION_CODE}`,app:'yamaconvert',kind:'update',version:`${process.env.VERSION} (${process.env.VERSION_CODE})`,title:`YamaConvert Android ${process.env.VERSION}`,summary:notes.split(/\n+/)[0],details:notes,releasedAt:new Date().toISOString(),platforms:['Android APK']};
          fs.writeFileSync('/tmp/portal-release-entry.json',JSON.stringify(entry));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B publish-main origin/main
          node scripts/record-portal-release.cjs /tmp/portal-release-entry.json
          git add release-feed.json
          git diff --cached --quiet || git commit -m "Record YamaConvert Android $VERSION release [skip ci]"
          git push origin HEAD:main
          RELEASE_ID="yamaconvert:android:${VERSION_CODE}"
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run yamaportal-pages-production.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_id="$RELEASE_ID"
          RUN_ID=''
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow yamaportal-pages-production.yml --repo "$GITHUB_REPOSITORY" --event workflow_dispatch --branch main --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$DISPATCHED_AT\")] | first | .databaseId // empty")
            test -n "$RUN_ID" && break
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not locate the Yamaportal production deployment run.'; exit 1; }
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

