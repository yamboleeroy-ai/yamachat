name: Yamachat Nexus Windows Preview
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/**'
      - 'windows/**'
      - '.github/workflows/desktop-nexus-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Nexus JS syntax
        shell: pwsh
        run: |
          node --check desktop/nexus-ui.js
          if (-not (Select-String -Path desktop/nexus-ui.css -Pattern 'data-yc-nexus' -Quiet)) { throw 'Nexus CSS scope missing' }
          if (-not (Select-String -Path desktop/desktop.html -Pattern 'ycNexusDesktopPreviewScript' -Quiet)) { throw 'Nexus loader missing' }

      - name: Guard no-touch voice and stream infrastructure
        shell: pwsh
        run: |
          git diff --exit-code 366eb4366a7596c5dd6deeb65acb6a94a693fe21 -- desktop/main.js desktop/preload.js desktop/notification-preload.js windows/process-audio web/stream-viewer.js web/stream-viewer.css
          if ($LASTEXITCODE -ne 0) { throw 'Protected voice/stream infrastructure changed in Nexus branch' }

      - name: Run voice and stream regression guards
        shell: pwsh
        run: |
          node tests/voice-experience.cjs
          node tests/stream-viewer.cjs
          node tests/windows-stream-lifecycle.cjs
          node tests/windows-process-audio.cjs
          node tests/windows-interaction-notifications.cjs
          node tests/windows-taskbar-restore.cjs

      - name: Build native process audio helper
        shell: pwsh
        run: ./scripts/build-windows-process-audio.ps1

      - name: Prepare desktop runtime
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force build desktop/build
          Copy-Item -Recurse -Force audio desktop/audio
          Copy-Item boot-guard.js desktop/boot-guard.js

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build unpacked Windows preview
        run: npx electron-builder --win dir --x64 --publish never
        working-directory: desktop

      - name: Isolate Nexus preview and verify packaged assets
        shell: pwsh
        run: |
          $appRoot='desktop/dist/win-unpacked/resources/app'
          Set-Content -Path "$appRoot/preview.json" -Value '{"kind":"nexus-desktop-ui","isolated":true,"release":false}' -Encoding UTF8
          foreach ($file in @('main.js','preload.js','desktop.html','desktop-client.html','nexus-ui.css','nexus-ui.js','preview.json')) {
            if (-not (Test-Path "$appRoot/$file")) { throw "Missing preview runtime: $file" }
          }
          if ((Get-FileHash "$appRoot/nexus-ui.css").Hash -ne (Get-FileHash 'desktop/nexus-ui.css').Hash) { throw 'Packaged Nexus CSS mismatch' }
          if ((Get-FileHash "$appRoot/nexus-ui.js").Hash -ne (Get-FileHash 'desktop/nexus-ui.js').Hash) { throw 'Packaged Nexus JS mismatch' }
          if ((Get-Content "$appRoot/desktop-client.html" -Raw) -notmatch 'nexusListPublicCommunities') { throw 'Nexus server browser bridge missing' }
          Compress-Archive -Path 'desktop/dist/win-unpacked/*' -DestinationPath 'yamachat-windows-nexus-ui-preview.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: yamachat-windows-nexus-ui-preview
          path: yamachat-windows-nexus-ui-preview.zip
          if-no-files-found: error
          retention-days: 7
